 {h:'Потребности бактерий в элементах и факторах роста',img:SVG_M02_NUTRI,body:`<p>Для построения клетки микроорганизмам необходимы макроэлементы, микроэлементы, вода и иногда готовые органические факторы роста. Питание — это не только получение энергии: часть веществ используется исключительно как строительный материал или кофактор ферментов.</p><table><thead><tr><th>Группа</th><th>Роль</th><th>Примеры</th></tr></thead><tbody><tr><td>Макроэлементы</td><td>Основная масса клеточных структур и метаболитов</td><td>C, H, O, N, P, S, K, Mg, Ca, Fe</td></tr><tr><td>Микроэлементы</td><td>Кофакторы и активные центры ферментов</td><td>Mn, Zn, Co, Mo, Ni, Cu</td></tr><tr><td>Факторы роста</td><td>Соединения, которые конкретный микроорганизм не синтезирует в достаточном количестве</td><td>Витамины, аминокислоты, пурины, пиримидины, гемин</td></tr><tr><td>Источники азота</td><td>Синтез аминокислот, нуклеотидов и других азотсодержащих молекул</td><td>Аммоний, нитраты, аминокислоты, пептоны</td></tr></tbody></table><p><b>Прототроф</b> способен синтезировать необходимые метаболиты из базовых питательных веществ. <b>Ауксотроф</b> имеет метаболический дефект и нуждается в добавлении конкретного фактора роста. Это свойство можно использовать в генетике и лабораторной селекции.</p><p><b>Требовательные бактерии:</b> Haemophilus influenzae нуждается в факторах X (гемин) и V (NAD); некоторые нейссерии и стрептококки требуют обогащённых сред. Важно знать не только название среды, но и какой фактор она предоставляет.</p><p><b>Источник:</b> пособие 2022, с. 39–41.</p>`},
 {h:'Мембранный транспорт: сравнение механизмов и примеры',img:SVG_M02_TRANSPORT,body:`<p>Цитоплазматическая мембрана бактерии обладает избирательной проницаемостью. Перенос питательных веществ может идти по градиенту концентрации или против него; во втором случае необходим источник энергии.</p><table><thead><tr><th>Механизм</th><th>Энергия</th><th>Особенности</th></tr></thead><tbody><tr><td>Простая диффузия</td><td>Не расходуется</td><td>По градиенту; без специфического переносчика</td></tr><tr><td>Облегчённая диффузия</td><td>Не расходуется напрямую</td><td>По градиенту через белок-канал или переносчик</td></tr><tr><td>Первично-активный транспорт</td><td>Прямая энергия АТФ или другого источника</td><td>Перенос против градиента; пример — ABC-транспортёры</td></tr><tr><td>Вторично-активный транспорт</td><td>Ионный градиент</td><td>Симпорт или антипорт с сопряжённым переносом ионов</td></tr><tr><td>Транслокация группы</td><td>Энергия фосфоенолпирувата в системе PTS</td><td>Субстрат химически модифицируется во время переноса</td></tr></tbody></table><p><b>Система PTS:</b> перенос сахара сопряжён с его фосфорилированием. Это одновременно обеспечивает поступление субстрата и удержание его внутри клетки в изменённой форме.</p><p><b>Диагностическая/клиническая связь:</b> транспортные системы влияют на спектр используемых субстратов, устойчивость к токсичным веществам и взаимодействие с хозяином. Нарушение проницаемости мембраны может быть мишенью антимикробных соединений.</p><p><b>Типичная ошибка:</b> активный транспорт — не синоним любой работы мембранного белка. Облегчённая диффузия тоже использует белок, но идёт по градиенту без затрат метаболической энергии.</p><p><b>Источник:</b> пособие 2022, с. 39–41.</p>`},
 {h:'Внеклеточные ферменты, секреция и питание за счёт сложных субстратов',img:SVG_M02_TRANSPORT,body:`<p>Крупные полимерные молекулы часто не могут пройти через бактериальную мембрану. Поэтому бактерии выделяют экзоферменты, которые расщепляют субстрат во внешней среде до более мелких молекул, пригодных для транспорта.</p><ul><li><b>Протеазы</b> расщепляют белки до пептидов и аминокислот.</li><li><b>Липазы</b> гидролизуют липиды.</li><li><b>Нуклеазы</b> расщепляют нуклеиновые кислоты.</li><li><b>Гиалуронидаза</b> разрушает гиалуроновую кислоту межклеточного матрикса и может способствовать распространению возбудителя.</li></ul><p><b>Секреторные системы</b> обеспечивают экспорт белков и доставку эффекторных молекул. У грамотрицательных бактерий существуют специализированные системы секреции (в том числе типы I–VI), различающиеся строением и механизмом переноса через оболочки. Для экзамена важно понимать общий принцип: секреция — направленный транспорт бактериальных белков, а не простая диффузия через мембрану.</p><p><b>Клинические примеры:</b> холерный токсин секретируется Vibrio cholerae; система секреции III типа у ряда грамотрицательных патогенов доставляет эффекторы в клетки хозяина. У Shigella система III типа участвует во взаимодействии с эпителием.</p><p><b>Ограничение:</b> наличие гена секреционной системы не всегда доказывает её экспрессию или функциональную активность в конкретном изоляте.</p><p><b>Источник:</b> пособие 2022, с. 39–41; экзаменационная тематика патогенности изучается далее отдельно.</p>`}

 {h:'Питательные среды: как выбирать среду под диагностическую задачу',img:SVG_M02_MEDIA,body:`<p>Выбор среды начинается не с запоминания названий, а с вопроса: <b>что нужно получить на данном этапе?</b> Первичный рост, преимущественное накопление целевой группы, различение ферментативных признаков, транспорт материала или поддержание жизнеспособности — разные задачи.</p><table><thead><tr><th>Тип среды</th><th>Для чего нужна</th><th>Пример/ориентир</th></tr></thead><tbody><tr><td>Основная</td><td>Рост неприхотливых бактерий</td><td>МПА, МПБ</td></tr><tr><td>Обогащённая</td><td>Рост требовательных микроорганизмов</td><td>Кровяной агар, шоколадный агар</td></tr><tr><td>Среда обогащения</td><td>Увеличение доли целевой группы в смешанном материале</td><td>Селенитовый бульон для селективного накопления сальмонелл в соответствующих схемах</td></tr><tr><td>Селективная/элективная</td><td>Подавление части сопутствующей флоры или преимущественная поддержка целевой группы</td><td>Среды с солями/ингибиторами; селективные варианты для энтеробактерий</td></tr><tr><td>Дифференциально-диагностическая</td><td>Различение по биохимической реакции</td><td>Эндо, МакКонки, среды Гисса</td></tr><tr><td>Транспортная</td><td>Сохранение жизнеспособности при доставке</td><td>Эймса, Кэри—Блэра</td></tr></tbody></table><p><b>Принципиальное различие:</b> селективность отвечает на вопрос «кто сможет расти», дифференциация — «чем выросшие микроорганизмы различаются». Одна среда может сочетать оба свойства.</p><p><b>Среды Гисса:</b> содержат отдельный углевод/спирт и индикатор pH; изменение цвета отражает образование кислых продуктов, а газ учитывают отдельным способом (например, поплавком, если он предусмотрен методикой). Результат интерпретируют по контролю и конкретной рецептуре.</p><p><b>Источник:</b> пособие 2022, с. 41–43.</p>`},
 {h:'Физико-химические требования к средам и контроль качества',img:SVG_M02_MEDIA,body:`<p>Питательная среда должна быть стерильной, иметь подходящие pH, осмотические условия и окислительно-восстановительный потенциал, содержать необходимые источники питания и сохранять свойства при хранении.</p><ul><li><b>pH:</b> влияет на активность ферментов и транспорт веществ. Рост меняет pH среды, поэтому применяют буферные системы.</li><li><b>Осмотическое давление:</b> чрезмерно гипо- или гипертоническая среда нарушает водный баланс клетки.</li><li><b>Окислительно-восстановительный потенциал:</b> особенно важен для анаэробов; восстановители помогают удалять растворённый кислород.</li><li><b>Стерильность:</b> предотвращает рост посторонней микрофлоры и ложную интерпретацию.</li><li><b>Воспроизводимость:</b> партии среды должны давать сопоставимые результаты; используют контрольные штаммы и контроль роста/ингибирования.</li></ul><p><b>Агар</b> — полисахаридный уплотнитель, который большинство медицински значимых бактерий не использует как основной источник питания. Его гелеобразование позволяет получать поверхность для изолированных колоний. Концентрация агара определяет плотность среды.</p><p><b>Диагностический акцент:</b> отсутствие роста нельзя автоматически трактовать как отсутствие возбудителя: причиной могут быть неподходящая среда, атмосфера, температура, длительность инкубации, предшествующая терапия или неправильная транспортировка.</p><p><b>Источник:</b> пособие 2022, с. 40–43.</p>`},
 {h:'Атмосфера культивирования: кислород, углекислый газ и восстановительные условия',img:SVG_M02_MEDIA,body:`<p>Отношение бактерий к кислороду определяется их энергетическими системами и устойчивостью к активным формам кислорода. Для практики важно не только знать группу, но и обеспечить соответствующую атмосферу при посеве.</p><table><thead><tr><th>Группа</th><th>Кислородная потребность</th><th>Примеры</th></tr></thead><tbody><tr><td>Облигатные аэробы</td><td>Нуждаются в O₂</td><td>Mycobacterium tuberculosis, Pseudomonas aeruginosa</td></tr><tr><td>Факультативные анаэробы</td><td>Растут с O₂ и без него</td><td>Escherichia coli, Staphylococcus aureus</td></tr><tr><td>Облигатные анаэробы</td><td>O₂ подавляет рост/повреждает клетку</td><td>Clostridium spp., Bacteroides spp.</td></tr><tr><td>Микроаэрофилы</td><td>Требуют сниженного O₂</td><td>Campylobacter jejuni, Helicobacter pylori</td></tr><tr><td>Капнофилы</td><td>Лучше растут при повышенном CO₂</td><td>Neisseria spp., Haemophilus influenzae</td></tr></tbody></table><p><b>Важно:</b> категории могут пересекаться: микроаэрофил — не просто «любит CO₂», а требует сниженного кислорода; капнофильность описывает потребность/предпочтение к повышенному CO₂.</p><p>Для анаэробов используют анаэростаты/камеры, газогенерирующие пакеты, редуцирующие среды и индикаторы анаэробиоза. Для капнофилов — CO₂-инкубаторы или соответствующие газогенерирующие системы.</p><p><b>Источник:</b> пособие 2022, с. 43–46.</p>`}
 ],
 '2.4':[
 {h:'Кривая роста: расчёт поколения и смысл фаз',img:SVG_M02_GROWTH,body:`<p>В периодической (batch-) культуре бактерии растут в ограниченном объёме среды без постоянного поступления свежего субстрата и удаления продуктов обмена. Поэтому численность жизнеспособной популяции меняется закономерно.</p><ol><li><b>Лаг-фаза:</b> адаптация, восстановление повреждений, синтез ферментов; число клеток может почти не увеличиваться.</li><li><b>Экспоненциальная фаза:</b> деление с относительно постоянным временем генерации; клетки физиологически активны.</li><li><b>Стационарная фаза:</b> скорость образования новых клеток приблизительно равна скорости гибели; влияют дефицит субстрата и накопление метаболитов.</li><li><b>Фаза отмирания:</b> число жизнеспособных клеток снижается; часть клеток может сохранять метаболическую активность.</li></ol><p><b>Расчёт:</b> при бинарном делении N = N₀ × 2ⁿ, где n — число поколений. Время генерации g = t/n. Формула применима к идеализированному экспоненциальному росту; в реальной культуре скорость зависит от условий и физиологического состояния.</p><p><b>Практическое значение:</b> фаза роста влияет на выраженность метаболических признаков, образование некоторых продуктов и чувствительность к препаратам, действующим на активно делящиеся клетки. Нельзя переносить эти закономерности без оговорок на все антибиотики и все микроорганизмы.</p><p><b>Источник:</b> пособие 2022, с. 46–47.</p>`},
 {h:'Колония и культуральные признаки: что описывать в протоколе',img:SVG_M02_GROWTH,body:`<p>Колония — видимое скопление микроорганизмов на плотной среде. При описании фиксируют стандартизированный набор признаков, поскольку внешний вид зависит от состава среды, температуры, атмосферы, длительности инкубации и возраста культуры.</p><div class="facts"><div class="fact"><strong>Форма и край</strong>Круглая, неправильная; край ровный, волнистый, лопастной и др.</div><div class="fact"><strong>Поверхность и рельеф</strong>Гладкая/шероховатая, плоская/выпуклая, с центральным возвышением или углублением.</div><div class="fact"><strong>Оптические свойства</strong>Прозрачная, полупрозрачная, мутная; блестящая или матовая.</div><div class="fact"><strong>Пигмент и среда</strong>Окраска колонии, диффузный пигмент, изменение цвета среды.</div><div class="fact"><strong>Гемолиз</strong>На кровяном агаре оценивают характер зоны вокруг колонии; тип гемолиза — вспомогательный признак.</div></div><p><b>Жидкая среда:</b> описывают равномерное помутнение, поверхностную плёнку, осадок, хлопья или пристеночный рост. Эти варианты не являются уникальными для вида.</p><p><b>Ключевая ловушка:</b> колония не равна виду. Культуральная морфология — ориентир для выбора дальнейших тестов, но идентификация требует совокупности морфологических, биохимических, антигенных или молекулярных данных.</p><p><b>Источник:</b> пособие 2022, с. 46–48.</p>`},
 {h:'Получение чистой культуры: логика этапов и контроль чистоты',img:SVG_M02_GROWTH,body:`<p><b>Чистая культура</b> нужна для достоверной идентификации и фенотипического определения чувствительности. Если исследовать смешанный рост, результаты биохимических реакций и антибиотикограммы могут быть недостоверными.</p><ol><li>Оценить материал, клиническую задачу и вероятность смешанной микрофлоры.</li><li>Выполнить первичный посев на подходящие основные, обогащённые и/или селективно-дифференциальные среды.</li><li>Получить изолированные колонии механическим разобщением (штриховой посев, секторный метод, разведения).</li><li>Выбрать отдельную типичную колонию и выполнить пересев на подходящую среду.</li><li>Проверить однотипность роста и микроскопическую однородность; при сомнении повторить пересев.</li><li>Провести идентификацию, затем при необходимости антибиотикограмму.</li></ol><p><b>Контроль:</b> чистота оценивается не только по внешнему виду колоний. Нужны согласованные результаты микроскопии и повторного роста. Одна колония может возникнуть из агрегата клеток, поэтому «одна колония» не гарантирует абсолютную чистоту без проверки.</p><p><b>Клинический пример:</b> при посеве мочи смешанный рост может отражать контаминацию при сборе, но может быть и полимикробной инфекцией в определённых обстоятельствах. Интерпретация зависит от качества сбора, количественного роста, симптомов и клинического контекста.</p><p><b>Источник:</b> пособие 2022, с. 47–48; экзаменационный вопрос №3.</p>`},
 {h:'Бактериологический метод: возможности, этапы и ограничения',img:SVG_M02_GROWTH,body:`<p>Бактериологический метод направлен на выделение жизнеспособного микроорганизма из материала пациента, получение чистой культуры, идентификацию и, когда требуется, определение чувствительности к антимикробным препаратам.</p><table><thead><tr><th>Этап</th><th>Ключевой вопрос</th><th>Типичная ошибка</th></tr></thead><tbody><tr><td>Преаналитика</td><td>Правильный материал, срок, объём, транспорт?</td><td>Поверхностный мазок вместо материала из очага; задержка доставки</td></tr><tr><td>Посев</td><td>Подходят ли среда и условия?</td><td>Не учтены анаэробиоз/CO₂/требовательность</td></tr><tr><td>Оценка роста</td><td>Есть ли колонии и каков характер роста?</td><td>Вид определяют только по цвету/форме колонии</td></tr><tr><td>Чистая культура</td><td>Подтверждена ли однородность?</td><td>Исследуют смешанную культуру</td></tr><tr><td>Идентификация</td><td>Подтверждён ли вид комплексом тестов?</td><td>Один биохимический тест трактуют как окончательный</td></tr><tr><td>Антибиотикограмма</td><td>Валидирован ли метод и критерии?</td><td>Интерпретация без учёта стандарта и вида бактерии</td></tr></tbody></table><p><b>Преимущества:</b> получение живого изолята, возможность фенотипической идентификации, оценки чувствительности и сохранения штамма для дополнительных исследований.</p><p><b>Ограничения:</b> длительность; влияние антибиотикотерапии; требовательность или некультивируемость отдельных микроорганизмов; ошибки забора и транспортировки; риск контаминации. Отрицательный посев не всегда исключает инфекцию.</p><p><b>Источник:</b> пособие 2022, с. 43–48; экзаменационные вопросы №3 и №18.</p>`}
 ],
 '2.5':[
 {h:'Бактериальный геном: хромосома, организация и экспрессия генов',img:SVG_M02_GENETICS,body:`<p>Геном — совокупность генетической информации организма. У большинства бактерий основная хромосома представлена двуцепочечной ДНК, часто кольцевой, организованной в нуклеоиде без ядерной мембраны. Существуют исключения с линейными и/или несколькими хромосомами.</p><ul><li><b>Нуклеоид</b> — область локализации и организации хромосомной ДНК; не является оформленным ядром.</li><li><b>Оперон</b> — функциональная группа генов, экспрессия которых регулируется совместно; часто имеет общий промотор и полицистронную мРНК.</li><li><b>Транскрипция</b> — синтез РНК на матрице ДНК; <b>трансляция</b> — синтез белка на рибосоме по матрице мРНК.</li><li>У бактерий транскрипция и трансляция могут быть сопряжены в пространстве и времени, поскольку нет ядерной оболочки.</li></ul><p><b>Диагностическое значение:</b> специфические участки генома применяют для идентификации, выявления генов токсинов и маркеров устойчивости, а также эпидемиологического типирования. Наличие гена не всегда означает его экспрессию и функциональный фенотип.</p><p><b>Экзаменационный акцент:</b> различай геном, хромосому, нуклеоид и плазмиду. Геном — весь набор информации; нуклеоид — область организации хромосомы; плазмида — внехромосомный репликон.</p><p><b>Источник:</b> пособие 2022, с. 49–55.</p>`},
 {h:'Мутации: типы, причины, последствия и лабораторное выявление',img:SVG_M02_MUTATION,body:`<p><b>Мутация</b> — устойчивое изменение последовательности генетического материала. Мутации возникают спонтанно или под действием мутагенов; их появление не направляется потребностью бактерии в конкретном признаке.</p><table><thead><tr><th>Тип</th><th>Молекулярное событие</th><th>Возможное следствие</th></tr></thead><tbody><tr><td>Замена</td><td>Один нуклеотид заменяется другим</td><td>Синонимическая, миссенс- или нонсенс-мутация</td></tr><tr><td>Вставка/делеция</td><td>Добавление или выпадение нуклеотидов</td><td>Сдвиг рамки считывания, если число не кратно трём</td></tr><tr><td>Крупная перестройка</td><td>Инверсия, дупликация, делеция, транслокация участков</td><td>Изменение экспрессии или утрата/приобретение функций</td></tr></tbody></table><p><b>Фенотипические последствия:</b> мутация может быть нейтральной, вредной или давать преимущество в определённых условиях. Антибиотик не «создаёт нужную мутацию» целенаправленно; он отбирает варианты, которые способны выживать при его воздействии.</p><p><b>Выявление:</b> фенотипический отбор/тестирование, ПЦР для известных мишеней, секвенирование для определения последовательности. Генотипический тест не всегда заменяет фенотипическое исследование чувствительности.</p><p><b>Источник:</b> пособие 2022, раздел генетики бактерий, с. 58–62.</p>`},
 {h:'Трансформация, трансдукция и конъюгация: механизмы переноса ДНК',img:SVG_M02_GENETICS,body:`<p>Горизонтальный перенос генетической информации позволяет бактериям приобретать признаки не только от родительской клетки, но и от других клеток или из окружающей среды.</p><div class="facts"><div class="fact"><strong>Трансформация</strong>Компетентная клетка захватывает свободную ДНК из среды; фаг не участвует. Пример: природная компетентность у ряда видов Streptococcus и Neisseria.</div><div class="fact"><strong>Трансдукция</strong>Бактериофаг переносит ДНК между бактериальными клетками. Различают генерализованную и специализированную трансдукцию.</div><div class="fact"><strong>Конъюгация</strong>Контакт-зависимый перенос ДНК от клетки-донора к реципиенту, часто с участием конъюгативной плазмиды и аппарата переноса.</div></div><p><b>Клиническое значение:</b> горизонтальный перенос может распространять гены антибиотикорезистентности и вирулентности. R-плазмиды и мобильные элементы особенно важны в эпидемиологии устойчивых Enterobacterales и других клинических патогенов.</p><p><b>Как различить в задаче:</b> свободная ДНК — трансформация; фаг как переносчик — трансдукция; непосредственный контакт клеток — конъюгация. Это три разных механизма, а не взаимозаменяемые названия.</p><p><b>Источник:</b> пособие 2022, с. 58–62; экзаменационный вопрос №23.</p>`},
 {h:'Плазмиды, транспозоны, IS-элементы и интегроны',img:SVG_M02_GENETICS,body:`<p><b>Плазмиды</b> — внехромосомные генетические элементы, способные к автономной репликации. Они могут нести гены устойчивости, вирулентности, бактериоциногении или метаболических свойств.</p><table><thead><tr><th>Элемент</th><th>Главная особенность</th><th>Клинический смысл</th></tr></thead><tbody><tr><td>F-плазмида</td><td>Гены конъюгации/переноса</td><td>Передача ДНК между клетками</td></tr><tr><td>R-плазмида</td><td>Детерминанты устойчивости</td><td>Распространение резистентности</td></tr><tr><td>Транспозон</td><td>Мобильный участок ДНК с геном транспозиции и структурными генами</td><td>Перемещение генов между репликонами</td></tr><tr><td>IS-элемент</td><td>Минимальный мобильный элемент, обычно несёт ген транспозазы и концевые повторы</td><td>Может вызывать инсерционные мутации</td></tr><tr><td>Интегрон</td><td>Система захвата и экспрессии ген-кассет</td><td>Накопление нескольких детерминант устойчивости</td></tr></tbody></table><p><b>Критическое различие:</b> интегрон сам по себе не обязательно является самостоятельным мобильным элементом; его распространение часто обеспечивается плазмидами и транспозонами. Транспозон способен перемещаться внутри генетических репликонов, а конъюгативные элементы могут обеспечивать межклеточную передачу.</p><p><b>Пример:</b> плазмидные гены β-лактамаз и карбапенемаз имеют большое значение для распространения устойчивости среди грамотрицательных бактерий.</p><p><b>Источник:</b> пособие 2022, с. 53–58.</p>`},
 {h:'Фаговая конверсия и лизогения: приобретение новых свойств',img:SVG_M02_GENETICS,body:`<p>Умеренный бактериофаг способен сохраняться в бактериальной клетке в виде профага. Состояние носительства профага называют лизогенией. При определённых условиях профаг может индуцироваться и переходить к литическому циклу.</p><p><b>Фаговая (лизогенная) конверсия</b> — изменение свойств бактерии вследствие присутствия и экспрессии генов профага. Это может менять токсигенность, антигенные или иные биологические свойства бактерии.</p><div class="fact"><strong>Классический клинический пример</strong>Токсигенность Corynebacterium diphtheriae связана с tox-геном β-фага. Наличие соответствующего фага может обусловить способность штамма продуцировать дифтерийный токсин; само обнаружение вида C. diphtheriae не равно доказанной токсигенности.</div><p><b>Не путай с трансдукцией:</b> при трансдукции фаговая частица переносит фрагмент бактериальной ДНК донора; при фаговой конверсии свойства меняются из-за генов самого профага. В экзаменационной задаче это различие принципиально.</p><p><b>Источник:</b> пособие 2022, с. 60–62; экзаменационная тематика генетики и бактериофагов.</p>`},
 {h:'ПЦР и молекулярная диагностика: этапы, контроль и ограничения',img:SVG_M02_GENETICS,body:`<p>ПЦР — метод многократного копирования заданного участка ДНК in vitro. Для РНК-мишеней перед амплификацией выполняют обратную транскрипцию с получением кДНК.</p><ol><li><b>Денатурация:</b> разделение цепей ДНК.</li><li><b>Отжиг праймеров:</b> связывание праймеров с комплементарными участками-мишенями.</li><li><b>Элонгация:</b> ДНК-полимераза синтезирует новые цепи.</li></ol><p><b>Контроли:</b> положительный контроль подтверждает работоспособность реакции; отрицательный контроль выявляет контаминацию реагентов; внутренний контроль помогает оценить качество материала и наличие ингибирования. Для интерпретации важны клинический материал, сроки, аналитическая чувствительность и специфичность.</p><p><b>ПЦР в реальном времени</b> регистрирует флуоресцентный сигнал в ходе реакции. Значение Ct/Cq интерпретируют только в рамках валидированной системы и не переводят автоматически в количество микроорганизмов без калибровки.</p><p><b>Ограничения:</b> выявление нуклеиновой кислоты не всегда доказывает жизнеспособность микроорганизма; контаминация может дать ложноположительный результат; ингибиторы или неправильный забор — ложноотрицательный. ПЦР на ген устойчивости не всегда заменяет фенотипическую антибиотикограмму.</p><p><b>Источник:</b> пособие 2022, с. 63–65.</p>`}
 ]

 <div class="qmeta"><span>Задание ${MS.index+1} из ${total}</span><span>Верно с первой попытки: ${MS.first.size}</span></div><div class="bar"><i style="width:${progress}%"></i></div>
 <div class="card"><div class="micro-stat">${t.caseTitle} · признак ${t.taskNo} из ${t.taskTotal}</div><div class="micro-image">${t.img}</div>
 <div class="micro-prompt">${t.q}</div><div class="opts">${t.o.map((o,i)=>{let cls='';if(MS.answered!==null){if(i===t.a)cls='good';else if(i===MS.answered)cls='wrong';}return `<button class="opt ${cls}" ${MS.answered!==null?'disabled':''} onclick="pickMicro(${i})"><span class="let">${letters[i]}</span><span>${o}</span></button>`;}).join('')}</div>
 ${MS.answered===null?(MS.showHints?`<button class="hintbtn" onclick="showMicroHint()">Показать ориентир</button>${MS.hint?`<div class="hintbox">Сначала определи тип изображения и только затем оценивай форму/структуру. Не делай видовой вывод по одному признаку.</div>`:''}`:'<div class="micro-note">Режим без подсказок включён.</div>'):
 `<div class="micro-feedback ${MS.answered===t.a?'good':'bad'}"><b>${MS.answered===t.a?'Верно!':'Не совсем. Правильный ответ: '+t.o[t.a]+'.'}</b><br>${t.e}</div><button class="btn" style="width:100%;margin-top:14px" onclick="nextMicro()">${MS.index===total-1?'Завершить →':'Следующее задание →'}</button>`}</div>`;
 scrollTo(0,0);
}
window.showMicroHint=()=>{MS.hint=true;render();};
window.pickMicro=i=>{const t=MS.tasks[MS.index],key=t.caseId+'_'+t.taskNo;MS.answered=i;if(i===t.a){if(MS.phase==='main')MS.first.add(key);}else if(!MS.wrong.includes(key))MS.wrong.push(key);render();};
window.nextMicro=()=>{MS.answered=null;MS.hint=false;if(MS.index<MS.tasks.length-1){MS.index++;render();return;}if(MS.wrong.length&&MS.phase==='main'){MS.phase='repeat';const wrongKeys=MS.wrong;MS.tasks=allMicroTasks().filter(t=>wrongKeys.includes(t.caseId+'_'+t.taskNo));MS.index=0;MS.wrong=[];return render();}let prev=[];try{prev=JSON.parse(localStorage.getItem('micro_wrong_v1')||'[]');if(!Array.isArray(prev))prev=[];}catch(e){}let all=allMicroTasks();let incorrect=new Set(MS.wrong);let keys=all.map(t=>t.caseId+'_'+t.taskNo);let merged=[...new Set([...prev.filter(k=>!keys.includes(k)),...MS.wrong])];try{localStorage.setItem('micro_wrong_v1',JSON.stringify(merged));}catch(e){}v24Record('micro',MS.first.size,MS.mainTotal);S.view='microdone';render();};
function microDone(){const total=MS.mainTotal,correct=MS.first.size,pct=Math.round(correct/total*100);app.innerHTML=`<div class="card" style="text-align:center"><div class="ring"><div class="big">${pct}%</div></div><h2>Практикум завершён</h2><p class="sub">${correct} из ${total} заданий решено верно с первой попытки.</p><p class="micro-stat">Ошибки сохранены локально и доступны для отдельного повторения.</p></div><div class="row" style="flex-wrap:wrap;margin-top:14px"><button class="btn" onclick="startMicroQuiz(false)">Пройти снова</button><button class="btn ghost" onclick="startMicroQuiz(true)">Повторить ошибки</button><button class="btn ghost" onclick="openMicroMode()">К практикуму</button></div>`;}


// v2.5.2: подмодуль 1.2 расширен до 9 теоретических карточек; остальные механизмы сохранены
const V24_KEY='micro_trainer_v24_state';
let V24_STATS={completed:0,answers:0,correct:0,sessions:{},lastActivity:null};
let V24_RESTORED=false;
function v24Snapshot(){
  return {
    version:1, savedAt:Date.now(),
    S:{...S,mod:S.mod?.id||null,first:S.first?[...S.first]:[]},
    MS:{...MS,tasks:MS.tasks.map(t=>t.caseId+'_'+t.taskNo),first:[...MS.first]},
    CX:{...CX,cases:CX.cases.map(c=>c.id)}
  };
}
function v24Save(){
  try{localStorage.setItem(V24_KEY,JSON.stringify(v24Snapshot()));}catch(e){}
}
function v24Record(type,score,total){
  V24_STATS.completed++;
  V24_STATS.sessions[type]=(V24_STATS.sessions[type]||0)+1;
  V24_STATS.answers+=Math.max(0,total||0);
  V24_STATS.correct+=Math.max(0,score||0);
  V24_STATS.lastActivity=Date.now();
  try{localStorage.setItem('micro_trainer_v24_stats',JSON.stringify(V24_STATS));}catch(e){}
}
function v24Restore(){
  if(V24_RESTORED)return; V24_RESTORED=true;
  try{
    const st=JSON.parse(localStorage.getItem('micro_trainer_v24_stats')||'null');
    if(st&&typeof st==='object')V24_STATS={...V24_STATS,...st};
    const raw=JSON.parse(localStorage.getItem(V24_KEY)||'null');
    if(!raw||raw.version!==1)return;
    if(raw.S){
      const x=raw.S; S={...S,...x};
      S.mod=typeof x.mod==='string'?MODULES.find(m=>m.id===x.mod)||null:null;
      S.first=new Set(Array.isArray(x.first)?x.first:[]);
      if(S.view==='theory'&&(!S.mod||!S.mod.theory[S.slide])){S.view='home';S.mod=null;S.slide=0;}
      if(S.view==='quiz'&&(!S.mod||!Array.isArray(S.order)||!S.order.length||S.qi>=S.order.length)){S.view='home';}
    }
    if(raw.MS){
      const x=raw.MS, map=new Map(allMicroTasks().map(t=>[t.caseId+'_'+t.taskNo,t]));
      MS={...MS,...x,tasks:(x.tasks||[]).map(k=>map.get(k)).filter(Boolean),first:new Set(x.first||[])};
      if(['microquiz'].includes(S.view)&&(!MS.tasks.length||MS.index>=MS.tasks.length))S.view='micro';
    }
    if(raw.CX){
      const x=raw.CX, map=new Map(COMPLEX_CASES.map(c=>[c.id,c]));
      CX={...CX,...x,cases:(x.cases||[]).map(k=>map.get(k)).filter(Boolean)};
      if(S.view==='complex'&&(!CX.cases.length||CX.index>=CX.cases.length))S.view='micro';
    }
  }catch(e){S.view='home';}
}
function v24Dashboard(){
 const pct=V24_STATS.answers?Math.round(V24_STATS.correct/V24_STATS.answers*100):0;
 return `<section class="card" style="margin:14px 0"><div class="row sp"><b>Мой прогресс</b><span class="tag">v2.5.2</span></div><div class="stats-grid" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px"><div><div class="big">${V24_STATS.completed}</div><small class="sub">завершено</small></div><div><div class="big">${V24_STATS.answers}</div><small class="sub">ответов</small></div><div><div class="big">${pct}%</div><small class="sub">точность</small></div></div><p class="sub" style="margin-bottom:0">Прогресс и незавершённые занятия сохраняются на этом устройстве.</p></section>`;
}
function render(){
  v24Restore(); v24Save();
  if(S.view==='home') return home();
  if(S.view==='theory') return theory();
  if(S.view==='quiz') return quiz();
  if(S.view==='done') return done();
  if(S.view==='micro') return microHome();
  if(S.view==='microquiz') return microQuiz();
  if(S.view==='microdone') return microDone();
  if(S.view==='complex') return complexQuiz();
  if(S.view==='complexdone') return complexDone();
}

function home(){
  const m1mods = MODULES.filter(m => String(m.id).startsWith('1.'));
  const m2mods = MODULES.filter(m => String(m.id).startsWith('2.'));
  const rest = MODULES.filter(m => !m1mods.includes(m) && !m2mods.includes(m));
  app.innerHTML = `
  <h1>Микробиология: тренажёр к экзамену</h1>
  ${v24Dashboard()}
  <button class="micro-entry" onclick="openMicroMode()"><span class="micro-icon">🔬</span><span><strong>Распознавание микропрепаратов</strong><small>Практика по микрофотографиям: морфология, окраска и метод микроскопии. С подсказками или в экзаменационном режиме.</small></span><span style="margin-left:auto;font-size:20px">→</span></button>
  <p class="sub">Модули 1 и 2 разбиты на самостоятельные подмодули. Теория, схемы, тесты с объяснениями и повторение ошибок.</p>
  <div class="group"><h2>Модуль 1. Морфология, структура, микроскопия</h2>
  <p class="sub">Вопросы перечня: 4, 20, 29, 33, 37, 44, 52, 53</p></div>
  ${m1mods.map(m => {
    const r = S.results[m.id];
    return `<button class="mod" onclick="openModById('${m.id}')">
      <div class="modnum">${m.id}</div>
      <div style="flex:1;min-width:0"><div class="modttl">${m.title}</div>
      <div class="modmeta">${m.qs} · теория + ${m.quiz.length} вопросов</div></div>
      ${r !== undefined ? `<span class="score-pill">${r}%</span>` : `<span class="tag">начать</span>`}
    </button>`;
  }).join('')}
  <div class="group"><h2>Модуль 2. Физиология, культивирование и генетика бактерий</h2><p class="sub">Пять самостоятельных подмодулей: от обмена веществ до молекулярной диагностики. Теория разбита на последовательные занятия, тесты распределены по темам.</p></div>
  ${m2mods.map(m => {
    const r = S.results[m.id];
    return `<button class="mod" onclick="openModById('${m.id}')">
      <div class="modnum">${m.id}</div>
      <div style="flex:1;min-width:0"><div class="modttl">${m.title}</div>
      <div class="modmeta">${m.qs} · ${m.theory.length} карточек теории + ${m.quiz.length} вопросов</div></div>
      ${r !== undefined ? `<span class="score-pill">${r}%</span>` : `<span class="tag">начать</span>`}
    </button>`;
  }).join('')}
  <div class="group"><h2>Следующие модули</h2><p class="sub">Разделы открываются после подготовки полного учебного пакета.</p></div>
  ${rest.map(m => `<button class="mod" data-locked="1">
    <div class="modnum">${m.id}</div>
    <div style="flex:1;min-width:0"><div class="modttl">${m.title}</div>
    <div class="modmeta">${m.qs} · <i>скоро</i></div></div>
    <span class="tag grey">скоро</span></button>`).join('')}
  <p class="legend">Итоговые проценты, незавершённые занятия и положение внутри теории/теста сохраняются локально на этом устройстве при доступном хранилище браузера. Микрофотографии встроены в файл и доступны без интернета.</p>`;
}

window.openModById = id => {
  S.mod = MODULES.find(m => String(m.id) === String(id));
  if(!S.mod || S.mod.locked) return;
  S.view = 'theory'; S.slide = 0; scrollTo(0,0); render();
};

function formatTheoryTables(html){
  const parser = new DOMParser();
  const doc = parser.parseFromString('<div id="theory-root">'+html+'</div>', 'text/html');
  doc.querySelectorAll('#theory-root table').forEach(table => {
    const headers = [...table.querySelectorAll('thead th')].map(x => x.textContent.trim());
    const rows = [...table.querySelectorAll('tbody tr')];
    if(!rows.length) return;
    const cards = doc.createElement('div');
    cards.className = 'theory-cards' + (headers.length > 2 ? ' compare' : '');
    rows.forEach(row => {
      const cells = [...row.querySelectorAll('th,td')].map(x => x.innerHTML.trim());
      if(!cells.length) return;
      const card = doc.createElement('section');
      card.className = 'theory-card';
      const title = doc.createElement('div');
      title.className = 'theory-card-title';
      title.innerHTML = cells[0];
      card.appendChild(title);
      cells.slice(1).forEach((value, i) => {
        const detail = doc.createElement('div');
        detail.className = 'theory-card-detail';
        const label = headers[i+1] || (cells.length===2 ? 'Описание' : 'Характеристика');
        detail.innerHTML = '<b>'+label.replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))+'</b> '+value;
        card.appendChild(detail);
      });
      cards.appendChild(card);
    });
    table.replaceWith(cards);
  });
  return doc.querySelector('#theory-root').innerHTML;
}

function theory(){
  const m = S.mod, t = m.theory[S.slide], last = S.slide === m.theory.length - 1;
  app.innerHTML = `
  <div class="row sp" style="margin-bottom:14px">
    <span class="tag">Подмодуль ${m.id} · теория ${S.slide+1}/${m.theory.length}</span>
    <button class="btn ghost" onclick="goHome()">← модули</button>
  </div>
  <div class="card theory">
    <h2>${t.h}</h2>
    ${t.img ? `<div class="slide-img">${t.img}</div>` : ''}
    ${(m.id === '1.2' || m.id === '1.3' || String(m.id).startsWith('2.')) ? formatTheoryTables(t.body) : t.body}
  </div>
  <div class="row sp" style="margin-top:16px">
    <button class="btn ghost" ${S.slide ? '' : 'disabled'} onclick="slide(-1)">Назад</button>
    ${last ? `<button class="btn" onclick="startQuiz()">К тесту →</button>` : `<button class="btn" onclick="slide(1)">Дальше</button>`}
  </div>
  <div class="dots">${m.theory.map((_,i) => `<span class="dot ${i===S.slide?'on':''}"></span>`).join('')}</div>`;
  scrollTo(0,0);
}
window.slide = d => { if(!S.mod)return; S.slide = Math.max(0, Math.min(S.mod.theory.length-1, S.slide + d)); render(); };
window.goHome = () => { S.view = 'home'; render(); };

window.exitQuiz = () => {
  if(!confirm('Выйти из теста и вернуться к теории? Результат этой попытки не будет записан.')) return;
  S.view = 'theory'; S.answered = null; S.hint = false; render();
};

window.startQuiz = () => {
  S.view = 'quiz'; S.qi = 0; S.answered = null; S.hint = false; S.wrong = []; S.phase = 'main';
  S.order = S.mod.quiz.map((_,i) => i); S.first = new Set(); render();
};

function quiz(){
  const m = S.mod, idx = S.order[S.qi], q = m.quiz[idx];
  const letters = ['а','б','в','г','д'];
  const prog = Math.round((S.qi + (S.answered !== null ? 1 : 0)) / S.order.length * 100);
  const repeat = S.phase === 'repeat';
  app.innerHTML = `
  <div class="quiz-head"><span class="tag">${repeat ? '🔁 Повторение ошибок' : 'Подмодуль '+m.id+' · тест'} · вопрос ${S.qi+1} из ${S.order.length}</span><button class="btn ghost quiz-exit" onclick="exitQuiz()">← Выйти из теста</button></div>
  <div class="bar"><i style="width:${prog}%"></i></div>
  <div class="card">
    <div class="qtext">${q.q}</div>
    ${q.topic ? `<div class="tag" style="margin:0 0 10px">${q.topic}</div>` : ''}
    ${q.img ? `<div class="slide-img" style="max-width:280px;margin:12px auto">${q.img}</div>` : ''}
    <div class="opts">
      ${q.o.map((o,i) => {
        let cls = '';
        if(S.answered !== null){ if(i === q.a) cls = 'good'; else if(i === S.answered) cls = 'wrong'; }
        return `<button class="opt ${cls}" ${S.answered!==null?'disabled':''} onclick="pick(${i})">
          <span class="let">${letters[i]}</span><span>${o}</span></button>`;
      }).join('')}
    </div>
    ${S.answered === null
      ? (q.h ? (S.hint ? `<div class="hintbox">💡 ${q.h}</div>` : `<button class="hintbtn" onclick="showHint()">Показать подсказку</button>`) : '')
      : `<div class="fb ${S.answered===q.a?'good':'bad'}">
         <b>${S.answered===q.a?'Верно.':'Неверно — правильный ответ «'+letters[q.a]+'».'}</b>${q.e}</div>
       <div class="row" style="margin-top:14px">
         <button class="btn" onclick="next()">${S.qi === S.order.length-1 ? (S.phase==='main' && S.wrong.length ? 'К повторению ошибок →' : 'Итоги →') : 'Следующий вопрос →'}</button>
       </div>`}
  </div>`;
  scrollTo(0,0);
}
window.showHint = () => { S.hint = true; render(); };
window.pick = i => {
  const idx = S.order[S.qi], q = S.mod.quiz[idx];
  S.answered = i;
  if(i === q.a){ if(S.phase === 'main') S.first.add(idx); S.wrong = S.wrong.filter(x => x !== idx); }
  else if(!S.wrong.includes(idx)) S.wrong.push(idx);
  render();
};
window.next = () => {
  S.answered = null; S.hint = false;
  if(S.qi < S.order.length - 1){ S.qi++; return render(); }
  if(S.wrong.length){ S.phase = 'repeat'; S.order = [...S.wrong]; S.qi = 0; return render(); }
  S.view = 'done';
  v24Record('quiz:'+S.mod.id,S.first.size,S.mod.quiz.length);
  const pct = Math.round(S.first.size / S.mod.quiz.length * 100);
  S.results[S.mod.id] = pct; save(); render();
};

function done(){
  const m = S.mod, pct = Math.round(S.first.size / m.quiz.length * 100);
  const missed = m.quiz.map((q,i) => ({q,i})).filter(({i}) => !S.first.has(i));
  const topicStats = [...new Set(m.quiz.map(q => q.topic || 'Общее'))].map(topic => {
    const items = m.quiz.map((q,i) => ({q,i})).filter(x => (x.q.topic || 'Общее') === topic);
    const correct = items.filter(x => S.first.has(x.i)).length;
    return {topic, correct, total:items.length, pct:Math.round(correct/items.length*100)};
  });
  const verdict = pct >= 90 ? 'Отличный результат — подмодуль можно считать закрытым.'
    : pct >= 70 ? 'Хорошо. Ниже — то, что стоит перечитать.'
    : 'Есть что подтянуть. Пролистай теорию ещё раз и пройди тест повторно.';
  const idx = SUB_IDS.indexOf(m.id);
  const nextId = idx >= 0 && idx < SUB_IDS.length - 1 ? SUB_IDS[idx + 1] : null;
  const nextMod = nextId ? MODULES.find(x => x.id === nextId) : null;

  app.innerHTML = `
  <div class="card" style="text-align:center">
    <div class="ring"><div class="big" style="color:${pct>=70?'var(--ok)':'var(--amber)'}">${pct}%</div></div>
    <h2>Тест завершён</h2>
    <p class="sub">${verdict}</p>
  </div>
  <div class="card">
    <h3 style="margin-bottom:10px">Результат по темам</h3>
    ${topicStats.map(x => `<div class="topic-stat"><div class="row sp"><span>${x.topic}</span><b>${x.correct}/${x.total} · ${x.pct}%</b></div><div class="bar"><i style="width:${x.pct}%"></i></div></div>`).join('')}
  </div>
  ${missed.length ? `<div class="card">
    <span class="tag">Разбор вопросов с ошибками</span>
    ${missed.map(({q}) => `<div class="mistake"><div class="t">${q.q.replace(/<[^>]+>/g,'')}</div>
      <div class="m">${q.o[q.a]} — ${q.e}</div></div>`).join('')}
  </div>` : ''}
  <div class="row" style="margin-top:16px;flex-wrap:wrap">
    <button class="btn" onclick="startQuiz()">Пройти тест заново</button>
    <button class="btn ghost" onclick="toTheory()">Перечитать теорию</button>
    ${nextMod ? `<button class="btn" onclick="openModById('${nextId}')">Следующий подмодуль → ${nextMod.title}</button>` : ''}
    <button class="btn ghost" onclick="goHome()">К модулям</button>
  </div>`;
  scrollTo(0,0);
}
window.toTheory = () => { S.view = 'theory'; S.slide = 0; render(); };
render();

</script>
