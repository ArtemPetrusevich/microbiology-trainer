addTheory('1.4',[
{h:'1. Простые, сложные и специальные методы окраски',img:SVG14_SIMPLE,body:`
<p><b>Тинкториальные свойства</b> — способность микробных клеток и их структур воспринимать и удерживать красители. Окраска повышает контраст и помогает оценить морфологию, отдельные структуры и некоторые диагностически значимые свойства.</p>
<div class="facts"><div class="fact"><strong>Простая окраска</strong>Используется один краситель: метиленовый синий, основной фуксин или генцианвиолет. Позволяет оценить форму, размер и взаимное расположение клеток.</div><div class="fact"><strong>Сложная / дифференциальная</strong>Использует несколько красителей, протравы и/или обесцвечивающие растворы. Пример — окраска по Граму.</div><div class="fact"><strong>Специальная</strong>Направлена на определённые структуры или свойства: споры (Ожешко), капсула (Бурри–Гинс), волютин (Нейссер), кислотоустойчивость (Циль–Нильсен).</div></div>
<p><b>Выбор метода начинается с диагностического вопроса:</b> нужно ли увидеть общую морфологию, разделить бактерии на группы или выявить конкретную структуру?</p><p class="note">По пособию: с. 15–18. Окраска — метод визуализации, а не автоматическая видовая идентификация.</p>`},
{h:'2. Приготовление и фиксация мазка',img:SVG14_SMEAR,body:`
<p>Качество окраски начинается до нанесения красителя. Материал распределяют тонким равномерным слоем на чистом обезжиренном предметном стекле, затем высушивают и фиксируют выбранным способом.</p>
<ol><li>Подготовить чистое предметное стекло.</li><li>Нанести небольшое количество материала и распределить тонким слоем.</li><li>Полностью высушить мазок на воздухе.</li><li>Зафиксировать подходящим способом.</li><li>Окрасить по выбранной методике, промыть, высушить и микроскопировать.</li></ol>
<div class="facts"><div class="fact"><strong>Зачем фиксируют</strong>Инактивировать материал, закрепить клетки на стекле и повысить восприимчивость к красителям.</div><div class="fact"><strong>Фиксация жаром</strong>В пособии описано проведение стекла мазком вверх через пламя 2–3 раза после высушивания.</div><div class="fact"><strong>Жидкие фиксаторы</strong>В пособии перечислены смесь Никифорова, 5% формалин и метанол; выбор зависит от материала и методики.</div></div>
<p><b>Типичные ошибки:</b> толстый мазок, неполное высушивание, перегрев, загрязнённое стекло, неподходящий фиксатор. Они могут исказить морфологию и результат окраски.</p><p class="note">По пособию: с. 15–16. Не переносить фиксацию жаром на методы, где требуется сохранение нативной структуры капсулы или иных чувствительных компонентов.</p>`},
{h:'3. Окраска по Граму: принцип и этапы',img:SVG14_GRAM,body:`
<p>Окраска по Граму — основной дифференциальный метод первичной бактериоскопии. Она разделяет бактерии по способности удерживать комплекс основного красителя с йодом после обработки обесцвечивающим агентом. Результат связан с особенностями клеточной оболочки, но не сводится к одному только «толстому или тонкому слою».</p>
<table><thead><tr><th>Этап</th><th>Реагент</th><th>Роль</th></tr></thead><tbody><tr><td>1</td><td>Генциан-фиолетовый</td><td>Первичная окраска, около 1 минуты</td></tr><tr><td>2</td><td>Раствор Люголя</td><td>Протрава; около 1 минуты, по пособию наносят без предварительного смывания красителя</td></tr><tr><td>3</td><td>Спирт</td><td>Дифференцирующее обесцвечивание, около 10 секунд</td></tr><tr><td>4</td><td>Водный фуксин</td><td>Контрастное докрашивание, около 1 минуты</td></tr></tbody></table>
<div class="facts"><div class="fact"><strong>Грамположительные</strong>Сине-фиолетовые: удерживают комплекс основного красителя с йодом после обесцвечивания.</div><div class="fact"><strong>Грамотрицательные</strong>Красные/розовые: обесцвечиваются спиртом и воспринимают контрастный краситель.</div></div>
<p><b>Примеры:</b> Staphylococcus aureus и Streptococcus pyogenes — типичные Гр+; Escherichia coli и Neisseria meningitidis — Гр−.</p><p class="note">По пособию: с. 16. Избыточное обесцвечивание, старые культуры, повреждённые клетки и толстый мазок могут давать вариабельную или грамвариабельную картину.</p>`},
{h:'4. Окраска по Цилю–Нильсену',img:SVG14_ZN,body:`
<p>Метод выявляет <b>кислотоустойчивые бактерии</b>. Их липид-богатая оболочка с миколовыми кислотами способствует удержанию карболового фуксина при последующем кислотном обесцвечивании.</p>
<ol><li>Нанести карболовый фуксин Циля на нефиксированный мазок.</li><li>Осторожно нагревать до появления паров в течение 3–5 минут, не допуская высыхания и перегрева.</li><li>Промыть водой.</li><li>Обесцветить 5% раствором серной кислоты 1–2 минуты и снова промыть.</li><li>Докрасить метиленовым синим 3–5 минут, промыть и высушить.</li></ol>
<div class="facts"><div class="fact"><strong>Кислотоустойчивые</strong>Красные/малиновые палочки сохраняют карболовый фуксин.</div><div class="fact"><strong>Некислотоустойчивые элементы</strong>Обесцвечиваются и воспринимают метиленовый синий — синий фон.</div><div class="fact"><strong>Примеры</strong>Mycobacterium tuberculosis, M. leprae и другие микобактерии. Нокардии могут быть частично кислотоустойчивыми.</div></div>
<p><b>Диагностическая оговорка:</b> положительная микроскопия мокроты указывает на наличие кислотоустойчивых бактерий, но сама по себе не устанавливает вид и не заменяет молекулярное исследование/посев. Отрицательный мазок не исключает туберкулёз.</p><p class="note">По пособию: с. 16–17. Время и состав реагентов приводятся по учебному пособию; в лаборатории следуют утверждённой СОП.</p>`},
{h:'5. Окраска спор по Ожешко',img:SVG14_OJ,body:`
<p>Окраска по Ожешко применяется для выявления эндоспор. Предварительная обработка кислотой с нагреванием облегчает проникновение красителя в устойчивую споровую структуру.</p>
<ol><li>На нефиксированный мазок наносят 0,5% раствор HCl и нагревают 2–3 минуты.</li><li>Кислоту сливают, препарат промывают, высушивают и фиксируют.</li><li>Через фильтровальную бумагу наносят карболовый фуксин Циля и нагревают до появления паров 3–5 минут.</li><li>Промывают, обесцвечивают 5% H₂SO₄ 1–2 минуты, снова промывают.</li><li>Докрашивают метиленовым синим 3–5 минут, промывают и высушивают.</li></ol>
<div class="facts"><div class="fact"><strong>Эндоспоры</strong>Красные.</div><div class="fact"><strong>Вегетативные клетки</strong>Синие.</div><div class="fact"><strong>Примеры</strong>Bacillus и Clostridium; выявление спор помогает описать морфологию, но не определяет вид автоматически.</div></div>
<p><b>Диагностическое значение:</b> демонстрация спорообразования поддерживает предварительную идентификацию и помогает отличить спорообразующие палочки от неспорообразующих, но требует подтверждения другими признаками.</p><p class="note">По пособию: с. 17. Не путай метод Ожешко с окраской по Цилю–Нильсену: реагенты похожи, но диагностическая цель и предварительная обработка различаются.</p>`},
{h:'6. Окраска капсулы по Бурри–Гинсу',img:SVG14_BG,body:`
<p>Бурри–Гинс — метод негативного контрастирования, позволяющий увидеть капсулу как светлый ореол на тёмном фоне вокруг окрашенной бактериальной клетки.</p>
<ol><li>Каплю бактериальной взвеси смешивают с каплей туши на обезжиренном стекле.</li><li>Готовят тонкий мазок, высушивают и фиксируют в соответствии с методикой.</li><li>Наносят водный раствор фуксина на 1–2 минуты.</li><li>Промывают, высушивают и исследуют под иммерсией.</li></ol>
<div class="facts"><div class="fact"><strong>Фон</strong>Тёмный, за счёт туши.</div><div class="fact"><strong>Бактериальная клетка</strong>Окрашена фуксином.</div><div class="fact"><strong>Капсула</strong>Не окрашивается и выглядит как светлый ободок между клеткой и фоном.</div></div>
<p><b>Примеры:</b> Klebsiella pneumoniae, Streptococcus pneumoniae. Капсула связана с защитой от фагоцитоза и вирулентностью ряда возбудителей.</p><p><b>Ограничение:</b> грубая фиксация, высушивание с деформацией или неправильная подготовка могут исказить капсулу. Светлый ореол оценивают вместе с контролями и клиническим контекстом.</p><p class="note">По пособию: с. 17.</p>`},
{h:'7. Окраска по Нейссеру: зёрна волютина',img:SVG14_NEISSER,body:`
<p>Метод Нейссера выявляет метахроматические включения — гранулы волютина (полифосфатов). Классический учебный пример — Corynebacterium diphtheriae, у которой гранулы могут располагаться полярно.</p>
<ol><li>На фиксированный мазок наносят уксуснокислую синьку Нейссера на 2–3 минуты.</li><li>Наносят раствор Люголя на 10–30 секунд.</li><li>Промывают водой и докрашивают везувином или хризоидином 0,5–1 минуту.</li><li>Промывают, высушивают и микроскопируют под иммерсией.</li></ol>
<div class="facts"><div class="fact"><strong>Зёрна волютина</strong>Тёмно-синие.</div><div class="fact"><strong>Цитоплазма</strong>Жёлто-коричневая.</div><div class="fact"><strong>Диагностический пример</strong>Corynebacterium diphtheriae; наличие гранул — морфологический ориентир, а не доказательство токсигенности.</div></div>
<p><b>Важно:</b> для подтверждения дифтерии необходимы выделение/идентификация возбудителя и определение токсигенности предусмотренными методами. Одна окраска Нейссера не подтверждает клинический диагноз.</p><p class="note">По пособию: с. 17.</p>`},
{h:'8. Окраска по Романовскому–Гимзе и другие специальные подходы',img:SVG14_GIEMSA,body:`
<p>Романовский–Гимза — полихромная окраска на основе азуров и эозина. Она широко используется для исследования клеток крови и некоторых внутриклеточных/кровепаразитарных объектов; конкретный протокол зависит от материала и диагностической задачи.</p>
<div class="facts"><div class="fact"><strong>Малярийные плазмодии</strong>Окраска мазков крови помогает выявлять паразитов и оценивать морфологию стадий.</div><div class="fact"><strong>Тонкие и внутриклеточные микроорганизмы</strong>В учебной практике метод может применяться для отдельных объектов, включая некоторые риккетсии и хламидии; чувствительность зависит от материала и протокола.</div><div class="fact"><strong>Простейшие и гельминты</strong>Пособие отдельно указывает Романовского–Гимзу и раствор Люголя для исследования паразитологических объектов.</div></div>
<p><b>Не смешивай:</b> Романовский–Гимза не является заменой окраски по Граму для рутинного разделения бактерий на Гр+ и Гр−. Для микроскопии грибов могут использоваться просветляющие растворы KOH и флуорохромы — это отдельная диагностическая задача.</p><p class="note">По пособию: с. 17–18. Уточняй назначение конкретной модификации окраски и тип исследуемого материала.</p>`},
{h:'9. Качество окраски, диагностические примеры и ограничения',img:SVG14_QC,body:`
<p>Микроскопическое заключение формируют последовательно: качество препарата → морфология → тинкториальные свойства → специальные структуры → клинический контекст и ограничения метода.</p>
<table><thead><tr><th>Метод</th><th>Что выявляет</th><th>Пример</th><th>Как трактовать</th></tr></thead><tbody><tr><td>Простая окраска</td><td>Форма и расположение</td><td>Кокки, палочки</td><td>Морфологический ориентир</td></tr><tr><td>Грам</td><td>Гр+ / Гр−</td><td>Стафилококки / E. coli</td><td>Предварительная дифференциация</td></tr><tr><td>Циль–Нильсен</td><td>Кислотоустойчивость</td><td>Микобактерии</td><td>Не определяет вид сама по себе</td></tr><tr><td>Ожешко</td><td>Эндоспоры</td><td>Bacillus, Clostridium</td><td>Признак спорообразования</td></tr><tr><td>Бурри–Гинс</td><td>Капсула</td><td>Klebsiella, пневмококк</td><td>Структурный/вирулентностный ориентир</td></tr><tr><td>Нейссер</td><td>Волютин</td><td>C. diphtheriae</td><td>Не доказывает токсигенность</td></tr></tbody></table>
<p><b>Что портит результат:</b> толстый или неравномерный мазок, грязное стекло, неполное высушивание, перегрев, истёкшие/некачественные реагенты, неверная экспозиция и чрезмерное обесцвечивание.</p>
<p><b>Клинические ориентиры:</b> красные кислотоустойчивые палочки в мокроте требуют дальнейшего обследования на туберкулёз; грамположительные диплококки в ликворе могут поддержать подозрение на пневмококковую инфекцию; капсула у Klebsiella — фактор вирулентности. Ни один из этих признаков не заменяет полноценную идентификацию.</p>
<p><b>Общее ограничение микроскопии:</b> метод быстр и доступен, но чувствительность и специфичность зависят от материала, концентрации возбудителя, качества мазка и опыта исследователя. Он не определяет антибиотикочувствительность и не идентифицирует вид большинства бактерий.</p><p class="note">По пособию: с. 15–18. Экзаменационный вопрос №53.</p>`}
]);

addQuiz('1.4',[
{q:'Что называют тинкториальными свойствами микроорганизмов?',o:['Способность образовывать споры','Отношение клеток и их структур к окрашиванию','Способность расти на питательных средах','Чувствительность к антибиотикам'],a:1,e:'Тинкториальные свойства — отношение микробных клеток и их структур к красителям: способность воспринимать и удерживать их при определённых методах окраски.',h:'Термин связан с окраской.'},
{q:'Какой результат можно получить при простой окраске одним красителем?',o:['Определить антибиотикочувствительность','Разделить все бактерии на Гр+ и Гр−','Оценить форму, размер и расположение клеток','Подтвердить токсигенность'],a:2,e:'Простая окраска одним красителем повышает контраст и позволяет описать морфологию и расположение клеток. Она не определяет вид, чувствительность или токсигенность.',h:'Один краситель — базовая морфология.'},
{q:'Какова основная цель сложных дифференциальных методов окраски?',o:['Получить чистую культуру','Различить группы бактерий или выявить определённые структуры','Измерить скорость размножения','Определить МПК антибиотика'],a:1,e:'Сложные методы используют несколько красителей и дополнительные реагенты, чтобы дифференцировать бактерии или визуализировать структуры, например при окраске по Граму.',h:'Несколько реагентов дают дифференциацию.'},
{q:'Какой из методов является примером простой окраски?',o:['Окраска по Граму','Циль–Нильсен','Метиленовый синий как единственный краситель','Ожешко'],a:2,e:'Простая окраска использует один краситель. Грам, Циль–Нильсен и Ожешко — сложные/специальные многоэтапные методы.',h:'Выбери метод с одним красителем.'},
{q:'Для чего фиксируют бактериальный мазок перед окраской?',o:['Чтобы закрепить клетки на стекле и обезвредить материал','Чтобы увеличить число бактерий','Чтобы определить их генотип','Чтобы сделать клетки подвижными'],a:0,e:'Фиксация закрепляет клетки на стекле, инактивирует исследуемый материал и повышает восприимчивость к красителям.',h:'Фиксация готовит препарат к окрашиванию.'},
{q:'В какой последовательности обычно готовят мазок перед окрашиванием?',o:['Фиксация → нанесение материала → высушивание','Нанесение тонкого слоя → высушивание → фиксация','Окраска → нанесение материала → фиксация','Высушивание стекла → микроскопия → нанесение материала'],a:1,e:'Материал сначала наносят тонким слоем, полностью высушивают, затем фиксируют и окрашивают. Нарушение порядка может привести к смыву или деформации препарата.',h:'Сначала мазок, затем высушивание и фиксация.'},
{q:'Какое требование предъявляется к качественному бактериальному мазку?',o:['Очень толстый слой клеток','Клетки должны быть расположены преимущественно в один слой','Мазок должен оставаться влажным','Стекло должно быть покрыто маслом до фиксации'],a:1,e:'В правильно приготовленном препарате клетки располагаются преимущественно в один слой. Толстый мазок затрудняет дифференциацию и оценку морфологии.',h:'Важно видеть отдельные клетки, а не многослойную массу.'},
{q:'Что может привести к искажению морфологии при подготовке мазка?',o:['Чистое стекло','Равномерный тонкий слой','Перегрев при фиксации','Соблюдение времени окраски'],a:2,e:'Перегрев может деформировать клетки и ухудшить качество препарата. Важны чистота стекла, тонкий слой, правильная фиксация и экспозиция реагентов.',h:'Избыточное тепло повреждает препарат.'},
{q:'Какой реагент наносят первым при окраске по Граму в методике пособия?',o:['Метиленовый синий','Генциан-фиолетовый','Спирт','Фуксин'],a:1,e:'Первым наносят генциан-фиолетовый примерно на 1 минуту. Затем раствор Люголя, спиртовое обесцвечивание и фуксин.',h:'Первичный фиолетовый краситель.'},
{q:'Какова роль раствора Люголя при окраске по Граму?',o:['Контрастная докраска Гр− клеток','Протрава, способствующая образованию комплекса основного красителя с йодом','Полное обесцвечивание мазка','Фиксация клеток на стекле'],a:1,e:'Раствор Люголя выступает как протрава: способствует образованию комплекса генциан-фиолетового с йодом, который затем по-разному удерживается клетками.',h:'Люголь наносят после первичного фиолетового красителя.'},
{q:'Какой этап окраски по Граму является критическим для дифференциации?',o:['Обесцвечивание спиртом','Высушивание на воздухе','Нанесение иммерсионного масла','Промывание после фуксина'],a:0,e:'Именно обесцвечивание спиртом дифференцирует клетки по удержанию комплекса основного красителя. Чрезмерная или недостаточная экспозиция искажает результат.',h:'Ключевой этап — спирт.'},
{q:'Как окрашиваются типичные грамположительные бактерии после окраски по Граму?',o:['Красные','Сине-фиолетовые','Зелёные','Бесцветные'],a:1,e:'Типичные Гр+ бактерии удерживают комплекс генциан-фиолетового с йодом и выглядят сине-фиолетовыми.',h:'Они сохраняют первичный фиолетовый цвет.'},
{q:'Как окрашиваются типичные грамотрицательные бактерии после окраски по Граму?',o:['Сине-фиолетовые','Красные или розовые','Чёрные','Всегда бесцветные'],a:1,e:'Гр− клетки обесцвечиваются спиртом и воспринимают контрастный фуксин, поэтому выглядят красными или розовыми.',h:'Они теряют первичный краситель и докрашиваются.'},
{q:'В мазке обнаружены фиолетовые скопления кокков. Какой вывод наиболее корректен?',o:['Это точно Staphylococcus aureus','Это морфологический ориентир в пользу грамположительных кокков; нужна дальнейшая идентификация','Это доказывает чувствительность к пенициллину','Это доказывает наличие капсулы'],a:1,e:'Фиолетовые кокки в скоплениях поддерживают предположение о грамположительных кокках, например стафилококках, но не позволяют установить вид или чувствительность к антибиотикам.',h:'Морфология и Грам — ориентир, не окончательная идентификация.'},
{q:'Какой реагент применяют для обесцвечивания при окраске по Цилю–Нильсену согласно пособию?',o:['5% раствор серной кислоты','Раствор Люголя','Везувин','Фуксин Циля'],a:0,e:'В пособии указан 5% раствор H₂SO₄ на 1–2 минуты. После этого препарат докрашивают метиленовым синим.',h:'Кислотное обесцвечивание.'},
{q:'Какую роль выполняет нагревание карболового фуксина при окраске по Цилю–Нильсену?',o:['Обесцвечивает все клетки','Способствует проникновению основного красителя через липид-богатую оболочку','Выявляет капсулу','Фиксирует мазок вместо всех остальных этапов'],a:1,e:'Нагревание до появления паров способствует проникновению карболового фуксина в оболочку кислотоустойчивых бактерий. Нагревать нужно осторожно, не допуская высыхания и перегрева.',h:'Ключевой барьер — липид-богатая оболочка.'},
{q:'Как выглядит результат положительной окраски на кислотоустойчивые бактерии?',o:['Красные палочки на синем фоне','Фиолетовые кокки на красном фоне','Синие споры на бесцветном фоне','Светлые капсулы на чёрном фоне'],a:0,e:'Кислотоустойчивые клетки удерживают карболовый фуксин и выглядят красными; некислотоустойчивые элементы докрашиваются метиленовым синим.',h:'Красный цвет сохраняется после кислоты.'},
{q:'Какой возбудитель является классическим объектом окраски по Цилю–Нильсену?',o:['Mycobacterium tuberculosis','Staphylococcus aureus','Escherichia coli','Streptococcus pyogenes'],a:0,e:'M. tuberculosis — кислотоустойчивая бактерия с липид-богатой оболочкой, содержащей миколовые кислоты.',h:'Возбудитель туберкулёза.'},
{q:'В мокроте выявлены красные кислотоустойчивые палочки. Как следует трактовать результат?',o:['Вид M. tuberculosis уже доказан','Обнаружены кислотоустойчивые бактерии; нужны подтверждающие исследования и клиническая оценка','Это гарантирует отсутствие туберкулёза','Это доказывает лекарственную чувствительность'],a:1,e:'Микроскопия указывает на кислотоустойчивые бактерии, но не устанавливает вид и лекарственную чувствительность. Необходимы молекулярные и/или культуральные исследования по алгоритму диагностики.',h:'Положительная микроскопия — важный ориентир, но не видовая идентификация.'},
{q:'Какой цвет имеют эндоспоры при окраске по Ожешко?',o:['Синий','Красный','Зелёный','Бесцветный'],a:1,e:'По Ожешко споры окрашиваются карболовым фуксином в красный цвет, а вегетативные клетки — метиленовым синим.',h:'Спора удерживает красный фуксин.'},
{q:'Как выглядят вегетативные клетки при окраске по Ожешко?',o:['Красные','Синие','Чёрные','Не окрашиваются'],a:1,e:'После обесцвечивания препарат докрашивают метиленовым синим: вегетативные клетки становятся синими, споры остаются красными.',h:'Контрастный краситель — метиленовый синий.'},
{q:'Для каких бактерий особенно характерно применение окраски по Ожешко?',o:['Bacillus и Clostridium','Mycoplasma и Ureaplasma','Neisseria и Moraxella','Treponema и Borrelia'],a:0,e:'Bacillus и Clostridium — классические роды спорообразующих бактерий. Окраска помогает визуализировать эндоспоры.',h:'Вспомни спорообразующие палочки.'},
{q:'Почему в методе Ожешко проводят предварительную обработку нефиксированного мазка HCl с нагреванием?',o:['Для облегчения последующего проникновения красителя в споры','Для окраски капсулы','Для выявления волютина','Для определения чувствительности к антибиотикам'],a:0,e:'Предварительная кислотная обработка с нагреванием помогает сделать споровую структуру доступной для последующего окрашивания карболовым фуксином.',h:'Метод специально адаптирован для устойчивой споры.'},
{q:'Как выглядит капсула при окраске по Бурри–Гинсу?',o:['Красная гранула внутри клетки','Светлый ореол вокруг окрашенной клетки на тёмном фоне','Синяя спора','Фиолетовая клеточная стенка'],a:1,e:'Тушь создаёт тёмный фон, фуксин окрашивает клетку, а капсула остаётся светлым ореолом.',h:'Негативное контрастирование.'},
{q:'Какой компонент создаёт тёмный фон при окраске по Бурри–Гинсу?',o:['Раствор Люголя','Тушь','Метиленовый синий','Везувин'],a:1,e:'Тушь обеспечивает негативное контрастирование и формирует тёмный фон, на котором видна светлая капсула.',h:'Используется тушь.'},
{q:'Какой микроорганизм часто приводят как пример капсулообразующей бактерии?',o:['Klebsiella pneumoniae','Mycoplasma pneumoniae','Treponema pallidum','Clostridium tetani'],a:0,e:'K. pneumoniae имеет выраженную полисахаридную капсулу, важную для вирулентности. Пневмококк также является классическим капсулообразующим возбудителем.',h:'Клебсиелла — капсульный патоген.'},
{q:'Почему при демонстрации капсулы важно избегать грубой фиксации?',o:['Капсула может деформироваться или разрушаться','Клетки начнут делиться','Тушь станет флуоресцентной','Появятся эндоспоры'],a:0,e:'Капсула — относительно нежная структура; грубая фиксация и высушивание могут изменить её контуры и привести к ложной интерпретации.',h:'Нужно сохранить внешний слизистый слой.'},
{q:'Что выявляет окраска по Нейссеру?',o:['Кислотоустойчивость','Зёрна волютина','Капсулы','Эндоспоры'],a:1,e:'Окраска по Нейссеру выявляет метахроматические гранулы волютина, состоящие преимущественно из полифосфатов.',h:'Гранулы-запасы полифосфатов.'},
{q:'Как окрашиваются зёрна волютина при методе Нейссера?',o:['Тёмно-синие','Красные','Зелёные','Бесцветные'],a:0,e:'Зёрна волютина становятся тёмно-синими, тогда как цитоплазма приобретает желтовато-коричневый оттенок.',h:'Метахроматические гранулы — тёмно-синие.'},
{q:'Какой микроорганизм является классическим примером для окраски по Нейссеру?',o:['Corynebacterium diphtheriae','Escherichia coli','Mycobacterium tuberculosis','Vibrio cholerae'],a:0,e:'У C. diphtheriae могут выявляться полярно расположенные гранулы волютина (тельца Бабеша–Эрнста).',h:'Возбудитель дифтерии.'},
{q:'Доказывает ли выявление гранул волютина токсигенность C. diphtheriae?',o:['Да, всегда','Нет, токсигенность подтверждают отдельными тестами','Да, если гранулы расположены полярно','Только при окраске по Граму'],a:1,e:'Гранулы волютина — морфологический ориентир. Токсигенность подтверждают специальными методами выявления токсина/его гена в соответствии с лабораторным алгоритмом.',h:'Морфология не равна продукции токсина.'},
{q:'Какой объект является классическим для окраски по Романовскому–Гимзе в мазке крови?',o:['Плазмодии малярии','Эндоспоры Bacillus','Капсулы Klebsiella','ЛПС Escherichia coli'],a:0,e:'Окраска по Романовскому–Гимзе применяется для выявления малярийных плазмодиев в мазках крови и оценки их морфологии.',h:'Кровепаразит.'},
{q:'К какой группе относится окраска по Романовскому–Гимзе?',o:['Полихромная окраска','Негативное контрастирование тушью','Кислотное обесцвечивание','Окраска спор'],a:0,e:'Романовский–Гимза — полихромная окраска на основе азуров и эозина; её применение зависит от исследуемого материала.',h:'Смесь нескольких красителей.'},
{q:'Какое утверждение о применении Романовского–Гимзы наиболее корректно?',o:['Это основной метод разделения бактерий на Гр+ и Гр−','Метод применяется для ряда кровепаразитарных и других специальных объектов','Он определяет антибиотикочувствительность','Он выявляет только эндоспоры'],a:1,e:'Романовский–Гимза широко применяется для мазков крови и ряда паразитарных/внутриклеточных объектов. Для дифференциации Гр+ и Гр− используют окраску по Граму.',h:'Не путай полихромную окраску с методом Грама.'},
{q:'Какое утверждение о диагностической ценности окраски является верным?',o:['Любая окраска всегда устанавливает вид','Окраска даёт морфологические и тинкториальные ориентиры, но часто требует подтверждения','Окраска заменяет посев и ПЦР во всех случаях','По цвету можно определить антибиотикочувствительность'],a:1,e:'Окраска помогает быстро оценить морфологию и некоторые свойства возбудителя, но часто не обеспечивает видовую идентификацию и не определяет чувствительность к препаратам.',h:'Быстрый ориентир, не универсальное подтверждение.'},
{q:'Какой фактор может привести к ложной грамвариабельной картине?',o:['Слишком толстый мазок или чрезмерное обесцвечивание','Чистое стекло и тонкий мазок','Точное соблюдение времени','Свежие качественные реактивы'],a:0,e:'Толстый мазок, возраст/повреждение культуры и неправильное обесцвечивание могут приводить к вариабельной окраске. Поэтому важны контроль качества и контекст.',h:'Проблема подготовки или дифференцирующего этапа.'},
{q:'Какое заключение по мазку наиболее научно корректно?',o:['Назвать вид только по цвету','Описать морфологию и результат окраски, указав ограничения и необходимость подтверждения','Сразу назначить антибиотик по цвету','Игнорировать качество препарата'],a:1,e:'Корректное заключение описывает форму, расположение, тинкториальные свойства и качество материала, не выходя за пределы возможностей метода.',h:'Описывай наблюдаемое и не делай лишних выводов.'}
]);

addTheory('1.5',[
{h:'Световой микроскоп: устройство и назначение систем',img:SVG_MICROSCOPE,body:`<p>Световой микроскоп формирует увеличенное изображение объекта с помощью видимого света и системы линз. Его основные узлы объединены в три функциональные системы.</p><div class="facts"><div class="fact"><strong>Механическая система</strong>Штатив, тубус, предметный столик, револьверная головка, макро- и микрометрический механизмы. Обеспечивает фиксацию препарата, смену объективов и фокусировку.</div><div class="fact"><strong>Осветительная система</strong>Источник света, конденсор и диафрагма. Направляет и регулирует световой поток, проходящий через препарат.</div><div class="fact"><strong>Оптическая система</strong>Объектив и окуляр. Объектив формирует увеличенное промежуточное изображение, окуляр обеспечивает его дальнейшее увеличение.</div><div class="fact"><strong>Фокусировка</strong>Макровинт — предварительная грубая наводка; микровинт — точная фокусировка, особенно важная при больших увеличениях.</div></div><p><b>Диагностическое значение:</b> правильная настройка освещения и фокуса необходима для оценки формы, размеров, взаимного расположения и окраски микроорганизмов.</p>`},
{h:'Увеличение, разрешение и числовая апертура',img:SVG_MICROSCOPE,body:`<p><b>Общее увеличение</b> равно произведению увеличения объектива на увеличение окуляра. Например: объектив ×40 и окуляр ×10 дают ×400; объектив ×100 и окуляр ×10 — ×1000.</p><div class="facts"><div class="fact"><strong>Разрешающая способность</strong>Способность различать две близко расположенные точки как отдельные. Она определяет детализацию изображения, а не его размер.</div><div class="fact"><strong>Предел разрешения</strong>Минимальное расстояние между двумя точками, при котором они ещё различимы. Для световой микроскопии с масляной иммерсией ориентир — около 0,2 мкм.</div><div class="fact"><strong>Числовая апертура</strong>Характеризует способность объектива собирать свет; зависит от показателя преломления среды и угла собираемых лучей.</div><div class="fact"><strong>Что улучшает разрешение</strong>Уменьшение длины волны и увеличение числовой апертуры. Простое увеличение изображения без роста разрешения даёт «пустое увеличение».</div></div><p>Вирусы и объекты существенно меньше предела разрешения обычного светового микроскопа надёжно таким способом не визуализируются.</p>`},
{h:'Иммерсионная микроскопия: принцип и применение',img:SVG_MICROSCOPE,body:`<p>При иммерсии каплю специального масла помещают между фронтальной линзой иммерсионного объектива и окрашенным мазком на предметном стекле. Показатель преломления масла близок к показателю преломления стекла.</p><div class="facts"><div class="fact"><strong>Зачем масло</strong>Уменьшает преломление и потери лучей на границе стекло–воздух, позволяя объективу собрать больше света.</div><div class="fact"><strong>Типичный объектив</strong>×90–100; с окуляром ×10 общее увеличение составляет ×900–1000.</div><div class="fact"><strong>Результат</strong>Повышается числовая апертура и достигается высокое разрешение — ориентировочно до 0,2 мкм.</div><div class="fact"><strong>Важно</strong>Масло не окрашивает и не фиксирует бактерии. Оно выполняет только оптическую функцию и используется с предназначенным для этого объективом.</div></div><p>Иммерсионную систему обычно применяют для изучения окрашенных фиксированных бактериальных мазков.</p>`},
{h:'Правила работы с иммерсионным объективом',img:SVG_SMEAR_FLOW,body:`<ol><li>Настроить освещение и найти участок препарата при малом увеличении.</li><li>Нанести каплю иммерсионного масла на область окрашенного мазка.</li><li>Повернуть револьвер на объектив ×90–100.</li><li>Осторожно погрузить фронтальную линзу в каплю, контролируя движение сбоку.</li><li>Выполнить окончательную фокусировку микрометрическим винтом.</li><li>После работы удалить масло с линзы специальной салфеткой и вернуть малый объектив.</li></ol><div class="facts"><div class="fact"><strong>Запрещено</strong>Резко опускать объектив на стекло или фокусировать грубым макровинтом при иммерсии — можно повредить препарат и линзу.</div><div class="fact"><strong>Экзаменационный акцент</strong>Иммерсия повышает разрешение за счёт оптической среды, а не за счёт изменения окраски или размера объекта.</div></div>`},
{h:'Светлопольная и темнопольная микроскопия',img:SVG_DARKFIELD,body:`<div class="facts"><div class="fact"><strong>Светлопольная</strong>Объект виден на светлом фоне. Подходит для окрашенных фиксированных мазков; стандартный вариант бактериоскопии с иммерсионным объективом.</div><div class="fact"><strong>Темнопольная</strong>Прямой свет не попадает в объектив, а изображение формируется рассеянным объектом светом: микроорганизм выглядит светлым на тёмном фоне.</div><div class="fact"><strong>Что изучают в темном поле</strong>Тонкие живые микроорганизмы и их движение, прежде всего спирохеты. Классические примеры — Treponema pallidum и Leptospira spp.</div><div class="fact"><strong>Ограничение</strong>Темнопольное изображение не заменяет специфическую идентификацию; артефакты и частицы могут имитировать микроорганизмы.</div></div><p>Для тонких спирохет темнопольная микроскопия особенно полезна, поскольку их трудно увидеть в обычном светлом поле без специальной подготовки.</p>`},
{h:'Фазово-контрастная микроскопия',img:SVG_PHASE,body:`<p>Фазово-контрастная система преобразует фазовые сдвиги света, возникающие при прохождении через структуры с разными показателями преломления, в различия яркости изображения.</p><div class="facts"><div class="fact"><strong>Материал</strong>Нативные, живые, неокрашенные препараты.</div><div class="fact"><strong>Что позволяет увидеть</strong>Контуры клеток, некоторые внутренние структуры, характер движения и поведение микроорганизмов.</div><div class="fact"><strong>Пример применения</strong>Наблюдение живых бактериальных клеток, например подвижных форм Bacillus spp., без предварительной окраски.</div><div class="fact"><strong>Ограничение</strong>Не обеспечивает надёжной видовой идентификации и не заменяет окрашивание, посев или молекулярные методы.</div></div><p><b>Не путать:</b> фазово-контрастная микроскопия усиливает контраст за счёт фазовых различий; темнопольная формирует изображение рассеянным светом.</p>`},
{h:'Люминесцентная микроскопия и иммунофлуоресценция',img:SVG_FLUORESCENCE,body:`<p>Люминесцентная микроскопия регистрирует свечение веществ-флуорохромов после возбуждения светом соответствующей длины волны.</p><div class="facts"><div class="fact"><strong>Прямая РИФ</strong>Специфические антитела, меченные флуорохромом, связываются с антигеном в исследуемом материале.</div><div class="fact"><strong>Непрямая РИФ</strong>Связанный с антигеном первичный антителный комплекс выявляют мечеными вторичными антителами.</div><div class="fact"><strong>Применение</strong>Быстрая индикация антигенов отдельных возбудителей; флуорохромы также применяются для выявления грибковых элементов, например калькофлуор белый.</div><div class="fact"><strong>Интерпретация</strong>Учитывают характер свечения, контрольные препараты, качество материала и клиническую вероятность. Неспецифическое свечение может дать ложноположительную картину.</div></div><p>РИФ — метод специфической маркировки мишени; сам по себе факт свечения без контроля не доказывает присутствие конкретного возбудителя.</p>`},
{h:'Электронная микроскопия: просвечивающая и сканирующая',img:SVG_ELECTRON,body:`<div class="facts"><div class="fact"><strong>Просвечивающая (ПЭМ)</strong>Электроны проходят через ультратонкий препарат; получают изображение внутренней ультраструктуры, вирусных частиц и взаимодействия вирусов с клетками.</div><div class="fact"><strong>Сканирующая (СЭМ)</strong>Регистрируется сигнал от поверхности образца при сканировании электронным пучком; формируется рельефное изображение поверхности.</div><div class="fact"><strong>Подготовка</strong>Требует специальной фиксации, контрастирования/напыления и вакуума; подготовка сложнее, чем для световой микроскопии.</div><div class="fact"><strong>Диагностическая роль</strong>Позволяет изучать вирусы и тонкую структуру, но обычно не является рутинным первым методом для большинства бактериальных инфекций.</div></div><p>Обычный световой микроскоп не позволяет надёжно увидеть вирусные частицы из-за их размеров, поэтому для прямой визуализации используют электронную микроскопию.</p>`},
{h:'Бактериоскопический метод: возможности, ограничения и выбор метода',img:SVG_SCOPES,body:`<p>Бактериоскопический метод основан на непосредственном исследовании клинического материала или культуры с оценкой морфологии, структуры, расположения и тинкториальных свойств микроорганизмов.</p><div class="facts"><div class="fact"><strong>Сильные стороны</strong>Быстрота, относительная доступность, возможность предварительного этиологического ориентирования и выбора дальнейшего алгоритма.</div><div class="fact"><strong>Что описывают</strong>Форму, размеры, расположение клеток, наличие видимых структур и результат специальных окрасок; в нативном препарате — характер движения.</div><div class="fact"><strong>Ограничения</strong>Сходство видов по морфологии, зависимость от качества и количества материала; микроскопия обычно не определяет вид, токсигенность или чувствительность к антибиотикам.</div><div class="fact"><strong>Примеры</strong>Окраска по Граму — быстрый ориентир при ряде бактериальных инфекций; Циль–Нильсен — поиск кислотоустойчивых бактерий; темнопольная микроскопия — тонкие спирохеты; РИФ — выявление определённых антигенов.</div></div><p><b>Правило заключения:</b> сообщай только то, что действительно видно и подтверждается методом. При необходимости результат подтверждают посевом, ПЦР, антигенными или серологическими тестами.</p>`}
]);
addQuiz('1.5',[
{q:'Какие три функциональные системы выделяют в световом микроскопе?',o:['Механическую, осветительную и оптическую','Ядерную, цитоплазматическую и мембранную','Увеличительную, окрашивающую и фиксирующую','Оптическую, бактериальную и иммерсионную'],a:0,e:'Световой микроскоп включает механическую, осветительную и оптическую системы.',h:'Вспомни, что держит препарат, направляет свет и формирует изображение.'},
{q:'К какой системе относится конденсор?',o:['Механической','Осветительной','Оптической','Измерительной'],a:1,e:'Конденсор направляет и фокусирует свет на препарате, поэтому относится к осветительной системе.',h:'Он работает со световым потоком.'},
{q:'Какое назначение у микрометрического винта?',o:['Грубое перемещение препарата','Точная окончательная фокусировка','Смена объективов','Регулировка яркости'],a:1,e:'Микрометрический винт используют для точной наводки на резкость, особенно при больших увеличениях и иммерсии.',h:'«Микро» — тонкая настройка.'},
{q:'Объектив ×40 используется с окуляром ×10. Каково общее увеличение?',o:['×50','×100','×400','×4000'],a:2,e:'Общее увеличение = увеличение объектива × увеличение окуляра: 40 × 10 = 400.',h:'Перемножь значения.'},
{q:'Что означает разрешающая способность микроскопа?',o:['Максимальное увеличение прибора','Способность различать две близко расположенные точки','Яркость изображения','Ширина поля зрения'],a:1,e:'Разрешающая способность — способность видеть две близкие точки раздельно; она определяет детализацию.',h:'Речь не о размере изображения.'},
{q:'Какой ориентировочный предел разрешения у светового микроскопа с масляной иммерсией указан в пособии?',o:['2 нм','0,2 мкм','2 мм','20 мкм'],a:1,e:'Для масляной иммерсии приводится ориентир около 0,2 мкм.',h:'Это доля микрометра, а не нанометры.'},
{q:'Почему простое увеличение изображения не всегда позволяет увидеть новые детали?',o:['Потому что увеличение не равно разрешению','Потому что окуляр окрашивает препарат','Потому что объектив выключает освещение','Потому что все бактерии прозрачны'],a:0,e:'Если разрешение оптики не улучшается, увеличение только делает размытое изображение крупнее — это пустое увеличение.',h:'Различимость деталей важнее размера картинки.'},
{q:'Для чего используют иммерсионное масло?',o:['Для фиксации бактерий','Для окраски клеточной стенки','Для уменьшения потерь света на границе стекло–воздух','Для уничтожения микроорганизмов'],a:2,e:'Масло с показателем преломления, близким к стеклу, уменьшает преломление лучей и повышает числовую апертуру системы.',h:'Это оптическая, а не химическая функция.'},
{q:'Какое увеличение обычно имеет иммерсионный объектив?',o:['×4','×10','×40','×90–100'],a:3,e:'Типичные иммерсионные объективы имеют увеличение ×90–100; с окуляром ×10 общее увеличение достигает ×900–1000.',h:'Именно этот объектив используют с маслом.'},
{q:'Какой винт применяют для окончательной фокусировки при иммерсии?',o:['Макрометрический','Микрометрический','Револьверный','Конденсорный'],a:1,e:'При иммерсии окончательную точную фокусировку выполняют микрометрическим винтом; грубое движение может повредить препарат или линзу.',h:'Только точная фокусировка.'},
{q:'Какой тип препарата обычно исследуют в светлом поле с иммерсионным объективом?',o:['Окрашенный фиксированный мазок','Живую культуру без контраста','Только вирусную суспензию','Нативный препарат для оценки подвижности'],a:0,e:'Светлопольная иммерсионная микроскопия — стандартный способ изучения окрашенных фиксированных бактериальных мазков.',h:'Вспомни типичный мазок по Граму.'},
{q:'Как выглядит объект при темнопольной микроскопии?',o:['Тёмный на светлом фоне','Светлый на тёмном фоне','Всегда фиолетовый','Невидимый без флуорохрома'],a:1,e:'В темнопольной системе прямой свет не попадает в объектив, а рассеянный объектом свет формирует светлое изображение на тёмном фоне.',h:'Название прямо описывает фон.'},
{q:'Какой объект является классическим примером для темнопольной микроскопии?',o:['Treponema pallidum','Escherichia coli в окрашенном мазке','Эндоспоры Bacillus после Ожешко','Вирус гриппа в мазке'],a:0,e:'Тонкие спирохеты, в том числе T. pallidum, могут исследоваться в нативных препаратах методом темнопольной микроскопии.',h:'Тонкая спиралевидная бактерия.'},
{q:'Что позволяет оценивать темнопольная микроскопия?',o:['Только чувствительность к антибиотикам','Морфологию и движение тонких живых микроорганизмов','Геномную последовательность','Токсигенность'],a:1,e:'Метод позволяет наблюдать тонкие живые клетки и характер их движения, но не определяет генотип или чувствительность.',h:'Нативный препарат и движение.'},
{q:'На каком физическом принципе основана фазово-контрастная микроскопия?',o:['Преобразование фазовых сдвигов света в различия яркости','Свечение антител','Прохождение электронов через ультратонкий срез','Поглощение красителя клеточной стенкой'],a:0,e:'Фазово-контрастная система преобразует фазовые различия, возникающие в объекте, в видимый контраст интенсивности.',h:'Ключевое слово — фаза.'},
{q:'Для какого материала особенно подходит фазово-контрастная микроскопия?',o:['Живые неокрашенные клетки','Только фиксированные мазки по Граму','Ультратонкие вирусные срезы','Парафиновые блоки'],a:0,e:'Фазово-контрастная микроскопия усиливает контраст нативных живых неокрашенных клеток.',h:'Фиксация и окраска не обязательны.'},
{q:'Что общего у темнопольной и фазово-контрастной микроскопии?',o:['Обе позволяют изучать нативные препараты','Обе требуют флуоресцентных антител','Обе используют электронный пучок','Обе определяют вид бактерии'],a:0,e:'Обе оптические методики полезны для исследования живых неокрашенных микроорганизмов, хотя физические принципы различаются.',h:'Подумай о препарате до фиксации.'},
{q:'Какой метод используют для визуализации специфически меченных антител?',o:['Темнопольная микроскопия','Люминесцентная микроскопия','Светлопольная без окраски','Сканирующая электронная микроскопия'],a:1,e:'В РИФ антитела связаны с флуорохромом; специфическое свечение регистрируют люминесцентным микроскопом.',h:'Флуорохром испускает свет.'},
{q:'Что является основой прямой реакции иммунофлуоресценции?',o:['Меченое антитело непосредственно связывается с антигеном','Немеченое антитело выявляют вторичным меченым антителом','Бактерию окрашивают по Граму','Объект облучают электронным пучком'],a:0,e:'В прямой РИФ флуорохром-конъюгированное специфическое антитело непосредственно связывается с антигеном.',h:'Метка находится на специфическом антителе.'},
{q:'Какой риск нужно учитывать при интерпретации люминесцентного препарата?',o:['Неспецифическое свечение и фон','Невозможность видеть флуорохромы','Обязательное образование эндоспор','Автоматическое определение антибиотикочувствительности'],a:0,e:'Неспецифическое связывание, аутофлуоресценция и высокий фон могут имитировать положительный результат; важны контроли.',h:'Свечение само по себе ещё не доказательство.'},
{q:'Какой краситель/флуорохром применяют для выявления грибковых элементов в люминесцентной микроскопии?',o:['Калькофлуор белый','Генцианвиолет','Везувин','Фуксин Циля'],a:0,e:'Калькофлуор белый связывается с компонентами клеточной стенки грибов и используется с люминесцентной микроскопией.',h:'Специальный флуоресцентный маркер грибов.'},
{q:'Какой тип электронной микроскопии показывает внутреннюю ультраструктуру объекта?',o:['Просвечивающая','Сканирующая','Темнопольная','Фазово-контрастная'],a:0,e:'При просвечивающей электронной микроскопии электроны проходят через ультратонкий образец, что позволяет изучать внутреннюю структуру.',h:'Электроны проходят сквозь образец.'},
{q:'Что преимущественно демонстрирует сканирующая электронная микроскопия?',o:['Поверхностный рельеф образца','Подвижность живых бактерий в нативном препарате','Реакцию антиген–антитело','Грампринадлежность'],a:0,e:'Сканирующая электронная микроскопия формирует изображение поверхности и её рельефа.',h:'Сканирование поверхности.'},
{q:'Почему электронная микроскопия позволяет визуализировать вирусные частицы?',o:['Использует электроны с существенно меньшей длиной волны, обеспечивая более высокое разрешение','Окрашивает вирусы по Граму','Увеличивает их размер','Выявляет только антитела'],a:0,e:'Электронная оптика обеспечивает разрешение, достаточное для прямого изучения вирусных частиц и ультраструктур.',h:'Сравни длину волны и разрешение со световой оптикой.'},
{q:'Какое утверждение об электронной микроскопии верно?',o:['Не требует специальной подготовки образца','Обычно требует сложной подготовки и специального оборудования','Позволяет напрямую определить чувствительность к антибиотикам','Всегда является рутинным первым тестом при бактериальной инфекции'],a:1,e:'Электронная микроскопия требует специального оборудования, вакуума и сложной подготовки образцов, поэтому применяется по конкретным показаниям.',h:'Это высокотехнологичный метод, а не обычный мазок.'},
{q:'На чём основан бактериоскопический метод диагностики?',o:['На непосредственном микроскопическом изучении материала','Только на выращивании чистой культуры','Только на выявлении антител в сыворотке','На определении МПК'],a:0,e:'Бактериоскопия — непосредственное микроскопическое исследование клинического материала или культуры.',h:'Само название подсказывает метод.'},
{q:'Какие признаки можно оценить при бактериоскопии?',o:['Форму, расположение, тинкториальные свойства и некоторые структуры','Полный геном и все гены резистентности','Всегда точный вид и штамм','Чувствительность к каждому антибиотику'],a:0,e:'Микроскопия даёт морфологические и тинкториальные ориентиры; генотип, вид и антибиотикочувствительность часто требуют иных методов.',h:'Описываем видимые признаки.'},
{q:'Какое основное ограничение бактериоскопии при идентификации бактерий?',o:['Морфология разных видов может быть сходной','Нельзя исследовать окрашенные препараты','Невозможно увидеть бактерии вообще','Метод занимает несколько недель'],a:0,e:'Сходство морфологии разных видов ограничивает специфичность; микроскопический результат часто является предварительным.',h:'Одинаковая форма не означает один и тот же вид.'},
{q:'Может ли обычная иммерсионная световая микроскопия выявить вирусные частицы?',o:['Да, всегда','Нет, размер вирусов ниже разрешения обычной световой микроскопии','Только после окраски по Граму','Только с иммерсионным маслом'],a:1,e:'Вирусы обычно меньше предела разрешения светового микроскопа; для прямой визуализации используют электронную микроскопию или косвенные методы.',h:'Вспомни предел около 0,2 мкм.'},
{q:'Какое утверждение о микроскопии и антибиотикочувствительности верно?',o:['Микроскопия непосредственно определяет чувствительность','По форме клетки можно выбрать точный антибиотик','Микроскопия не определяет антибиотикочувствительность','Темнопольная микроскопия заменяет антибиотикограмму'],a:2,e:'Чувствительность определяют специальными фенотипическими или молекулярными методами; микроскопия не заменяет антибиотикограмму.',h:'Морфология не показывает МПК.'},
{q:'Какой метод наиболее уместен для быстрого предварительного изучения окрашенного мазка из клинического материала?',o:['Светлопольная микроскопия','Сканирующая электронная микроскопия','Темнопольная микроскопия во всех случаях','Только фазово-контрастная микроскопия'],a:0,e:'Окрашенные фиксированные мазки обычно исследуют светлопольным микроскопом, часто с иммерсионным объективом.',h:'Стандартная бактериоскопия окрашенного мазка.'},
{q:'При исследовании материала предполагают тонкие спирохеты. Какой метод может быть выбран для нативного препарата?',o:['Темнопольная микроскопия','Окраска по Ожешко','Светлопольная иммерсия окрашенного мазка как единственный вариант','Сканирующая электронная микроскопия'],a:0,e:'Темнопольная микроскопия позволяет визуализировать тонкие спирохеты в нативном препарате и оценить их движение.',h:'Нативный препарат и тонкая спиралевидная форма.'},
{q:'Как корректнее сформулировать результат микроскопии, если видовую принадлежность нельзя подтвердить?',o:['Указать только предполагаемый вид без оговорок','Описать форму, расположение и тинкториальные признаки, отметив ограничения','Назвать штамм по цвету','Сразу указать чувствительность к антибиотикам'],a:1,e:'Заключение должно соответствовать возможностям метода: описать наблюдаемые признаки и при необходимости рекомендовать подтверждающие исследования.',h:'Не делай вывод шире полученных данных.'},

{q:'Врач хочет быстро увидеть морфологию бактерий в окрашенном мазке из клинического материала. Какой базовый вариант наиболее уместен?',o:['Светлопольная микроскопия с иммерсионным объективом','Темнопольная микроскопия живой культуры','Сканирующая электронная микроскопия','Фазово-контрастная микроскопия нативного препарата'],a:0,e:'Окрашенные фиксированные мазки обычно исследуют в светлом поле; иммерсионный объектив повышает разрешение для бактериальных клеток.',h:'Окрашенный фиксированный мазок — классическая светлопольная бактериоскопия.'},
{q:'Почему при подозрении на вирусную инфекцию отрицательная обычная световая микроскопия не исключает наличие вируса?',o:['Вирусы обычно меньше предела разрешения светового микроскопа','Вирусы всегда бесцветны','Световой микроскоп не пропускает ультрафиолет','Вирусы видны только в темнопольном микроскопе'],a:0,e:'Размеры вирусных частиц обычно ниже разрешающей способности обычной световой микроскопии. Для диагностики используют антигенные, молекулярные, серологические и в специальных случаях электронно-микроскопические методы.',h:'Связано с пределом разрешения около 0,2 мкм.'}

{h:'1. Метаболизм бактерий: катаболизм, амфиболизм, анаболизм',img:SVG_M02_METAB,body:`<p><b>Метаболизм</b> — совокупность ферментативных реакций клетки, обеспечивающих получение энергии и синтез собственных компонентов. Условно выделяют энергетический и конструктивный обмен, которые взаимосвязаны.</p><table><thead><tr><th>Направление</th><th>Суть</th><th>Результат</th></tr></thead><tbody><tr><td>Катаболизм</td><td>Расщепление сложных субстратов до более простых</td><td>Энергия, восстановленные переносчики, промежуточные метаболиты</td></tr><tr><td>Амфиболизм</td><td>Промежуточные пути, общие для распада и синтеза</td><td>Метаболиты для энергетических и биосинтетических реакций</td></tr><tr><td>Анаболизм</td><td>Синтез клеточных макромолекул из предшественников</td><td>Белки, нуклеиновые кислоты, липиды, полисахариды</td></tr></tbody></table><p>АТФ — универсальный переносчик химической энергии; промежуточные продукты катаболизма служат строительными блоками анаболизма. Реакции идут согласованно, а не как два изолированных процесса.</p><p><b>Диагностическая связь:</b> особенности метаболизма и набора ферментов лежат в основе биохимической идентификации бактерий. <b>Источник:</b> пособие 2022, с. 36–37.</p>`},
{h:'2. Ферменты бактерий: классы, локализация и регуляция',img:SVG_M02_METAB,body:`<p>Ферменты — биологические катализаторы, преимущественно белковой природы. Бактерии используют все основные классы ферментов: оксидоредуктазы, трансферазы, гидролазы, лиазы, изомеразы и лигазы.</p><table><thead><tr><th>Признак</th><th>Варианты</th><th>Значение</th></tr></thead><tbody><tr><td>Локализация</td><td>Экзоферменты; эндоферменты</td><td>Экзоферменты расщепляют крупные субстраты вне клетки; эндоферменты работают внутри клетки</td></tr><tr><td>Регуляция синтеза</td><td>Конститутивные; индуцибельные</td><td>Конститутивные синтезируются постоянно; индуцибельные — в ответ на субстрат/условия</td></tr><tr><td>Диагностическое использование</td><td>Каталаза, оксидаза, уреаза, коагулаза, ферментация сахаров и др.</td><td>Ферментативный профиль помогает идентифицировать культуру</td></tr></tbody></table><p><b>Примеры:</b> каталаза помогает дифференцировать стафилококки от стрептококков; коагулаза — важный признак S. aureus; уреазная активность характерна для ряда видов, включая Proteus и H. pylori. Результат теста оценивают вместе с другими признаками, а не изолированно.</p><p><b>Роль в патогенности:</b> гиалуронидаза, коагулаза, ДНК-аза, протеазы и другие ферменты могут облегчать распространение, уклонение от защиты или повреждение тканей. <b>Источник:</b> с. 37, 153–154.</p>`},
{h:'3. Энергетический метаболизм: дыхание и брожение',img:SVG_M02_ENERGY,body:`<p>Энергетический обмен обеспечивает синтез АТФ. У бактерий различают аэробное дыхание, анаэробное дыхание и брожение. Ключ к различению — конечный акцептор электронов и способ образования АТФ.</p><table><thead><tr><th>Тип</th><th>Конечный акцептор</th><th>Образование АТФ</th></tr></thead><tbody><tr><td>Аэробное дыхание</td><td>Молекулярный кислород O₂</td><td>Электрон-транспортная цепь и окислительное фосфорилирование</td></tr><tr><td>Анаэробное дыхание</td><td>Не O₂: например, нитрат, сульфат, фумарат</td><td>Электрон-транспортная цепь и мембранное фосфорилирование</td></tr><tr><td>Брожение</td><td>Органическое соединение из субстрата выступает акцептором</td><td>Субстратное фосфорилирование; ЭТЦ не является основой процесса</td></tr></tbody></table><p><b>Теория Митчелла:</b> перенос электронов по мембранной цепи сопряжён с переносом протонов и формированием электрохимического градиента. Возврат протонов через АТФ-синтазу обеспечивает синтез АТФ. У бактерий дыхательная цепь локализована в цитоплазматической мембране.</p><p>Не следует запоминать фиксированное число АТФ как универсальное для всех бактерий: выход зависит от субстрата, пути и физиологических условий. <b>Источник:</b> с. 37–39, 153.</p>`},
{h:'4. Питание бактерий: источники углерода и энергии',img:SVG_M02_NUTRI,body:`<p>Питательные вещества обеспечивают клетку элементами для биосинтеза и/или источниками энергии. Основные макроэлементы: C, H, O, N, S, P, K, Na, Ca, Mg; микроэлементы требуются в меньших количествах и входят в состав ферментов и кофакторов.</p><table><thead><tr><th>Критерий</th><th>Группа</th><th>Что используют</th></tr></thead><tbody><tr><td>Источник углерода</td><td>Автотрофы</td><td>CO₂ как основной/единственный источник углерода</td></tr><tr><td>Источник углерода</td><td>Гетеротрофы</td><td>Готовые органические соединения</td></tr><tr><td>Источник энергии</td><td>Фототрофы</td><td>Свет</td></tr><tr><td>Источник энергии</td><td>Хемотрофы</td><td>Энергия химических реакций</td></tr></tbody></table><p>Эти классификации независимы: возможны фотоавтотрофы, фотогетеротрофы, хемоавтотрофы и хемогетеротрофы. Большинство клинически значимых бактерий — хемогетеротрофы.</p><p><b>Прототрофы</b> синтезируют необходимые органические соединения из базовых источников; <b>ауксотрофы</b> нуждаются в готовом факторе роста (например, определённой аминокислоте или витамине). Молочнокислые бактерии часто требовательны к факторам роста. <b>Источник:</b> с. 39–40, 153.</p>`},
{h:'5. Транспорт веществ и секреция бактериальной клетки',img:SVG_M02_TRANSPORT,body:`<p>Цитоплазматическая мембрана избирательно регулирует поступление питательных веществ и выведение продуктов обмена. Крупные молекулы часто предварительно расщепляются внеклеточными ферментами.</p><table><thead><tr><th>Механизм</th><th>Направление</th><th>Особенность</th></tr></thead><tbody><tr><td>Простая диффузия</td><td>По градиенту</td><td>Без переносчика и прямых затрат энергии</td></tr><tr><td>Облегчённая диффузия</td><td>По градиенту</td><td>С участием мембранного белка</td></tr><tr><td>Активный транспорт</td><td>Может идти против градиента</td><td>Требует энергии; системы ABC используют АТФ, другие могут использовать ионный градиент</td></tr><tr><td>Транслокация группы</td><td>Вещество модифицируется при переносе</td><td>Пример — фосфотрансферазная система PTS</td></tr></tbody></table><p><b>Секреция:</b> бактерии экспортируют белки и другие молекулы с помощью специализированных систем секреции. Экзоферменты расщепляют субстраты; токсины и эффекторные белки могут влиять на клетки хозяина и участвовать в патогенезе.</p><p><b>Клинические примеры:</b> секреция токсинов у Vibrio cholerae и Shigella; протеазы и другие ферменты у ряда возбудителей. Сам факт секреции не определяет клинический диагноз — необходима идентификация возбудителя и, когда нужно, выявление соответствующего фактора. <b>Источник:</b> с. 39–41, экзаменационный вопрос 56.</p>`},
{h:'6. Питательные среды: состав, требования и классификация',img:SVG_M02_MEDIA,body:`<p>Питательная среда должна обеспечивать рост искомого микроорганизма и позволять решить диагностическую задачу. Базовые компоненты: вода, источники углерода и азота, минеральные соли; для требовательных бактерий — факторы роста, кровь, сыворотка или специальные добавки.</p><table><thead><tr><th>Классификация</th><th>Назначение</th><th>Примеры</th></tr></thead><tbody><tr><td>По консистенции</td><td>Жидкие, плотные, полужидкие</td><td>Бульон, агар, полужидкий агар</td></tr><tr><td>По составу</td><td>Натуральные/сложные, синтетические/определённого состава</td><td>Среды на основе гидролизатов; химически определённые среды</td></tr><tr><td>По назначению</td><td>Основные, обогащённые, обогащения, селективные, дифференциально-диагностические, транспортные</td><td>МПА; кровяной агар; селенитовый бульон; Эндо/МакКонки; транспортные системы</td></tr></tbody></table><p><b>Требования:</b> питательность, оптимальные pH и осмотические условия, стерильность, подходящий окислительно-восстановительный потенциал, воспроизводимость и соответствие цели исследования.</p><p><b>Примеры применения:</b> кровяной агар — оценка гемолиза и рост ряда требовательных бактерий; Эндо/МакКонки — выделение и дифференциация грамотрицательных энтеробактерий; Левенштейна–Йенсена — культивирование микобактерий туберкулёзного комплекса. Конкретную среду выбирают с учётом материала и предполагаемого возбудителя. <b>Источник:</b> с. 41–44.</p>`},
{h:'7. Условия культивирования: температура, pH, кислород и CO₂',img:SVG_M02_MEDIA,body:`<p>Рост зависит от температуры, pH, газовой среды, влажности, осмотического давления и длительности инкубации. Условия подбирают под биологические свойства предполагаемого возбудителя.</p><table><thead><tr><th>Группа по отношению к O₂</th><th>Особенность</th><th>Примеры</th></tr></thead><tbody><tr><td>Облигатные аэробы</td><td>Нуждаются в кислороде для энергетического обмена</td><td>Pseudomonas aeruginosa, Mycobacterium tuberculosis (аэробный метаболизм)</td></tr><tr><td>Факультативные анаэробы</td><td>Растут с O₂ и без него, переключая метаболизм</td><td>Escherichia coli, Staphylococcus aureus</td></tr><tr><td>Облигатные анаэробы</td><td>Кислород подавляет рост или повреждает клетки</td><td>Clostridium spp., многие представители Bacteroides</td></tr><tr><td>Микроаэрофилы</td><td>Нуждаются в сниженной концентрации O₂</td><td>Campylobacter jejuni, Helicobacter pylori</td></tr><tr><td>Капнофилы</td><td>Лучше растут при повышенном CO₂</td><td>Haemophilus influenzae, Neisseria spp. (требования зависят от вида)</td></tr></tbody></table><p>Температурные группы: психрофилы/психротрофы, мезофилы и термофилы. Большинство возбудителей человека — мезофилы с оптимумом, близким к температуре тела, но исключения важны для лабораторной диагностики.</p><p><b>Важно:</b> Campylobacter — микроаэрофил, часто культивируется при повышенной температуре около 42 °C; это не следует обобщать на все виды рода. <b>Источник:</b> с. 44–46.</p>`},
{h:'8. Культивирование облигатных анаэробов',img:SVG_M02_MEDIA,body:`<p>Для выделения анаэробов необходимо ограничить содержание кислорода в атмосфере и/или среде, обеспечить восстановительные условия и быстро доставить материал в лабораторию без контакта с воздухом.</p><div class="facts"><div class="fact"><strong>Анаэробные контейнеры/пакеты</strong>Создают среду с низким содержанием O₂; применяются вместе с индикаторами анаэробиоза.</div><div class="fact"><strong>Анаэростат</strong>Герметичная камера, из которой удаляют кислород и формируют газовую смесь.</div><div class="fact"><strong>Редуцирующие среды</strong>Содержат восстановители, например тиогликолат; снижают окислительно-восстановительный потенциал.</div><div class="fact"><strong>Материал и транспорт</strong>Предпочтительны аспираты/ткани из очага; поверхностные мазки часто малоинформативны. Используют анаэробные транспортные системы.</div></div><p><b>Клинический пример:</b> при подозрении на клостридиальную инфекцию глубоких тканей материал следует брать из очага и доставлять в анаэробных условиях; задержка и контакт с кислородом могут привести к ложноотрицательному посеву.</p><p>В лаборатории применяют анаэробные камеры/анаэростаты, соответствующие среды и контроль анаэробных условий. <b>Источник:</b> с. 45–46.</p>`},
{h:'9. Рост и размножение бактерий: бинарное деление',img:SVG_M02_GROWTH,body:`<p>Большинство бактерий размножается бинарным делением: после репликации хромосомы клетка удлиняется, формируется перегородка и образуются две дочерние клетки. Время генерации зависит от вида и условий среды.</p><p>Рост популяции в периодической жидкой культуре проходит четыре классические фазы:</p><table><thead><tr><th>Фаза</th><th>Что происходит</th><th>Практический смысл</th></tr></thead><tbody><tr><td>Лаг-фаза</td><td>Адаптация к среде; активный синтез ферментов, деление минимально</td><td>Длительность зависит от физиологического состояния инокулята и среды</td></tr><tr><td>Экспоненциальная</td><td>Максимальная постоянная скорость деления</td><td>Клетки метаболически активны; часто выше чувствительность к антибиотикам, действующим на рост</td></tr><tr><td>Стационарная</td><td>Скорость деления примерно равна скорости гибели</td><td>Истощение субстратов и накопление продуктов обмена</td></tr><tr><td>Отмирания</td><td>Число жизнеспособных клеток снижается</td><td>Дефицит питания, токсичные метаболиты, автолиз</td></tr></tbody></table><p>На плотной среде формируются колонии; на жидкой — помутнение, поверхностная плёнка или осадок. Колония обычно происходит от одной жизнеспособной клетки или КОЕ, но не всегда строго от одной клетки в агрегированном материале. <b>Источник:</b> с. 46–47.</p>`},
{h:'10. Культуральные свойства: жидкие и плотные среды',img:SVG_M02_GROWTH,body:`<p><b>Культуральные свойства</b> — особенности роста микроорганизма на питательных средах. Их оценивают как совокупность признаков, а не как самостоятельное доказательство вида.</p><table><thead><tr><th>Среда</th><th>Наблюдаемые признаки</th><th>Ограничения</th></tr></thead><tbody><tr><td>Жидкая</td><td>Помутнение, плёнка, осадок, хлопья, характер распределения роста</td><td>Морфология роста зависит от аэрации, состава среды и возраста культуры</td></tr><tr><td>Плотная</td><td>Размер, форма, край, рельеф, поверхность, прозрачность, пигмент, гемолиз</td><td>Внешний вид зависит от среды, инкубации и условий культивирования</td></tr></tbody></table><p><b>Примеры из пособия:</b> C. diphtheriae на среде Клауберга; M. tuberculosis на среде Левенштейна–Йенсена; S. aureus на желточно-солевом агаре. Важны не только вид колонии, но и микроскопия, биохимические свойства, антигенные признаки и современные методы идентификации.</p><p>Не называй бактерию только по цвету колонии: культуральный признак — ориентир для выбора последующих тестов. <b>Источник:</b> с. 47.</p>`},
{h:'11. Чистая культура: цель и методы выделения',img:SVG_M02_GROWTH,body:`<p><b>Чистая культура</b> — популяция микроорганизмов одного вида, полученная из исследуемого материала. Её выделение необходимо для надёжной идентификации и определения чувствительности к антимикробным препаратам.</p><table><thead><tr><th>Метод</th><th>Принцип</th><th>Применение/пример</th></tr></thead><tbody><tr><td>Механическое разобщение</td><td>Посев штрихами по поверхности агара (метод Голда), шпателем Дригальского</td><td>Получение изолированных колоний</td></tr><tr><td>Серийные разведения</td><td>Снижение концентрации клеток перед посевом</td><td>Выделение колоний и количественный подсчёт КОЕ</td></tr><tr><td>Селективная обработка</td><td>Удаление части сопутствующей микрофлоры</td><td>Кислотная/щелочная обработка материала при выделении микобактерий</td></tr><tr><td>Термическая обработка</td><td>Снижение вегетативной сопутствующей флоры при сохранении спор</td><td>Выделение спорообразующих Bacillus/Clostridium по специальной методике</td></tr></tbody></table><p><b>Критически важно:</b> выделенная колония должна быть проверена микроскопически на однотипность; затем проводят пересев, идентификацию и при необходимости антибиотикограмму.</p><p><b>Источник:</b> с. 48.</p>`},
{h:'12. Бактериологический метод диагностики: этапы и контроль качества',img:SVG_M02_MEDIA,body:`<p>Культуральный (бактериологический) метод основан на выделении чистой культуры возбудителя, её идентификации и, при необходимости, определении чувствительности к препаратам. Он позволяет получить жизнеспособный изолят для дальнейшего исследования.</p><ol><li><b>Преаналитический этап:</b> выбрать правильный материал и время забора; соблюдать асептику; обеспечить достаточный объём и правильную транспортировку, включая анаэробные условия при соответствующих подозрениях.</li><li><b>Первичный посев:</b> выбрать среды, атмосферу, температуру и длительность инкубации.</li><li><b>Оценка роста:</b> изучить колонии/характер роста, выполнить микроскопию.</li><li><b>Выделение чистой культуры:</b> пересев из изолированной колонии и проверка чистоты.</li><li><b>Идентификация:</b> морфологические, культуральные, биохимические, антигенные, MALDI-TOF, ПЦР/секвенирование — по задаче и доступности.</li><li><b>Антибиотикограмма:</b> определение чувствительности по валидированной методике и актуальным критериям.</li></ol><p><b>Преимущества:</b> живой изолят, возможность фенотипической идентификации и определения чувствительности. <b>Ограничения:</b> время, требования к транспортировке и культивированию, отсутствие роста после антибиотиков/при требовательных или некультивируемых микроорганизмах.</p><p><b>Источник:</b> с. 47–48; экзаменационные вопросы 3 и 18.</p>`},
{h:'13. Генетический аппарат бактерий: нуклеоид, геном, экспрессия',img:SVG_M02_GENETICS,body:`<p>Наследственный материал бактерий представлен ДНК; у большинства бактерий основная хромосома — кольцевая двуцепочечная молекула ДНК, локализованная в нуклеоиде без ядерной мембраны. Исключения существуют: например, у отдельных бактерий хромосомы линейные или их несколько.</p><div class="facts"><div class="fact"><strong>Геном</strong>Полный набор генетической информации клетки, включая хромосомные и внехромосомные элементы.</div><div class="fact"><strong>Нуклеоид</strong>Область цитоплазмы, где организована бактериальная хромосома; не окружён мембраной.</div><div class="fact"><strong>РНК</strong>мРНК переносит информацию к рибосоме; рРНК входит в состав рибосом; тРНК доставляет аминокислоты.</div><div class="fact"><strong>Экспрессия</strong>Транскрипция ДНК в РНК и трансляция мРНК в белок; у бактерий процессы могут быть сопряжены.</div></div><p><b>Диагностическая значимость:</b> обнаружение специфических генов/участков генома используется для идентификации возбудителя, выявления генов токсинов и маркеров устойчивости. Генетический маркер не всегда равен проявленному фенотипу — экспрессия и функциональная активность требуют отдельной оценки.</p><p><b>Источник:</b> раздел 5.1, с. 49–53; контрольные вопросы пособия, с. 153–154.</p>`},
{h:'14. Плазмиды и мобильные генетические элементы',img:SVG_M02_GENETICS,body:`<p><b>Плазмиды</b> — внехромосомные репликоны, способные к автономной репликации. Они могут нести гены, повышающие приспособленность бактерии в определённых условиях.</p><table><thead><tr><th>Элемент</th><th>Характеристика</th><th>Клиническое значение</th></tr></thead><tbody><tr><td>R-плазмиды</td><td>Гены устойчивости к антимикробным препаратам</td><td>Распространение лекарственной устойчивости</td></tr><tr><td>F-плазмида</td><td>Гены конъюгации и переноса ДНК</td><td>Передача генетического материала между клетками</td></tr><tr><td>Плазмиды вирулентности</td><td>Гены факторов патогенности</td><td>Могут усиливать патогенный потенциал</td></tr><tr><td>Транспозоны</td><td>Перемещающиеся участки ДНК</td><td>Переносят гены, в том числе устойчивости, между репликонами</td></tr><tr><td>Интегроны</td><td>Системы захвата и экспрессии ген-кассет</td><td>Накопление и экспрессия детерминант устойчивости</td></tr></tbody></table><p>Мобильные элементы могут перемещать гены между хромосомой и плазмидами, облегчая горизонтальное распространение признаков. Но не каждая плазмида конъюгативна и не каждый мобильный элемент переносится самостоятельно.</p><p><b>Клинический пример:</b> плазмидные гены β-лактамаз расширенного спектра у Enterobacterales; перенос генов карбапенемаз имеет значение для эпидемиологии устойчивости. <b>Источник:</b> раздел 5.2, с. 53–58; вопрос 9.</p>`},
{h:'15. Наследственность, изменчивость, мутации и рекомбинации',img:SVG_M02_MUTATION,body:`<p><b>Наследственность</b> обеспечивает сохранение и передачу генетической информации дочерним клеткам. <b>Изменчивость</b> приводит к появлению различий между клетками и популяциями.</p><table><thead><tr><th>Форма</th><th>Механизм</th><th>Наследование</th></tr></thead><tbody><tr><td>Фенотипическая</td><td>Изменение экспрессии генов под влиянием среды</td><td>Обычно обратима и не связана с изменением последовательности ДНК</td></tr><tr><td>Мутационная</td><td>Изменение нуклеотидной последовательности</td><td>Может передаваться потомству</td></tr><tr><td>Рекомбинационная</td><td>Получение и включение чужеродной ДНК</td><td>Может приводить к устойчивым генетическим изменениям</td></tr></tbody></table><p><b>Три механизма горизонтального переноса:</b> трансформация — захват свободной ДНК; трансдукция — перенос ДНК бактериофагом; конъюгация — контакт-зависимая передача ДНК между клетками. Эти процессы могут распространять гены устойчивости и вирулентности.</p><p><b>Лизогения и фаговая конверсия:</b> геном умеренного бактериофага может сохраняться в клетке как профаг; лизогенизированная клетка остаётся жизнеспособной, но её свойства могут измениться. При фаговой (лизогенной) конверсии профаг приносит/экспрессирует дополнительные гены, например tox-ген у Corynebacterium diphtheriae, что может превращать нетоксигенный штамм в токсигенный. Не путай конверсию с трансдукцией: при трансдукции фаг переносит фрагмент ДНК бактерии-донора, а при конверсии фенотип меняется из-за генов самого профага.</p><p><b>Клиническое значение:</b> появление устойчивых вариантов, изменение антигенных/вирулентных свойств, эпидемиологическое распространение клонов. Мутация не обязательно полезна: большинство изменений нейтральны или вредны, а отбор меняет частоту вариантов в популяции.</p><p><b>Источник:</b> разделы 5.3–5.4, с. 58–62; раздел 6.2, с. 68–69; контрольные вопросы, с. 153–154; экзаменационные вопросы 9, 23, 31 и 53.</p>`}
]);

{h:'16. Генная инженерия и рекомбинантные биопрепараты',img:SVG_M02_GENETICS,body:`<p><b>Генная инженерия</b> — совокупность методов целенаправленного изменения генетического материала: выделения нужного гена, конструирования рекомбинантной ДНК и введения её в клетку-хозяина для получения заданного продукта или свойства.</p><table><thead><tr><th>Этап/инструмент</th><th>Содержание</th><th>Результат</th></tr></thead><tbody><tr><td>Выделение/амплификация гена</td><td>Получение нужной последовательности ДНК</td><td>Ген-мишень</td></tr><tr><td>Вектор</td><td>Плазмида или иной носитель с необходимыми регуляторными элементами</td><td>Доставка и поддержание конструкции</td></tr><tr><td>Клетка-хозяин</td><td>Введение конструкции и отбор продуцента</td><td>Экспрессия целевого гена</td></tr><tr><td>Контроль продукта</td><td>Очистка, оценка структуры, активности и безопасности</td><td>Рекомбинантный белок/вакцинный антиген</td></tr></tbody></table><p><b>Применение:</b> получение рекомбинантного инсулина, гормонов и цитокинов, ферментов, отдельных вакцинных антигенов и векторных вакцин; создание диагностических реагентов и исследовательских моделей.</p><p><b>Экзаменационный акцент:</b> отличай генную инженерию (технология изменения/конструирования генетического материала) от естественной рекомбинации бактерий. Рекомбинантный продукт должен пройти контроль качества, эффективности и безопасности. <b>Источник:</b> раздел 5.5, с. 63.</p>`},
{h:'17. Молекулярно-генетическая диагностика и геномика',img:SVG_M02_GENETICS,body:`<p>Молекулярно-генетические методы позволяют выявлять нуклеиновые кислоты микроорганизмов, идентифицировать культуры, определять таксономическое положение, проводить внутривидовое типирование и обнаруживать гены устойчивости/вирулентности.</p><table><thead><tr><th>Метод</th><th>Принцип</th><th>Что даёт</th></tr></thead><tbody><tr><td>ПЦР</td><td>Амплификация заданного участка ДНК; для РНК-мишеней — обратная транскрипция (ОТ-ПЦР)</td><td>Быстрое выявление специфической генетической мишени</td></tr><tr><td>ПЦР в реальном времени</td><td>Регистрация флуоресцентного сигнала по ходу амплификации</td><td>Обнаружение и оценка количества мишени в пределах валидированного теста</td></tr><tr><td>Секвенирование</td><td>Определение последовательности нуклеотидов</td><td>Идентификация, типирование, анализ генов/генома</td></tr><tr><td>ДНК-биочип</td><td>Гибридизация множества мишеней с иммобилизованными зондами</td><td>Параллельный анализ большого набора генетических признаков</td></tr></tbody></table><p><b>Ограничения:</b> обнаружение ДНК не всегда означает наличие жизнеспособного возбудителя; результат зависит от качества материала, контаминации, выбора мишени и аналитической чувствительности. Отрицательный результат не исключает инфекцию при неправильном сроке/материале или несовпадении мишени.</p><p><b>Геномика</b> изучает структуру, функции и вариации геномов. В клинической и эпидемиологической практике секвенирование может помогать сравнивать изоляты, отслеживать кластеры передачи и выявлять генетические детерминанты устойчивости. Генотипические данные интерпретируют вместе с фенотипом и эпидемиологическим контекстом. <b>Источник:</b> разделы 5.6–5.7, с. 64–65; экзаменационные вопросы 9, 23 и 31.</p>`}

 {h:'Метаболические пути: гликолиз, пентозофосфатный путь и цикл трикарбоновых кислот',img:SVG_M02_METAB,body:`<p><b>Центральный метаболизм</b> связывает поступившие субстраты с образованием АТФ, восстановительных эквивалентов и предшественников биосинтеза. Один и тот же углеродный субстрат может включаться в несколько путей; набор путей зависит от вида и условий роста.</p><h3>Ключевые пути</h3><ul><li><b>Гликолиз (путь Эмбдена—Мейергофа—Парнаса):</b> превращение глюкозы в пируват с образованием АТФ субстратным фосфорилированием и NADH.</li><li><b>Пентозофосфатный путь:</b> образование рибозо-5-фосфата для нуклеотидов и NADPH для восстановительных биосинтетических реакций.</li><li><b>Цикл трикарбоновых кислот:</b> окисление ацетил-КоА до CO₂, образование NADH/FADH₂ и промежуточных соединений для синтеза аминокислот и других компонентов.</li><li><b>Путь Энтнера—Дудорова:</b> альтернативный путь окисления глюкозы у ряда бактерий; не следует считать его универсальным.</li></ul><p><b>Связь с диагностикой:</b> различия в использовании углеводов, органических кислот и аминокислот формируют биохимический профиль культуры. Например, ферментация лактозы используется при дифференциации энтеробактерий на дифференциальных средах.</p><p><b>Экзаменационный акцент:</b> различай образование АТФ и образование восстановленных коферментов; NADH обычно передаёт электроны в дыхательную цепь, а NADPH преимущественно используется в анаболизме. Не приписывай каждой бактерии полный набор путей.</p><p><b>Источник:</b> пособие 2022, раздел физиологии бактерий, с. 36–39.</p>`},
 {h:'Окислительно-восстановительные реакции и коферменты',img:SVG_M02_ENERGY,body:`<p>Окислительно-восстановительные реакции лежат в основе получения энергии: донор электронов окисляется, акцептор восстанавливается. В клетке перенос электронов осуществляется не напрямую между всеми субстратами, а через коферменты и белки электрон-транспортной цепи.</p><div class="facts"><div class="fact"><strong>NAD⁺ / NADH</strong>NAD⁺ принимает восстановительные эквиваленты при катаболизме; NADH отдаёт электроны последующим реакциям, в том числе дыхательной цепи.</div><div class="fact"><strong>FAD / FADH₂</strong>Флавиновый кофермент, связанный с ферментами; переносит электроны и протоны.</div><div class="fact"><strong>Хиноны</strong>Липофильные переносчики электронов в мембране; перемещают электроны между компонентами цепи.</div><div class="fact"><strong>Цитохромы</strong>Гемсодержащие белки, участвующие в последовательном переносе электронов.</div></div><p><b>Энергетическое сопряжение:</b> энергия переноса электронов может использоваться для создания протон-движущей силы — электрохимического градиента через цитоплазматическую мембрану. АТФ-синтаза использует энергию обратного потока протонов для синтеза АТФ.</p><p><b>Диагностическое значение:</b> оксидазный и каталაზный тесты выявляют отдельные ферментативные активности, связанные с окислительным метаболизмом. Они помогают дифференцировать группы бактерий, но не заменяют комплексную идентификацию.</p><p><b>Не путай:</b> наличие фермента не означает, что организм обязательно является облигатным аэробом; ферментативные системы и тип энергетического метаболизма оценивают в комплексе.</p><p><b>Источник:</b> с. 36–39, контрольные вопросы пособия с. 153–154.</p>`}
