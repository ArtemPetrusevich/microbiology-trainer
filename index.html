<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Microbiology Trainer v2.5.2 — M01 + M02</title>

<style>
:root{
  --bg:#f7f5f0; --card:#fffdf8; --ink:#1d2321; --muted:#6b7570;
  --line:#e2ded2; --accent:#2f6f5e; --accent-soft:#e6f0ec;
  --violet:#6b4fa0; --crimson:#b4443a; --amber:#c98a22;
  --ok:#2f7d5d; --bad:#b4443a;
  --shadow:0 1px 2px rgba(29,35,33,.05),0 8px 24px -12px rgba(29,35,33,.18);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.55}
.wrap{max-width:780px;margin:0 auto;padding:22px 16px 64px}
h1,h2,h3{font-family:Spectral,Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0}
h1{font-size:clamp(24px,5vw,33px)}
.sub{color:var(--muted);font-size:14.5px;margin-top:7px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);overflow:hidden}
.card+.card{margin-top:14px}
button{font:inherit;cursor:pointer;border:none;border-radius:10px}
.btn{background:var(--accent);color:#fff;padding:12px 20px;font-weight:600;font-size:15px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.tag{display:inline-block;font-size:11.5px;font-weight:600;text-transform:uppercase;
  letter-spacing:.07em;padding:4px 9px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
.tag.grey{background:#eeebe3;color:var(--muted)}

.mod{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);
  border-radius:13px;background:var(--card);margin-top:10px;text-align:left;width:100%}
.mod:hover{border-color:var(--accent)}
.mod[data-locked="1"]{opacity:.55;cursor:default}
.mod[data-locked="1"]:hover{border-color:var(--line)}
.modnum{flex:0 0 38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-weight:700;font-size:14px}
.modttl{font-weight:600;font-size:15px;line-height:1.3}
.modmeta{color:var(--muted);font-size:13px;margin-top:2px}
.score-pill{font-size:12.5px;font-weight:700;color:var(--ok);background:#e8f3ed;padding:4px 9px;border-radius:20px;white-space:nowrap}

.group{margin-top:22px;margin-bottom:6px}
.group h2{font-size:18px;color:var(--ink)}
.group .sub{margin-top:3px;font-size:13.5px}

.slide-img{background:#fffefb;border:1px solid var(--line);border-radius:12px;padding:10px;margin:14px 0;overflow:hidden}
.slide-img svg,.slide-img img{display:block;width:100%;height:auto;max-width:100%;border-radius:6px}
button:focus-visible{outline:3px solid #c98a22;outline-offset:3px}
@media(max-width:420px){.card{padding:15px}.qtext{font-size:16px}.opt{padding:11px 10px;font-size:14px}.wrap{padding-left:12px;padding-right:12px}}
.photo-cap{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
.topic-stat{margin:10px 0}.topic-stat .row{font-size:13px;color:var(--muted);gap:8px}.topic-stat .row b{color:var(--ink);white-space:nowrap}.topic-stat .bar{height:6px;margin-top:5px}
.theory p{font-size:15.2px;margin:9px 0;overflow-wrap:break-word}
.theory ul{margin:9px 0;padding-left:20px;font-size:14.8px}
.theory li{margin:6px 0;overflow-wrap:break-word}
.theory b{color:#111}
.dots{display:flex;gap:6px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--accent);transform:scale(1.3)}
.hl{background:linear-gradient(transparent 62%,#ffe9a8 62%);padding:0 1px}

.facts{display:grid;gap:10px;margin:14px 0}
.theory-cards{display:grid;grid-template-columns:1fr;gap:9px;margin:12px 0 16px}
.theory-card{background:#f8f6f0;border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.theory-card-title{font-weight:700;color:var(--accent);font-size:14px;line-height:1.35;margin-bottom:7px}
.theory-card-detail{font-size:14px;line-height:1.48;color:var(--ink);margin-top:5px;overflow-wrap:anywhere}
.theory-card-detail b{display:inline;color:var(--muted);font-size:11px;letter-spacing:.045em;text-transform:uppercase;margin-right:5px}
.theory-card-detail:first-of-type{margin-top:0}
.theory-cards.compare .theory-card{background:#fbfaf6}
.quiz-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.quiz-exit{font-size:12.5px;padding:7px 11px;white-space:nowrap}

.fact{background:#f8f6f0;border:1px solid var(--line);border-radius:11px;padding:12px 14px;font-size:14.3px}
.fact strong{display:block;font-size:12.5px;color:var(--accent);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.fact-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.fact-row{grid-template-columns:1fr}}

.qmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:12px;gap:8px;flex-wrap:wrap}
.bar{height:5px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .35s}
.qtext{font-size:17px;font-weight:600;font-family:Spectral,serif;line-height:1.4;overflow-wrap:break-word}
.opts{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;background:#fff;border:1.5px solid var(--line);
  border-radius:11px;padding:12px 14px;font-size:14.8px;width:100%;transition:.14s;overflow-wrap:break-word}
.opt:hover:not(:disabled){border-color:var(--accent);background:#fcfffd}
.opt .let{flex:0 0 24px;height:24px;border-radius:7px;background:#f1efe8;color:var(--muted);
  display:grid;place-items:center;font-weight:700;font-size:12.5px}
.opt.good{border-color:var(--ok);background:#eef7f2}
.opt.good .let{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:#fcf0ef}
.opt.wrong .let{background:var(--bad);color:#fff}
.fb{margin-top:14px;border-radius:12px;padding:14px;font-size:14.5px;border:1px solid;overflow-wrap:break-word}
.fb.good{background:#eef7f2;border-color:#c6e3d4}
.fb.bad{background:#fcf0ef;border-color:#f0d2cf}
.fb b{display:block;margin-bottom:4px;font-size:14px}
.hintbtn{background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:4px 0;margin-top:10px}
.hintbox{margin-top:8px;font-size:14px;color:var(--amber);background:#fdf6e6;border:1px solid #f0e2c0;
  border-radius:10px;padding:10px 12px;overflow-wrap:break-word}

.ring{display:grid;place-items:center;margin:6px auto 14px}
.big{font-size:40px;font-weight:700;font-family:Spectral,serif}
.mistake{border-left:3px solid var(--bad);padding:8px 0 8px 12px;margin:10px 0;font-size:14.3px;overflow-wrap:break-word}
.mistake .t{font-weight:600}
.mistake .m{color:var(--muted);margin-top:3px}
.legend{font-size:13px;color:var(--muted);margin-top:6px}

/* Режим распознавания микропрепаратов */
.micro-entry{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:18px 20px;margin:18px 0;border:1px solid var(--line);border-radius:18px;background:linear-gradient(120deg,#edf4ef,#fffdf8);color:var(--ink);cursor:pointer}
.micro-entry .micro-icon{font-size:28px}.micro-entry strong{display:block;font-size:16px;margin-bottom:4px}.micro-entry small{display:block;color:var(--muted);line-height:1.45}
.micro-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 18px}.micro-toggle{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 13px;font:inherit;font-size:13px;cursor:pointer}.micro-toggle.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.micro-image{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;margin:12px auto 16px;max-width:680px}.micro-image .slide-img{max-width:100%;margin:0 auto}.micro-image img{max-height:390px;object-fit:contain}.micro-source{font-size:12px;color:var(--muted);margin:8px 2px 0;line-height:1.4}
.micro-prompt{font:600 19px/1.4 'Inter',sans-serif;margin:12px 0}.micro-note{font-size:13px;color:var(--muted);line-height:1.5;background:#f3f1e9;border-radius:12px;padding:11px 13px;margin:12px 0}.micro-feedback{padding:14px;border-radius:14px;margin-top:14px;line-height:1.55}.micro-feedback.good{background:#e8f3ed;border:1px solid #b9d8c7}.micro-feedback.bad{background:#f8ece8;border:1px solid #e7c5bb}.micro-stat{font-size:13px;color:var(--muted)}
@media(max-width:560px){.micro-entry{padding:14px}.micro-prompt{font-size:17px}.micro-image{padding:6px}.micro-image img{max-height:280px}.micro-toolbar{gap:6px}}


/* v2.3 — комплексное описание микропрепарата */
.complex-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.complex-field{min-width:0}.complex-field label{display:block;font-weight:650;font-size:14px;margin:0 0 6px}
.complex-field select{width:100%;min-height:46px;border:1px solid var(--line,#d8ddd4);border-radius:12px;padding:10px;background:var(--card,#fff);color:inherit;font:inherit}
.complex-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.complex-feedback{margin-top:14px;padding:14px;border-radius:14px;background:var(--soft,#f2f4ee);line-height:1.55}
.complex-feedback .ok{color:#23734b}.complex-feedback .bad{color:#a34236}.complex-progress{font-size:13px;color:var(--muted,#777);margin:8px 0}
@media(max-width:560px){.complex-grid{grid-template-columns:1fr}.complex-actions>*{width:100%}.complex-field select{font-size:16px}}

</style>
</head>

function cocci(kind){
  const f=C.gp;
  const lab={staph:'Стафилококки — гроздья',strep:'Стрептококки — цепочка',diplo:'Диплококки — парами',tetrad:'Тетрады — по четыре',sarcina:'Сарцины — пакеты'}[kind];
  let cells='';
  const dot=(x,y,fill=f)=>`<circle cx="${x}" cy="${y}" r="11" fill="${fill}" opacity=".85"/>`;
  if(kind==='staph'){const p=[[60,40],[82,32],[80,56],[102,46],[58,64],[100,70],[122,60],[78,80]];cells=p.map(([x,y])=>dot(x,y)).join('');}
  if(kind==='strep'){cells=[0,1,2,3,4,5].map(i=>dot(45+i*22,56)).join('');}
  if(kind==='diplo'){cells=dot(60,56)+dot(82,56)+dot(120,56)+dot(142,56);}
  if(kind==='tetrad'){cells=dot(66,44)+dot(88,44)+dot(66,66)+dot(88,66);}
  if(kind==='sarcina'){cells=dot(60,40)+dot(82,40)+dot(60,62)+dot(82,62)+dot(72,51,'#8a6cc0')+dot(94,51,'#8a6cc0');}
  return `<svg viewBox="0 0 200 110" xmlns="http://www.w3.org/2000/svg"><rect width="200" height="110" rx="8" fill="#fbf9f4"/>${cells}<text x="100" y="101" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" fill="${C.mut}">${lab}</text></svg>`;
}

const MODULES = [
{
  id:'1.1', title:'Морфологические группы бактерий', qs:'Экзаменационный вопрос: 29',
  theory:[
    {h:'Морфология бактерий: определение и основные группы', img:SVG_MORPH, body:`
      <p><b>Морфология бактерий</b> — совокупность признаков, включающая форму, размеры и взаимное расположение клеток. По пособию выделяют четыре основные морфологические группы и отдельно группу полиморфных бактерий.</p>
      <div class="facts">
        <div class="fact"><strong>1. Сферические (кокки)</strong>Сферическая, овальная, бобовидная или ланцетовидная форма; ориентировочный размер 0,5–1,5 мкм. Взаимное расположение зависит от плоскостей деления и сохранения контакта клеток.</div>
        <div class="fact"><strong>2. Палочковидные</strong>Различаются длиной, диаметром, формой концов и расположением. Возможны одиночные клетки, пары и цепочки.</div>
        <div class="fact"><strong>3. Извитые</strong>В учебной классификации: вибрионы, спириллы и спирохеты. Число и характер завитков — важные морфологические признаки.</div>
        <div class="fact"><strong>4. Нитчатые</strong>Тонкие септированные, иногда ветвящиеся нити, способные переплетаться. Примеры — актиномицеты и нокардии.</div>
        <div class="fact"><strong>Отдельно: полиморфные</strong>У представителей этой группы форма и размеры клеток могут изменяться в пределах одного вида. В пособии приведены хламидии, риккетсии и микоплазмы.</div>
      </div>
      <p class="note">Морфологическая группа — описание внешней формы и расположения клеток, а не таксономический ранг и не окончательная идентификация вида.</p>`},
    {h:'Как выглядят в реальном мазке', img:'', body: PHOTO_STAPH + PHOTO_STREP + `
      <div class="facts">
        <div class="fact"><strong>Ключ к распознаванию</strong>Смотри не только форму, но и взаимное расположение клеток после деления — это определяет группу.</div>
        <div class="fact"><strong>Гр+ vs Гр− кокки</strong>Фиолетовые гроздья/цепочки — стафило- и стрептококки. Красные диплококки (бобовидные) — нейссерии.</div>
      </div>`}
    ,{h:'Кокки и палочковидные бактерии: взаимное расположение', img:SVG_MORPH, body:`
      <p><b>Кокки</b> способны делиться в одной, двух или трёх взаимно перпендикулярных плоскостях. Если клетки после деления не расходятся, возникают характерные скопления.</p>
      <div class="facts">
        <div class="fact"><strong>Диплококки</strong>Пары клеток; деление в одной плоскости. Примеры клинически значимых представителей: <i>Neisseria gonorrhoeae</i>, <i>N. meningitidis</i>; пневмококк также имеет парное расположение, но является грамположительным.</div>
        <div class="fact"><strong>Стрептококки</strong>Цепочки разной длины; деление в одной плоскости. Пример — <i>Streptococcus pyogenes</i>.</div>
        <div class="fact"><strong>Тетрады</strong>Группы по четыре клетки; деление в двух взаимно перпендикулярных плоскостях. Тетрады могут образовывать представители рода <i>Micrococcus</i>.</div>
        <div class="fact"><strong>Сарцины</strong>Пакеты из 8, 16, 32 клеток; деление в трёх взаимно перпендикулярных плоскостях.</div>
        <div class="fact"><strong>Стафилококки</strong>Скопления, напоминающие виноградные гроздья. Пример — <i>Staphylococcus aureus</i>.</div>
      </div>
      <p>Палочки делятся в одной плоскости, перпендикулярно продольной оси клетки. Возможны монобактерии (одиночно), диплобактерии (парами) и стрептобактерии (цепочками). Примеры: <i>Escherichia coli</i> — палочка правильной формы; <i>Corynebacterium diphtheriae</i> — палочка неправильной, часто булавовидной формы. Споры образуют представители родов <i>Bacillus</i> и <i>Clostridium</i>.</p>
      <p class="note">Не следует считать, что каждый вид всегда располагается строго одним способом: на картину влияют условия роста, возраст культуры и подготовка препарата.</p>`},
    {h:'Извитые бактерии', img:'', body:`
      <div class="facts">
        <div class="fact"><strong>Вибрионы</strong>Изогнутые, напоминают запятую; один выраженный изгиб. Пример — <i>Vibrio cholerae</i>.</div>
        <div class="fact"><strong>Спириллы</strong>В пособии — бактерии с 2–5 крупными завитками. Там же хеликобактеры и кампилобактеры включены в эту морфологическую подгруппу как изогнутые формы, напоминающие «крыло летящей чайки».</div>
        <div class="fact"><strong>Спирохеты</strong>Тонкие гибкие спиралевидные бактерии с многочисленными завитками. Примеры: <i>Treponema pallidum</i>, <i>Borrelia</i> spp., <i>Leptospira interrogans</i>.</div>
      </div>
      <p><b>Клинические примеры:</b> <i>V. cholerae</i> — холера; <i>T. pallidum</i> — сифилис; <i>Borrelia</i> spp. — боррелиозы; <i>Leptospira</i> spp. — лептоспироз.</p>
      <p class="note">Классификация хеликобактеров и кампилобактеров как спирилл здесь дана в соответствии с пособием 2022 года. В современной микробиологической литературе их часто описывают как изогнутые или спиралевидные грамотрицательные палочки; это морфологические описания, а не строгие таксономические группы.</p>
      <p>Для тонких спирохет метод визуализации имеет значение: например, <i>T. pallidum</i> плохо выявляется обычной окраской по Граму; для прямой визуализации используют специальные методы, в частности темнопольную микроскопию.</p>`},
    {h:'Нитчатые и полиморфные бактерии', img:'', body:`
      <div class="facts">
        <div class="fact"><strong>Нитчатые бактерии</strong>Тонкие септированные ветвящиеся нити, которые могут формировать переплетения. Примеры — <i>Actinomyces</i> spp. и <i>Nocardia</i> spp.</div>
        <div class="fact"><strong>Actinomyces</strong>Некоторые виды входят в нормальную микробиоту полости рта; при определённых условиях могут вызывать актиномикоз.</div>
        <div class="fact"><strong>Nocardia</strong>Экологические аэробные ветвящиеся бактерии, встречающиеся в почве и окружающей среде; могут вызывать оппортунистические инфекции. Не приводить как типичного представителя нормальной микробиоты человека.</div>
        <div class="fact"><strong>Хламидии</strong>Мелкие грамотрицательные бактерии, облигатные внутриклеточные паразиты. <i>Chlamydia trachomatis</i> — патоген, не представитель нормальной микробиоты.</div>
        <div class="fact"><strong>Риккетсии</strong>Мелкие облигатные внутриклеточные бактерии; форма и размеры могут варьировать. Не относятся к нормальной микробиоте человека.</div>
        <div class="fact"><strong>Микоплазмы</strong>Не имеют клеточной стенки, окружены цитоплазматической мембраной; возможны кокковидные, нитевидные и колбовидные формы. <i>M. pneumoniae</i> — патоген; отдельные другие виды могут колонизировать слизистые, что не тождественно заболеванию.</div>
      </div>
      <p class="note">Полиморфизм — изменчивость формы и размеров, а не синоним отсутствия клеточной стенки. Отсутствие стенки характерно для микоплазм, но не для всех полиморфных бактерий.</p>`},
    {h:'Микробиота человека и морфологические примеры', img:'', body:`
      <p>Для экзамена важно уметь приводить не только возбудителей, но и представителей нормальной микробиоты, обязательно указывая локализацию.</p>
      <div class="facts">
        <div class="fact"><strong>Кокки — микробиота</strong><i>Staphylococcus epidermidis</i> и <i>Micrococcus</i> spp. — кожа; <i>Streptococcus salivarius</i> и <i>S. mitis</i> — полость рта.</div>
        <div class="fact"><strong>Кокки — патология</strong><i>S. aureus</i>, <i>S. pyogenes</i>, <i>Neisseria gonorrhoeae</i>, <i>N. meningitidis</i>.</div>
        <div class="fact"><strong>Палочки — микробиота</strong>Комменсальные штаммы <i>E. coli</i> и представители родов <i>Bifidobacterium</i> и <i>Lactobacillus</i> — кишечник; <i>Cutibacterium</i> spp. — кожа.</div>
        <div class="fact"><strong>Палочки — патология</strong><i>C. diphtheriae</i>, <i>B. anthracis</i>, <i>Clostridium tetani</i>; отдельные патогенные варианты <i>E. coli</i>.</div>
        <div class="fact"><strong>Извитые — патология</strong><i>V. cholerae</i>, <i>T. pallidum</i>, <i>Borrelia</i> spp., <i>Leptospira</i> spp. Оральные трепонемы обнаруживаются в биоплёнках полости рта, однако их нельзя без оговорок объявлять безвредной нормальной микробиотой.</div>
        <div class="fact"><strong>Нитчатые — микробиота и патология</strong><i>Actinomyces</i> spp. — микробиота полости рта и возможный возбудитель актиномикоза; <i>Nocardia</i> spp. — экологические оппортунистические патогены.</div>
        <div class="fact"><strong>Полиморфные — патология</strong><i>C. trachomatis</i>, риккетсии, <i>M. pneumoniae</i>. Некоторые микоплазмы и уреаплазмы могут колонизировать слизистые, но их обнаружение оценивают с учётом вида, локализации и клинической ситуации.</div>
      </div>
      <p class="note">Не каждый представитель микробиоты присутствует у каждого здорового человека. Колонизация, комменсализм и инфекционное заболевание — разные понятия. Приведённые примеры предназначены для морфологической ориентации, а не для видовой диагностики по одной форме клетки.</p>`},

{h:'1. Общий план строения бактериальной клетки',img:SVG_CELL,body:`
<p><b>Бактериальная клетка</b> — клетка прокариотического типа. Её главные особенности: отсутствие оформленного ядра с ядерной оболочкой и типичных мембранных органелл эукариот. Основная наследственная информация расположена в нуклеоиде.</p>
<h4>Основные и дополнительные структуры</h4>
<table><thead><tr><th>Структура</th><th>Распространённость</th><th>Основная функция</th></tr></thead><tbody>
<tr><td>Цитоплазматическая мембрана</td><td>Обязательна</td><td>Барьер, транспорт, энергетика</td></tr><tr><td>Цитоплазма</td><td>Обязательна</td><td>Среда метаболических реакций</td></tr><tr><td>Нуклеоид</td><td>Обязателен</td><td>Основная генетическая информация</td></tr><tr><td>Рибосомы 70S</td><td>Обязательны</td><td>Синтез белка</td></tr><tr><td>Клеточная стенка</td><td>У большинства</td><td>Форма и защита от осмотического лизиса</td></tr><tr><td>Капсула/слизистый слой</td><td>У отдельных бактерий</td><td>Защита, адгезия, биоплёнки</td></tr><tr><td>Жгутики</td><td>У подвижных бактерий</td><td>Движение</td></tr><tr><td>Фимбрии/пили</td><td>У отдельных бактерий</td><td>Адгезия, конъюгация</td></tr><tr><td>Плазмиды</td><td>У части бактерий</td><td>Дополнительные наследственные признаки</td></tr><tr><td>Включения</td><td>Зависит от вида и условий</td><td>Запас веществ/продукты метаболизма</td></tr><tr><td>Эндоспоры</td><td>У отдельных групп</td><td>Переживание неблагоприятных условий</td></tr>
</tbody></table>
<p><b>Важное исключение:</b> микоплазмы лишены клеточной стенки, но имеют цитоплазматическую мембрану, цитоплазму, нуклеоид и рибосомы.</p>
<h4>Функциональная организация</h4><ul><li>Мембрана регулирует обмен с внешней средой и участвует в энергетике.</li><li>Цитоплазма обеспечивает протекание значительной части метаболических реакций.</li><li>Нуклеоид содержит основную наследственную информацию.</li><li>Рибосомы синтезируют белки.</li><li>Стенка поддерживает форму и защищает от осмотического разрушения.</li><li>Поверхностные структуры обеспечивают взаимодействие с окружающей средой и организмом хозяина.</li></ul>
<h4>Диагностическое значение</h4><table><thead><tr><th>Признак</th><th>Метод выявления</th><th>Пример/значение</th></tr></thead><tbody><tr><td>Стенка</td><td>Окраска по Граму</td><td>Разделение на грамположительные и грамотрицательные бактерии</td></tr><tr><td>Капсула</td><td>Бурри–Гинс, реакция набухания</td><td>Streptococcus pneumoniae, Klebsiella pneumoniae</td></tr><tr><td>Жгутики/подвижность</td><td>Нативная микроскопия, полужидкий агар, специальные окраски</td><td>Salmonella, Escherichia coli, Vibrio cholerae</td></tr><tr><td>Волютин</td><td>Окраска по Нейссеру</td><td>Corynebacterium diphtheriae</td></tr><tr><td>Эндоспоры</td><td>Специальные окраски, например Ожешко</td><td>Bacillus, Clostridium</td></tr><tr><td>Нуклеиновые кислоты</td><td>ПЦР/секвенирование</td><td>Молекулярная идентификация</td></tr></tbody></table>
<p><b>Ограничение:</b> морфологический признак обычно даёт предварительную информацию, но редко сам по себе подтверждает вид или патогенность.</p>`},
{h:'2. Цитоплазма, цитозоль и включения',img:SVG_CELL,body:`
<p><b>Цитоплазма</b> — внутреннее содержимое клетки, ограниченное цитоплазматической мембраной. Она включает цитозоль, рибосомы, нуклеоид, плазмиды, включения и белковые комплексы. <b>Цитозоль</b> — жидкая фаза цитоплазмы с водой, ионами, ферментами, белками и метаболитами.</p>
<h4>Функции цитоплазмы</h4><table><thead><tr><th>Функция</th><th>Содержание</th></tr></thead><tbody><tr><td>Метаболическая</td><td>Протекание биохимических реакций</td></tr><tr><td>Биосинтетическая</td><td>Синтез белков и других компонентов</td></tr><tr><td>Генетическая</td><td>Содержит нуклеоид и плазмиды</td></tr><tr><td>Запасающая</td><td>Накопление питательных веществ</td></tr></tbody></table>
<h4>Внутриклеточные включения</h4><table><thead><tr><th>Вид</th><th>Состав</th><th>Значение</th></tr></thead><tbody><tr><td>Волютин/полифосфатные гранулы</td><td>Полифосфаты</td><td>Запас фосфора; метахромазия</td></tr><tr><td>Гликогеновые</td><td>Полисахарид</td><td>Запас углерода и энергии</td></tr><tr><td>Липидные</td><td>Липиды</td><td>Запас углерода и энергии</td></tr><tr><td>Серные гранулы</td><td>Элементарная сера</td><td>Промежуточный продукт метаболизма серы у соответствующих бактерий</td></tr></tbody></table>
<h4>Волютин и диагностика</h4><p>Волютин — гранулы полифосфатов, обладающие метахромазией: окрашиваются в оттенок, отличающийся от основного красителя. При окраске по Нейссеру тело коринебактерии приобретает желтовато-коричневый оттенок, а гранулы — тёмно-синий/сине-чёрный. Они могут располагаться полярно.</p>
<p><b>Диагностический пример:</b> метахроматические гранулы характерны для Corynebacterium diphtheriae и помогают при предварительном распознавании. Морфология не подтверждает токсигенность; для подтверждения требуются специальные исследования.</p>
<p><b>Методы:</b> окраска по Нейссеру, цитохимические методы, световая и электронная микроскопия. Выраженность включений зависит от вида, среды и физиологического состояния клетки.</p>`},
{h:'3. Цитоплазматическая мембрана',img:SVG_CELL,body:`
<p>Цитоплазматическая мембрана (ЦПМ) — тонкая структура, отделяющая цитоплазму от внешней среды. Её основу составляет фосфолипидный бислой с интегральными и периферическими белками. Мембрана обладает избирательной проницаемостью.</p>
<h4>Функции</h4><table><thead><tr><th>Функция</th><th>Механизм/значение</th></tr></thead><tbody><tr><td>Барьерная</td><td>Отделяет внутреннюю среду клетки</td></tr><tr><td>Транспортная</td><td>Поступление питательных веществ и выведение продуктов обмена</td></tr><tr><td>Энергетическая</td><td>Электрон-транспортная цепь, протон-движущая сила, синтез АТФ</td></tr><tr><td>Биосинтетическая</td><td>Участие в образовании компонентов клеточной оболочки</td></tr><tr><td>Секреторная и рецепторная</td><td>Выведение отдельных веществ и восприятие сигналов</td></tr></tbody></table>
<h4>Транспорт веществ</h4><ul><li><b>Пассивный транспорт:</b> движение по градиенту без непосредственного расходования энергии на перенос; включает простую и облегчённую диффузию.</li><li><b>Активный транспорт:</b> перенос с затратой энергии, в том числе против градиента концентрации.</li><li><b>Групповая транслокация:</b> вещество химически модифицируется во время переноса.</li></ul>
<h4>Энергетическая функция</h4><p>У бактерий нет митохондрий. Компоненты дыхательной цепи и АТФ-синтаза у многих бактерий локализованы в ЦПМ. Перенос электронов способствует формированию электрохимического градиента протонов, используемого для синтеза АТФ.</p>
<h4>Особенности и медицинское значение</h4><p>У большинства бактерий мембраны не содержат стеролов в типичном для эукариот количестве. Важное исключение — микоплазмы: стеролы входят в состав их мембраны и участвуют в поддержании стабильности. Микоплазмы не имеют клеточной стенки, поэтому β-лактамные антибиотики не находят у них обычной мишени — пептидогликана.</p>
<p><b>Диагностическое/терапевтическое значение:</b> мембрана — мишень отдельных антимикробных веществ; её свойства помогают понять биологию микоплазм и механизмы действия препаратов.</p>
<h4>Научная оговорка о мезосомах</h4><p>В старой литературе мезосомы описывали как складки ЦПМ, связанные с дыханием и делением. Современная трактовка рассматривает классические мезосомы как артефакты химической фиксации при подготовке образцов к электронной микроскопии. Их не следует представлять как самостоятельные обязательные органеллы живой бактериальной клетки.</p>`},
{h:'4. Нуклеоид и бактериальная хромосома',img:SVG_PRO_EU,body:`
<p><b>Нуклеоид</b> — область цитоплазмы, содержащая основную часть генетического материала бактерии. В отличие от ядра эукариот он не окружён ядерной мембраной.</p>
<h4>Бактериальная хромосома</h4><p>У многих бактерий основная хромосома представлена двуцепочечной кольцевой молекулой ДНК. Однако кольцевая форма и наличие ровно одной хромосомы не универсальны: существуют бактерии с линейными хромосомами и несколькими хромосомами.</p>
<p>ДНК компактно упакована благодаря сверхспирализации и взаимодействию с нуклеоид-ассоциированными белками. Нуклеоид не имеет ядерной оболочки.</p>
<h4>Функции</h4><table><thead><tr><th>Процесс</th><th>Значение</th></tr></thead><tbody><tr><td>Хранение информации</td><td>Сохранение наследственных признаков</td></tr><tr><td>Репликация</td><td>Удвоение ДНК перед делением</td></tr><tr><td>Транскрипция</td><td>Синтез РНК на матрице ДНК</td></tr><tr><td>Регуляция экспрессии</td><td>Контроль синтеза клеточных компонентов</td></tr><tr><td>Изменчивость</td><td>Возникновение и наследование генетических изменений</td></tr></tbody></table>
<h4>Диагностическое значение</h4><table><thead><tr><th>Метод</th><th>Что выявляет</th></tr></thead><tbody><tr><td>ПЦР</td><td>Определённые участки нуклеиновой кислоты</td></tr><tr><td>Секвенирование</td><td>Последовательность ДНК</td></tr><tr><td>Молекулярная типизация</td><td>Генетические различия между изолятами</td></tr><tr><td>FISH</td><td>Специфические нуклеиновые последовательности непосредственно в материале</td></tr></tbody></table>
<p><b>Пример:</b> ПЦР может выявить специфическую последовательность ДНК возбудителя. Однако обнаружение ДНК не всегда означает жизнеспособность микроорганизма.</p>
<p><b>Не путать:</b> нуклеоид — область локализации основной ДНК; хромосома — основная молекула генетического материала; плазмиды — дополнительные генетические элементы.</p>`},
{h:'5. Плазмиды и внехромосомные генетические элементы',img:SVG_PRO_EU,body:`
<p><b>Плазмиды</b> — внехромосомные генетические элементы, способные к автономной репликации. Чаще всего это небольшие кольцевые молекулы двуцепочечной ДНК. Плазмиды необязательны для каждой бактериальной клетки и могут обеспечивать дополнительные свойства.</p>
<h4>Основные типы</h4><table><thead><tr><th>Тип</th><th>Функция</th><th>Значение</th></tr></thead><tbody><tr><td>R-плазмиды</td><td>Гены устойчивости к антибиотикам</td><td>Распространение резистентности</td></tr><tr><td>F-плазмиды</td><td>Гены, связанные с конъюгацией</td><td>Горизонтальный перенос ДНК</td></tr><tr><td>Col-плазмиды</td><td>Продукция бактериоцинов</td><td>Подавление конкурирующих бактерий</td></tr><tr><td>Плазмиды вирулентности</td><td>Факторы патогенности</td><td>Повышение способности вызывать заболевание</td></tr><tr><td>Метаболические</td><td>Дополнительные ферментные пути</td><td>Использование отдельных субстратов</td></tr></tbody></table>
<h4>R-плазмиды и антибиотикорезистентность</h4><p>R-плазмиды могут нести гены устойчивости к одному или нескольким антимикробным препаратам. Наличие гена не всегда автоматически означает выраженную фенотипическую устойчивость: значение имеют экспрессия гена, регуляция, вид бактерии и конкретный механизм резистентности.</p>
<h4>F-плазмиды и конъюгация</h4><p>Конъюгация — форма горизонтального переноса генетического материала при контакте бактериальных клеток. F-фактор содержит генетические элементы, необходимые для работы аппарата переноса. F-пиль участвует в контакте клеток, но перенос ДНК осуществляется сложной системой белков; это не просто механическое проталкивание целой молекулы по трубке.</p>
<h4>Плазмиды вирулентности: пример Bacillus anthracis</h4><p>Плазмида pXO1 связана с генами токсинного комплекса, а pXO2 — с генами синтеза капсулы. Обе плазмиды имеют значение для вирулентности возбудителя сибирской язвы.</p>
<h4>Диагностическое значение</h4><ul><li>ПЦР выявляет определённые плазмидные гены.</li><li>Секвенирование определяет последовательность генетического материала.</li><li>Плазмидный анализ позволяет исследовать наличие и особенности плазмид.</li><li>Фенотипическое тестирование показывает, проявляется ли соответствующее свойство.</li></ul><p><b>Ограничение:</b> выявление отдельного гена ПЦР не доказывает автоматически наличие целой плазмиды или фенотипическое проявление признака.</p>`},
{h:'6. Бактериальные рибосомы',img:SVG_PRO_EU,body:`
<p>Рибосомы — немембранные структуры, обеспечивающие синтез белка. Бактериальные рибосомы имеют коэффициент седиментации 70S и состоят из малой субъединицы 30S и большой 50S.</p>
<h4>Состав субъединиц</h4><table><thead><tr><th>Субъединица</th><th>РНК</th><th>Основная роль</th></tr></thead><tbody><tr><td>30S</td><td>16S рРНК</td><td>Распознавание и декодирование мРНК</td></tr><tr><td>50S</td><td>23S и 5S рРНК</td><td>Катализ образования пептидных связей и участие в трансляции</td></tr></tbody></table>
<p>Коэффициент S (Сведберга) характеризует скорость седиментации при центрифугировании и зависит не только от массы, но также от формы и плотности частицы. Поэтому 30S + 50S обозначаются как 70S, а не 80S.</p>
<h4>Функция</h4><p>Рибосомы осуществляют трансляцию — синтез полипептидной цепи по матрице мРНК. Основные этапы: инициация, элонгация и терминация.</p>
<h4>Диагностическое значение 16S рРНК</h4><p>Ген 16S рРНК содержит консервативные и вариабельные участки. Консервативные участки позволяют использовать универсальные праймеры, а вариабельные — сравнивать бактерии. Метод применяется в систематике и молекулярной идентификации. Для некоторых близкородственных видов анализа 16S рРНК недостаточно для надёжного разделения до вида.</p>
<h4>Рибосомы как мишень антибиотиков</h4><table><thead><tr><th>Группа</th><th>Основная мишень</th></tr></thead><tbody><tr><td>Аминогликозиды</td><td>30S</td></tr><tr><td>Тетрациклины</td><td>30S</td></tr><tr><td>Макролиды</td><td>50S</td></tr><tr><td>Линкозамиды</td><td>50S</td></tr><tr><td>Хлорамфеникол</td><td>50S</td></tr></tbody></table>
<h4>Прокариоты и эукариоты</h4><table><thead><tr><th>Признак</th><th>Бактериальные</th><th>Цитоплазматические эукариотические</th></tr></thead><tbody><tr><td>Тип</td><td>70S</td><td>80S</td></tr><tr><td>Малая субъединица</td><td>30S</td><td>40S</td></tr><tr><td>Большая субъединица</td><td>50S</td><td>60S</td></tr></tbody></table>
<p><b>Оговорка:</b> митохондриальные рибосомы имеют бактериальное эволюционное происхождение и отличаются от типичных цитоплазматических рибосом эукариот. Избирательность антибиотиков не абсолютна: возможны побочные эффекты, в том числе связанные с митохондриальными процессами.</p>`},
{h:'7. Жгутики и бактериальная подвижность',img:SVG_FLAGELLA,body:`
<p>Жгутики — поверхностные структуры, обеспечивающие движение у подвижных бактерий. Они присутствуют не у всех бактерий. Основной белок филамента у многих бактерий — флагеллин.</p>
<h4>Строение</h4><table><thead><tr><th>Часть</th><th>Функция</th></tr></thead><tbody><tr><td>Филамент</td><td>Наружная длинная часть, создающая движение</td></tr><tr><td>Крюк</td><td>Соединяет филамент с базальным телом</td></tr><tr><td>Базальное тело</td><td>Закрепляет структуру и обеспечивает её работу</td></tr></tbody></table><p>Устройство базального тела различается у грамположительных и грамотрицательных бактерий.</p>
<h4>Типы расположения</h4><table><thead><tr><th>Тип</th><th>Характеристика</th></tr></thead><tbody><tr><td>Монотрих</td><td>Один жгутик на одном полюсе</td></tr><tr><td>Лофотрих</td><td>Пучок жгутиков на одном полюсе</td></tr><tr><td>Амфитрих</td><td>Жгутики на обоих полюсах</td></tr><tr><td>Перитрих</td><td>Жгутики по всей поверхности</td></tr></tbody></table>
<h4>Функции и таксисы</h4><p>Жгутики обеспечивают подвижность и участвуют в таксисах. Хемотаксис — направленное движение клетки в ответ на химические стимулы.</p>
<h4>Методы выявления</h4><table><thead><tr><th>Метод</th><th>Что устанавливает</th></tr></thead><tbody><tr><td>Нативная микроскопия</td><td>Активную подвижность</td></tr><tr><td>Темнопольная/фазово-контрастная</td><td>Наблюдение живых неокрашенных клеток</td></tr><tr><td>Специальная окраска</td><td>Визуализацию жгутиковых структур</td></tr><tr><td>Электронная микроскопия</td><td>Ультраструктуру жгутика</td></tr><tr><td>Полужидкий агар</td><td>Распространение подвижных бактерий в среде</td></tr></tbody></table>
<p>Броуновское движение — беспорядочное колебание частиц; активная подвижность — самостоятельное движение клетки. Эти явления нельзя путать.</p>
<h4>H-антиген и диагностика</h4><p>H-антиген связан с жгутиками и флагеллином. Он используется при серологической характеристике некоторых бактерий, например Salmonella. O-антиген связан с соматическим антигенным комплексом клеточной оболочки, H-антиген — с жгутиками. Обнаружение H-антигена не доказывает активную подвижность в исследуемом препарате.</p>
<p><b>Примеры подвижных бактерий:</b> многие представители Salmonella, Escherichia coli и Vibrio cholerae. Подвижность оценивают вместе с другими лабораторными признаками.</p>`},
{h:'8. Фимбрии, пили, капсула и слизистый слой',img:SVG_CELL,body:`
<h4>Фимбрии</h4><p>Фимбрии — короткие, обычно многочисленные поверхностные белковые структуры. Основная функция многих фимбрий — адгезия, то есть прикрепление к клеткам, тканям и поверхностям. Они могут способствовать колонизации и формированию биоплёнок.</p><p><b>Пример:</b> уропатогенные варианты Escherichia coli используют адгезивные структуры для прикрепления к эпителию мочевыводящих путей.</p>
<h4>Пили</h4><p>Пили — функционально неоднородные поверхностные структуры. Половой F-пиль связан с бактериальной конъюгацией — горизонтальным переносом генетического материала при контакте клеток. Не все пили обеспечивают конъюгацию, и не все адгезивные структуры следует называть F-пилями.</p>
<table><thead><tr><th>Признак</th><th>Фимбрии</th><th>Пили</th></tr></thead><tbody><tr><td>Строение</td><td>Белковые поверхностные структуры</td><td>Белковые поверхностные структуры</td></tr><tr><td>Количество</td><td>Часто многочисленные</td><td>Обычно менее многочисленные</td></tr><tr><td>Основная функция</td><td>Адгезия</td><td>Зависит от типа; F-пиль участвует в конъюгации</td></tr><tr><td>Пример значения</td><td>Колонизация эпителия E. coli</td><td>Перенос генетического материала</td></tr></tbody></table>
<h4>Капсула</h4><p>Капсула — организованный наружный слой, достаточно прочно связанный с поверхностью клетки. Чаще имеет полисахаридную природу, но существуют исключения. Капсула Bacillus anthracis состоит из поли-D-глутаминовой кислоты — полипептида.</p>
<table><thead><tr><th>Функция</th><th>Биологическое значение</th></tr></thead><tbody><tr><td>Антифагоцитарная</td><td>Затрудняет фагоцитоз</td></tr><tr><td>Защитная</td><td>Повышает устойчивость к отдельным факторам среды</td></tr><tr><td>Адгезивная</td><td>Может способствовать прикреплению</td></tr><tr><td>Иммунологическая</td><td>Влияет на распознавание и удаление бактерии</td></tr></tbody></table>
<p><b>Примеры капсульных бактерий:</b> Streptococcus pneumoniae, Klebsiella pneumoniae, Haemophilus influenzae типа b, Neisseria meningitidis, Bacillus anthracis.</p>
<h4>Слизистый слой</h4><p>Слизистый слой менее организован и обычно менее прочно связан с клеткой, чем капсула. Он способствует прикреплению, формированию биоплёнок и защите от высыхания.</p>
<table><thead><tr><th>Признак</th><th>Капсула</th><th>Слизистый слой</th></tr></thead><tbody><tr><td>Организация</td><td>Более выраженная</td><td>Менее выраженная</td></tr><tr><td>Связь с клеткой</td><td>Более прочная</td><td>Менее прочная</td></tr><tr><td>Функции</td><td>Защита, адгезия</td><td>Адгезия, биоплёнки, защита</td></tr><tr><td>Граница</td><td>Обычно более чёткая</td><td>Часто размытая</td></tr></tbody></table>
<h4>Методы выявления капсулы</h4><ul><li><b>Бурри–Гинс:</b> метод негативного контрастирования; фон тёмный, клетка окрашена, капсула видна как светлый ободок.</li><li><b>Реакция набухания капсулы:</b> выявление/серологическая характеристика капсульных антигенов.</li><li><b>Иммунологические и молекулярные методы:</b> выявление капсульных антигенов или генетических детерминант.</li></ul>
<p><b>Диагностическое значение:</b> капсула может быть фактором вирулентности; капсульные антигены используют для типирования. Например, полисахаридная капсула S. pneumoniae важна для патогенеза и серотипирования. Наличие капсулы само по себе не заменяет видовую идентификацию.</p>`},
{h:'9. Эндоспоры',img:SVG_CELL,body:`
<p><b>Эндоспоры</b> — устойчивые структуры, образуемые некоторыми бактериями при неблагоприятных условиях. Они обеспечивают сохранение жизнеспособности, но <b>не являются способом размножения</b>: одна вегетативная клетка формирует одну эндоспору, из которой при прорастании развивается одна клетка.</p>
<h4>Медицински значимые спорообразующие бактерии</h4><table><thead><tr><th>Возбудитель</th><th>Заболевание</th></tr></thead><tbody><tr><td>Bacillus anthracis</td><td>Сибирская язва</td></tr><tr><td>Clostridium tetani</td><td>Столбняк</td></tr><tr><td>Clostridium botulinum</td><td>Ботулизм</td></tr><tr><td>Clostridium perfringens</td><td>Газовая гангрена и пищевые токсикоинфекции</td></tr></tbody></table>
<p>Классические спорообразующие бактерии относятся к родам Bacillus и Clostridium. Таксономические названия некоторых видов могут меняться; в учебном контексте приведены традиционные медицинские названия.</p>
<h4>Строение эндоспоры</h4><table><thead><tr><th>Компонент</th><th>Характеристика</th></tr></thead><tbody><tr><td>Сердцевина</td><td>ДНК, рибосомы, ферменты и другие компоненты; низкое содержание воды</td></tr><tr><td>Внутренняя мембрана</td><td>Важный барьерный компонент</td></tr><tr><td>Кортекс</td><td>Особый слой пептидогликана</td></tr><tr><td>Оболочки</td><td>Белковые защитные структуры</td></tr><tr><td>Экзоспориум</td><td>Наружный дополнительный слой у некоторых спор</td></tr></tbody></table>
<h4>Причины устойчивости</h4><ul><li>Низкое содержание воды в сердцевине.</li><li>Наличие дипиколината кальция.</li><li>Защитные белки ДНК.</li><li>Многослойные оболочки.</li><li>Особенности внутренней мембраны и кортикального слоя.</li></ul><p>Устойчивость высока, но споры не абсолютно неуязвимы.</p>
<h4>Положение спор</h4><p>Споры могут располагаться центрально, субтерминально или терминально. Форма и расположение — дополнительные морфологические признаки, но не достаточные для самостоятельной видовой идентификации.</p>
<h4>Методы выявления</h4><p>Используют специальные методы окраски, в том числе метод Ожешко, а также световую и электронную микроскопию. Результат окраски оценивают с учётом протокола метода и качества препарата.</p>
<h4>Медицинское и санитарное значение</h4><p>Споры способны длительно сохраняться во внешней среде и иметь эпидемиологическое значение. Споры B. anthracis могут сохраняться в почве; споры C. tetani могут попадать в рану; споры C. botulinum имеют значение при пищевом ботулизме.</p>
<p><b>Дезинфекция и стерилизация:</b> обычная дезинфекция не всегда уничтожает споры. Стерилизация предполагает уничтожение всех форм микробной жизни, включая бактериальные споры. Эффективность обеспечивается валидированным режимом и контролем, а не одной лишь указанной температурой.</p>`}
]);

addTheory('1.3',[
{h:'Клеточная стенка: устройство и функции',img:SVG_WALL,body:`
<p>Клеточная стенка расположена снаружи цитоплазматической мембраны. Её главный механический каркас у большинства бактерий — <b>пептидогликан (муреин)</b>. Строение стенки определяет форму и устойчивость клетки, особенности окраски по Граму и доступность ряда лекарственных мишеней.</p>
<div class="facts">
<div class="fact"><strong>Механическая функция</strong>Поддерживает постоянную форму клетки и противодействует осмотическому давлению.</div>
<div class="fact"><strong>Защитная функция</strong>Снижает риск осмотического лизиса и помогает переносить неблагоприятные воздействия среды.</div>
<div class="fact"><strong>Антигенная и диагностическая роль</strong>Компоненты стенки участвуют в формировании антигенных свойств; различия стенки лежат в основе окраски по Граму и кислотоустойчивости.</div>
<div class="fact"><strong>Фармакологическая роль</strong>Пептидогликан и его синтез — мишень ряда антибактериальных препаратов; у клеток человека такой структуры нет.</div>
</div>
<p class="note">Не смешивай клеточную стенку с капсулой: капсула располагается снаружи и не является основным ригидным каркасом клетки.</p>
<p class="note">По пособию: с. 23–26.</p>`},
{h:'Пептидогликан: молекулярный каркас',img:SVG_WALL_DETAIL,body:`
<p>Пептидогликан, или муреин, — сетчатый полимер, состоящий из чередующихся сахарных остатков и коротких пептидных цепей. Именно поперечные связи между цепями придают стенке прочность.</p>
<div class="facts">
<div class="fact"><strong>Гликановый остов</strong>Чередующиеся остатки N-ацетилглюкозамина (NAG) и N-ацетилмурамовой кислоты (NAM), соединённые β-1,4-связями.</div>
<div class="fact"><strong>Пептидные боковые цепи</strong>К NAM присоединены короткие пептиды; их состав и организация могут различаться у разных бактерий.</div>
<div class="fact"><strong>Поперечное сшивание</strong>Пептидные цепи соседних гликановых нитей соединяются напрямую или через межпептидные мостики.</div>
<div class="fact"><strong>Функциональный результат</strong>Формируется трёхмерная сетка, которая сохраняет форму клетки и препятствует её разрыву под действием внутреннего осмотического давления.</div>
</div>
<p><b>Ключевая мишень:</b> транспептидазы (пенициллин-связывающие белки, PBP) участвуют в сшивании пептидогликана. β-лактамы ингибируют эти ферменты и нарушают построение стенки.</p>
<p class="note">По пособию: с. 23–24. Точная химическая схема нужна для понимания мишени антибиотиков, но не заменяет изучение различий Гр+ и Гр−.</p>`},
{h:'Грамположительная клеточная стенка',img:SVG_GP,body:`
<p>У типичных грамположительных бактерий стенка содержит толстый, многослойный пептидогликан. Наружной мембраны, характерной для Гр− бактерий, нет.</p>
<div class="facts">
<div class="fact"><strong>Пептидогликан</strong>Составляет основную массу стенки; в пособии приведён диапазон около 40–90% её массы.</div>
<div class="fact"><strong>Тейхоевые кислоты</strong>Полимеры глицеролфосфата или рибитолфосфата, связанные с пептидогликаном; важны для поверхностных свойств и антигенности.</div>
<div class="fact"><strong>Липотейхоевые кислоты</strong>Связаны с цитоплазматической мембраной липидным участком и проходят через слой пептидогликана.</div>
<div class="fact"><strong>Наружная мембрана</strong>Отсутствует; поэтому у типичных Гр+ нет наружномембранного ЛПС.</div>
</div>
<p><b>Примеры:</b> Staphylococcus aureus, Streptococcus pyogenes, Enterococcus faecalis, Bacillus anthracis. Это примеры грамположительных бактерий, а не исчерпывающий список.</p>
<p class="note">По пособию: с. 23–24. Числовые доли — характеристика, приведённая в пособии; не воспринимай её как неизменную величину для каждого вида.</p>`},
{h:'Грамотрицательная стенка: две мембраны и периплазма',img:SVG_GN,body:`
<p>У типичных грамотрицательных бактерий тонкий слой пептидогликана расположен между цитоплазматической и наружной мембранами. Между ними находится периплазматическое пространство.</p>
<div class="facts">
<div class="fact"><strong>Цитоплазматическая мембрана</strong>Внутренняя мембрана клетки; ограничивает цитоплазму.</div>
<div class="fact"><strong>Периплазма</strong>Пространство между двумя мембранами. Содержит пептидогликан, транспортные и другие белки, ферменты, в том числе у отдельных бактерий β-лактамазы.</div>
<div class="fact"><strong>Наружная мембрана</strong>Дополнительный барьер, содержащий фосфолипиды, белки и липополисахарид.</div>
<div class="fact"><strong>Порины</strong>Белковые каналы наружной мембраны, через которые проходят вода и некоторые небольшие гидрофильные молекулы.</div>
</div>
<p><b>Диагностическое значение:</b> наружная мембрана влияет на проницаемость и чувствительность к антибиотикам. Наличие или отсутствие конкретного механизма устойчивости нельзя выводить только из результата окраски по Граму.</p>
<p class="note">По пособию: с. 25. Периплазма не является «пустой щелью»: это функционально значимая область клетки.</p>`},
{h:'Липополисахарид: строение и эндотоксическое действие',img:SVG_LPS,body:`
<p>Липополисахарид (ЛПС) — компонент наружной мембраны грамотрицательных бактерий. В пособии выделены три структурные части.</p>
<div class="facts">
<div class="fact"><strong>Липид А</strong>Консервативная токсическая часть ЛПС; именно с ней связано эндотоксическое действие.</div>
<div class="fact"><strong>Коровая (core) часть</strong>Относительно консервативная олигосахаридная область, соединяющая липид А с О-антигеном.</div>
<div class="fact"><strong>О-антиген</strong>Высоковариабельная полисахаридная часть из повторяющихся олигосахаридных единиц; используется при антигенной дифференцировке.</div>
</div>
<p>При попадании ЛПС в организм липид А активирует врождённый иммунный ответ. Избыточная системная реакция может сопровождаться лихорадкой, гипотензией, нарушением микроциркуляции и септическим шоком.</p>
<p><b>S- и R-формы:</b> полноценная О-полисахаридная цепь обычно связана с гладкими (S, smooth) колониями; укорочение или дефекты ЛПС могут сопровождаться шероховатым (R, rough) фенотипом.</p>
<p class="note">По пособию: с. 25. ЛПС — компонент наружной мембраны Гр− бактерий; не называй эндотоксином весь пептидогликан.</p>`},
{h:'Кислотоустойчивая клеточная стенка',img:SVG_ACID,body:`
<p>Кислотоустойчивость связана с особым липид-богатым строением клеточной оболочки. Главные учебные примеры — микобактерии; в пособии также упомянуты нокардии.</p>
<div class="facts">
<div class="fact"><strong>Пептидогликан</strong>Формирует внутренний структурный слой стенки.</div>
<div class="fact"><strong>Миколовые кислоты</strong>Длинноцепочечные липиды наружных слоёв; связаны с гидрофобностью и кислотоустойчивостью.</div>
<div class="fact"><strong>Гликолипиды и воски</strong>Дополняют липидный барьер и влияют на проницаемость оболочки.</div>
<div class="fact"><strong>Корд-фактор</strong>Трегалозодимиколат; в пособии указан как фактор вирулентности микобактерий, влияющий на взаимодействие с макрофагами.</div>
</div>
<p><b>Примеры:</b> Mycobacterium tuberculosis, M. leprae; Nocardia spp. обладают частичной/вариабельной кислотоустойчивостью, поэтому не приравнивай их без оговорок к микобактериям.</p>
<p><b>Диагностика:</b> кислотоустойчивость выявляют специальными методами окраски, например по Цилю–Нильсену. Подробный алгоритм окраски изучается в подмодуле 1.4.</p>
<p class="note">По пособию: с. 25–26. Здесь рассматриваем химико-структурную основу, а не пошаговую методику окраски.</p>`},
{h:'L-формы и бактерии без клеточной стенки',img:SVG_LFORM,body:`
<p>L-формы — варианты бактерий, у которых полностью или частично утрачен пептидогликан клеточной стенки. В результате клетки могут приобретать шаровидную, колбовидную или другую изменчивую форму.</p>
<div class="facts">
<div class="fact"><strong>Происхождение</strong>Могут возникать из бактерий под действием факторов, нарушающих синтез или целостность стенки; в пособии описаны как мутантные варианты.</div>
<div class="fact"><strong>Свойства</strong>Из-за отсутствия полноценного пептидогликанового каркаса форма нестабильна, клетки осмочувствительны; некоторые варианты способны проходить через бактериальные фильтры.</div>
<div class="fact"><strong>Медицинское значение</strong>Могут иметь значение при персистенции инфекции и затруднённом выявлении обычными методами; клиническую роль оценивают с учётом конкретной ситуации.</div>
</div>
<p><b>Не путай:</b> L-форма — вариант бактерии, обычно возникший из исходной бактерии; Mycoplasma — самостоятельная группа бактерий, естественно лишённых клеточной стенки. У микоплазм нет пептидогликана и они изначально нечувствительны к антибиотикам, действующим на его синтез.</p>
<p class="note">По пособию: с. 26. Пособие приводит среди описанных L-форм различные бактерии, включая гонококки.</p>`},
{h:'Стенка как мишень антибиотиков и диагностический ориентир',img:SVG_TARGET,body:`
<p>Строение клеточной стенки помогает объяснить действие нескольких групп антибактериальных препаратов и некоторые особенности лабораторного результата.</p>
<div class="facts">
<div class="fact"><strong>β-лактамы</strong>Связываются с PBP и нарушают сшивание пептидогликана. Эффект зависит от доступности мишени, активности препарата и механизмов устойчивости.</div>
<div class="fact"><strong>Гликопептиды</strong>Связывают концевые участки предшественников пептидогликана и препятствуют построению стенки; крупным молекулам трудно проникать через наружную мембрану Гр− бактерий.</div>
<div class="fact"><strong>Лизоцим</strong>Расщепляет β-1,4-связь между NAG и NAM; доступность пептидогликана может ограничиваться дополнительными наружными слоями.</div>
<div class="fact"><strong>Микоплазмы</strong>Не имеют пептидогликана, поэтому β-лактамы не действуют на них через эту мишень.</div>
</div>
<p><b>Практический вывод:</b> окраска по Граму — быстрый ориентир для первичной оценки материала, но не видовая идентификация и не антибиотикограмма. Для выбора терапии нужны клинический контекст и результаты исследований чувствительности.</p>
<p class="note">Связь структуры и лекарственных мишеней — учебное объяснение; не используй одну окраску как основание для назначения антибиотика.</p>`},
{h:'Итоговая диагностика: сравнение типов оболочки',img:SVG_COMPARE,body:`
<p>Это сводная экзаменационная карточка, а не новый материал: используй её, чтобы связать признаки из предыдущих карточек с выбором метода диагностики и интерпретацией клинического случая.</p>
<p class="note"><b>Экзаменационный вопрос №52:</b> «Структура и функции клеточной стенки бактерий. Особенности строения клеточной стенки грамположительных и грамотрицательных бактерий. Методы их дифференцировки. Роль в микробиологической диагностике, примеры».</p>
<table><thead><tr><th>Тип оболочки</th><th>Ключевые признаки</th><th>Примеры</th><th>Диагностический акцент</th></tr></thead><tbody>
<tr><td>Грамположительная</td><td>Толстый пептидогликан; тейхоевые кислоты; нет наружной мембраны и ЛПС</td><td>Staphylococcus, Streptococcus, Enterococcus, Bacillus</td><td>Обычно фиолетовая окраска по Граму; оценивать морфологию и расположение клеток отдельно</td></tr>
<tr><td>Грамотрицательная</td><td>Тонкий пептидогликан; наружная мембрана; ЛПС; периплазма</td><td>Escherichia, Salmonella, Neisseria, Pseudomonas</td><td>Обычно розовая/красная окраска; наружная мембрана влияет на проницаемость</td></tr>
<tr><td>Кислотоустойчивая</td><td>Липид-богатая оболочка с миколовыми кислотами</td><td>Mycobacterium; Nocardia — частичная кислотоустойчивость</td><td>Нужны специальные методы выявления кислотоустойчивости</td></tr>
<tr><td>Без пептидогликана</td><td>Нет классической клеточной стенки</td><td>Mycoplasma</td><td>β-лактамы не имеют соответствующей мишени; выраженный полиморфизм формы</td></tr>
<tr><tr><td>L-форма</td><td>Полная или частичная утрата пептидогликана у исходной бактерии</td><td>Разные бактериальные виды</td><td>Осмочувствительность и изменчивая форма; не путать с микоплазмами</td></tr>
</tbody></table>
<p><b>Клинический пример 1.</b> В мазке из крови обнаружены грамотрицательные палочки. Это сужает круг предположений, но не позволяет назвать вид: нужны посев/идентификация и другие тесты.</p>
<p><b>Клинический пример 2.</b> При подозрении на туберкулёз отрицательная обычная окраска по Граму не исключает микобактерии: учитывают кислотоустойчивость и применяют соответствующие методы диагностики.</p>
<p class="note">По пособию: с. 23–26. Сравнение объединяет структурные сведения; методики окраски подробно разбираются в 1.4.</p>`}
]);
addQuiz('1.3',[
{q:'Какой компонент является основным механическим каркасом клеточной стенки большинства бактерий?',o:['Липополисахарид','Пептидогликан','Капсульный полисахарид','Флагеллин'],a:1,e:'Пептидогликан (муреин) формирует сетчатый каркас, поддерживает форму клетки и препятствует осмотическому лизису. ЛПС — компонент наружной мембраны Гр− бактерий; капсула лежит снаружи стенки; флагеллин образует жгутик.',h:'Вспомни муреин.'},
{q:'Из каких двух сахаров построен гликановый остов пептидогликана?',o:['Глюкоза и фруктоза','NAG и NAM','Рибоза и дезоксирибоза','Галактоза и манноза'],a:1,e:'Гликановые цепи состоят из чередующихся N-ацетилглюкозамина (NAG) и N-ацетилмурамовой кислоты (NAM). К NAM присоединяются пептидные цепи.',h:'Два ацетилированных аминосахара.'},
{q:'Что обеспечивает прочность трёхмерной сетки пептидогликана?',o:['Поперечные связи между пептидными цепями','О-антиген','Порины','Миколовые кислоты'],a:0,e:'Поперечное сшивание пептидных цепей связывает соседние гликановые нити в прочную сеть. О-антиген относится к ЛПС, порины — к наружной мембране Гр−, миколовые кислоты — к липид-богатой оболочке кислотоустойчивых бактерий.',h:'Сшивание соседних цепей.'},
{q:'Какова главная функция пептидогликана?',o:['Синтез АТФ','Поддержание формы и защита от осмотического лизиса','Хранение наследственной информации','Прикрепление полового пиля'],a:1,e:'Пептидогликан придаёт стенке ригидность, сохраняет форму и противодействует осмотическому давлению. Энергетические процессы локализованы преимущественно в цитоплазматической мембране, ДНК — в нуклеоиде.',h:'Механическая прочность.'},
{q:'Какой признак наиболее характерен для типичной грамположительной клеточной стенки?',o:['Наружная мембрана с ЛПС','Толстый пептидогликан и тейхоевые кислоты','Тонкий пептидогликан между двумя мембранами','Миколовые кислоты как обязательный компонент'],a:1,e:'Гр+ бактерии имеют толстый слой пептидогликана и тейхоевые/липотейхоевые кислоты; наружной мембраны с ЛПС у них нет. Миколовые кислоты характерны для кислотоустойчивых бактерий.',h:'Массивный муреиновый слой.'},
{q:'Какой компонент связан с цитоплазматической мембраной у грамположительных бактерий?',o:['Липотейхоевая кислота','О-антиген','Липид А','Порин'],a:0,e:'Липотейхоевые кислоты закреплены в цитоплазматической мембране липидным участком и проходят через пептидогликановый слой. О-антиген и липид А — части ЛПС Гр−; порины находятся в наружной мембране.',h:'В названии есть указание на мембрану.'},
{q:'У какого из перечисленных микроорганизмов ожидается грамположительный тип стенки?',o:['Escherichia coli','Neisseria meningitidis','Staphylococcus aureus','Pseudomonas aeruginosa'],a:2,e:'S. aureus — грамположительный кокк. E. coli, N. meningitidis и P. aeruginosa — грамотрицательные бактерии.',h:'Классический стафилококк.'},
{q:'Какой признак отличает типичную грамотрицательную оболочку?',o:['Отсутствие наружной мембраны','Наружная мембрана с ЛПС','Очень толстый слой пептидогликана','Тейхоевые кислоты как главный наружный компонент'],a:1,e:'Для Гр− характерна наружная мембрана с ЛПС, тонкий пептидогликан и периплазматическое пространство. У типичных Гр+ наружной мембраны нет.',h:'Ищи дополнительную внешнюю мембрану.'},
{q:'Где расположен пептидогликан у грамотрицательных бактерий?',o:['Снаружи наружной мембраны','Между цитоплазматической и наружной мембранами','Внутри нуклеоида','В составе капсулы'],a:1,e:'Тонкий слой пептидогликана находится в периплазматической области между внутренней цитоплазматической и наружной мембранами.',h:'Между двумя мембранами.'},
{q:'Что из перечисленного может находиться в периплазматическом пространстве Гр− бактерий?',o:['β-лактамазы','Ядрышко','Митохондрии','Рибосомы 80S'],a:0,e:'Периплазма содержит различные ферменты и транспортные белки; у ряда бактерий в ней локализуются β-лактамазы. Ядрышка и митохондрий у бактерий нет.',h:'Ферменты, способные инактивировать β-лактамы.'},
{q:'Какую функцию выполняют порины наружной мембраны Гр− бактерий?',o:['Образуют каналы для прохождения небольших гидрофильных молекул','Сшивают пептидогликан','Синтезируют белок','Формируют эндоспоры'],a:0,e:'Порины — белковые каналы наружной мембраны, через которые могут проходить вода и некоторые небольшие гидрофильные молекулы. Они не являются ферментами синтеза стенки.',h:'Каналы в наружной мембране.'},
{q:'Какая часть ЛПС обладает эндотоксической активностью?',o:['О-антиген','Коровая часть','Липид А','Пептидогликан'],a:2,e:'Липид А — токсическая часть ЛПС. О-антиген обеспечивает вариабельные антигенные свойства, а core — коровая олигосахаридная часть.',h:'Токсическая часть молекулы.'},
{q:'Какой компонент ЛПС наиболее вариабелен и используется для антигенной дифференцировки?',o:['Липид А','О-антиген','Фосфолипидный бислой','Пептидогликан'],a:1,e:'О-антиген — высоковариабельная полисахаридная часть ЛПС, состоящая из повторяющихся олигосахаридных единиц. Липид А более консервативен и связан с эндотоксическим действием.',h:'Буква O — антигенная специфичность.'},
{q:'Какой ответ организма может быть связан с системным действием ЛПС?',o:['Септический шок','Синтез антител только класса IgE','Образование эндоспор','Формирование капсулы бактерии'],a:0,e:'ЛПС, прежде всего липид А, способен активировать выраженный врождённый воспалительный ответ; при системной реакции возможны гипотензия и септический шок.',h:'Эндотоксин и системное воспаление.'},
{q:'С чем обычно связано появление шероховатых R-колоний у Гр− бактерий?',o:['Укорочением или дефектами ЛПС','Увеличением числа жгутиков','Появлением ядра','Утолщением капсулы у всех видов'],a:0,e:'Дефекты или укорочение ЛПС, в том числе О-полисахаридной части, могут сопровождаться формированием шероховатых R-колоний. Это не универсальное описание всех изменений колоний.',h:'R — rough, шероховатый.'},
{q:'Какие бактерии относятся к кислотоустойчивым в первую очередь?',o:['Стафилококки','Микобактерии','Энтерококки','Нейссерии'],a:1,e:'Кислотоустойчивость микобактерий связана с липид-богатой оболочкой и миколовыми кислотами. Нокардии могут проявлять частичную кислотоустойчивость.',h:'Возбудитель туберкулёза.'},
{q:'Какой компонент оболочки особенно связан с кислотоустойчивостью микобактерий?',o:['Тейхоевые кислоты','Миколовые кислоты','О-антиген','Флагеллин'],a:1,e:'Миколовые кислоты входят в состав наружных слоёв клеточной оболочки микобактерий, повышают гидрофобность и связаны с кислотоустойчивостью.',h:'Длинноцепочечные липиды.'},
{q:'Что такое корд-фактор микобактерий?',o:['Трегалозодимиколат','О-антиген','Фермент синтеза ДНК','Белок порина'],a:0,e:'Корд-фактор — трегалозодимиколат, гликолипид микобактерий, который рассматривают как фактор вирулентности.',h:'Название связано с характерным ростом микобактерий в виде жгутов.'},
{q:'Какой микроорганизм является типичным примером кислотоустойчивой бактерии?',o:['Mycobacterium tuberculosis','Streptococcus pyogenes','Escherichia coli','Vibrio cholerae'],a:0,e:'M. tuberculosis обладает липид-богатой оболочкой с миколовыми кислотами и выявляется специальными методами окраски на кислотоустойчивость.',h:'Возбудитель туберкулёза.'},
{q:'Какой метод применяют для выявления кислотоустойчивых бактерий?',o:['Циль–Нильсен','Нейссер','Бурри–Гинс','Ожешко'],a:0,e:'Окраска по Цилю–Нильсену предназначена для выявления кислотоустойчивых бактерий. Подробные этапы метода изучаются в подмодуле 1.4.',h:'Метод для микобактерий.'},
{q:'Что наиболее точно характеризует L-формы бактерий?',o:['Естественно лишённые стенки представители отдельного рода','Варианты бактерий с полной или частичной утратой пептидогликана','Бактерии с дополнительной наружной мембраной','Обязательные спорообразующие формы'],a:1,e:'L-формы возникают из бактерий при утрате или нарушении построения пептидогликана; клетки приобретают изменчивую форму и осмочувствительность.',h:'Утрата стенки у исходной бактерии.'},
{q:'Чем микоплазмы принципиально отличаются от L-форм?',o:['Микоплазмы имеют толстый пептидогликан','Микоплазмы естественно лишены клеточной стенки как группа','L-формы всегда являются вирусами','Различий нет'],a:1,e:'Микоплазмы — бактерии, естественно лишённые клеточной стенки. L-формы — варианты других бактерий, утратившие пептидогликан полностью или частично.',h:'Одна группа изначально без стенки, другая — производная.'},
{q:'Почему β-лактамы не действуют на микоплазмы через обычную мишень?',o:['У микоплазм нет пептидогликана и PBP-мишени стенки','У них рибосомы 80S','Они не содержат ДНК','Они всегда находятся внутри эритроцитов'],a:0,e:'β-лактамы нарушают синтез пептидогликана через PBP. У микоплазм нет клеточной стенки с пептидогликаном, поэтому этой мишени нет.',h:'Нет стенки — нет мишени для β-лактамов.'},
{q:'Какой ферментный комплекс непосредственно ингибируют β-лактамы?',o:['Пенициллин-связывающие белки (PBP)','ДНК-гиразу','РНК-полимеразу','АТФ-синтазу'],a:0,e:'β-лактамы связываются с PBP, в том числе транспептидазами, нарушая поперечное сшивание пептидогликана.',h:'Ферменты финального сшивания стенки.'},
{q:'Почему наружная мембрана Гр− бактерий может снижать чувствительность к некоторым антибиотикам?',o:['Она служит дополнительным барьером проницаемости','Она превращает антибиотики в антитела','Она удаляет всю ДНК клетки','Она заменяет рибосомы'],a:0,e:'Наружная мембрана ограничивает проникновение ряда веществ. Важны также порины, эффлюксные системы и ферменты устойчивости; результат окраски по Граму сам по себе не определяет чувствительность.',h:'Дополнительный барьер.'},
{q:'Как действует лизоцим на пептидогликан?',o:['Расщепляет связь между NAG и NAM','Разрушает липид А','Блокирует синтез ДНК','Удаляет тейхоевые кислоты из мембраны'],a:0,e:'Лизоцим гидролизует β-1,4-связь между NAG и NAM в гликановом остове пептидогликана.',h:'Он действует на сахарный остов.'},
{q:'Какой результат окраски по Граму обычно ожидают для грамположительных бактерий?',o:['Фиолетовый/сине-фиолетовый','Красный/розовый','Зелёный','Полное отсутствие окраски у всех клеток'],a:0,e:'Грамположительные клетки обычно удерживают комплекс первичного красителя с йодом и выглядят фиолетовыми. Последовательность этапов подробно изучается в 1.4.',h:'Гр+ удерживают первичный краситель.'},

{q:'Какой диагностический вывод ошибочен?',o:['Грамотрицательная окраска помогает сузить круг возбудителей','Кислотоустойчивость связана с липид-богатой оболочкой','Окраска по Граму сама по себе определяет вид бактерии и чувствительность к антибиотикам','ЛПС характерен для наружной мембраны Гр− бактерий'],a:2,e:'Окраска по Граму не является видовой идентификацией и не заменяет антибиотикограмму. Остальные утверждения соответствуют базовым особенностям оболочки.',h:'Не делай из ориентиров окончательный диагноз.'},
{q:'Какое утверждение о тейхоевых кислотах верно?',o:['Характерны для типичной стенки Гр+ бактерий','Являются токсической частью ЛПС','Формируют порины наружной мембраны','Составляют миколовые слои микобактерий'],a:0,e:'Тейхоевые и липотейхоевые кислоты характерны для грамположительной клеточной стенки. Липид А — часть ЛПС, порины — белки наружной мембраны Гр−.',h:'Компонент грамположительной стенки.'},
{q:'Какой набор признаков наиболее характерен для грамотрицательной оболочки?',o:['Толстый пептидогликан, тейхоевые кислоты, одна мембрана','Тонкий пептидогликан, периплазма, наружная мембрана с ЛПС','Миколовые кислоты и отсутствие всех мембран','Отсутствие пептидогликана у всех представителей'],a:1,e:'Типичная Гр− оболочка включает тонкий пептидогликан в периплазме между двумя мембранами и наружный ЛПС-содержащий слой.',h:'Две мембраны плюс тонкий муреин.'},
