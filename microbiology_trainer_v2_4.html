<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Микробиология — тренажёр к экзамену · v2.4</title>

<style>
:root{
  --bg:#f7f5f0; --card:#fffdf8; --ink:#1d2321; --muted:#6b7570;
  --line:#e2ded2; --accent:#2f6f5e; --accent-soft:#e6f0ec;
  --violet:#6b4fa0; --crimson:#b4443a; --amber:#c98a22;
  --ok:#2f7d5d; --bad:#b4443a;
  --shadow:0 1px 2px rgba(29,35,33,.05),0 8px 24px -12px rgba(29,35,33,.18);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.55}
.wrap{max-width:780px;margin:0 auto;padding:22px 16px 64px}
h1,h2,h3{font-family:Spectral,Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0}
h1{font-size:clamp(24px,5vw,33px)}
.sub{color:var(--muted);font-size:14.5px;margin-top:7px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);overflow:hidden}
.card+.card{margin-top:14px}
button{font:inherit;cursor:pointer;border:none;border-radius:10px}
.btn{background:var(--accent);color:#fff;padding:12px 20px;font-weight:600;font-size:15px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.tag{display:inline-block;font-size:11.5px;font-weight:600;text-transform:uppercase;
  letter-spacing:.07em;padding:4px 9px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
.tag.grey{background:#eeebe3;color:var(--muted)}

.mod{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);
  border-radius:13px;background:var(--card);margin-top:10px;text-align:left;width:100%}
.mod:hover{border-color:var(--accent)}
.mod[data-locked="1"]{opacity:.55;cursor:default}
.mod[data-locked="1"]:hover{border-color:var(--line)}
.modnum{flex:0 0 38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-weight:700;font-size:14px}
.modttl{font-weight:600;font-size:15px;line-height:1.3}
.modmeta{color:var(--muted);font-size:13px;margin-top:2px}
.score-pill{font-size:12.5px;font-weight:700;color:var(--ok);background:#e8f3ed;padding:4px 9px;border-radius:20px;white-space:nowrap}

.group{margin-top:22px;margin-bottom:6px}
.group h2{font-size:18px;color:var(--ink)}
.group .sub{margin-top:3px;font-size:13.5px}

.slide-img{background:#fffefb;border:1px solid var(--line);border-radius:12px;padding:10px;margin:14px 0;overflow:hidden}
.slide-img svg,.slide-img img{display:block;width:100%;height:auto;max-width:100%;border-radius:6px}
button:focus-visible{outline:3px solid #c98a22;outline-offset:3px}
@media(max-width:420px){.card{padding:15px}.qtext{font-size:16px}.opt{padding:11px 10px;font-size:14px}.wrap{padding-left:12px;padding-right:12px}}\nbutton:focus-visible{outline:3px solid #c98a22;outline-offset:3px}\n@media(max-width:420px){.card{padding:15px}.qtext{font-size:16px}.opt{padding:11px 10px;font-size:14px}.wrap{padding-left:12px;padding-right:12px}}
.photo-cap{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
.theory p{font-size:15.2px;margin:9px 0;overflow-wrap:break-word}
.theory ul{margin:9px 0;padding-left:20px;font-size:14.8px}
.theory li{margin:6px 0;overflow-wrap:break-word}
.theory b{color:#111}
.dots{display:flex;gap:6px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--accent);transform:scale(1.3)}
.hl{background:linear-gradient(transparent 62%,#ffe9a8 62%);padding:0 1px}

.facts{display:grid;gap:10px;margin:14px 0}
.fact{background:#f8f6f0;border:1px solid var(--line);border-radius:11px;padding:12px 14px;font-size:14.3px}
.fact strong{display:block;font-size:12.5px;color:var(--accent);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.fact-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.fact-row{grid-template-columns:1fr}}

.qmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:12px;gap:8px;flex-wrap:wrap}
.bar{height:5px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .35s}
.qtext{font-size:17px;font-weight:600;font-family:Spectral,serif;line-height:1.4;overflow-wrap:break-word}
.opts{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;background:#fff;border:1.5px solid var(--line);
  border-radius:11px;padding:12px 14px;font-size:14.8px;width:100%;transition:.14s;overflow-wrap:break-word}
.opt:hover:not(:disabled){border-color:var(--accent);background:#fcfffd}
.opt .let{flex:0 0 24px;height:24px;border-radius:7px;background:#f1efe8;color:var(--muted);
  display:grid;place-items:center;font-weight:700;font-size:12.5px}
.opt.good{border-color:var(--ok);background:#eef7f2}
.opt.good .let{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:#fcf0ef}
.opt.wrong .let{background:var(--bad);color:#fff}
.fb{margin-top:14px;border-radius:12px;padding:14px;font-size:14.5px;border:1px solid;overflow-wrap:break-word}
.fb.good{background:#eef7f2;border-color:#c6e3d4}
.fb.bad{background:#fcf0ef;border-color:#f0d2cf}
.fb b{display:block;margin-bottom:4px;font-size:14px}
.hintbtn{background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:4px 0;margin-top:10px}
.hintbox{margin-top:8px;font-size:14px;color:var(--amber);background:#fdf6e6;border:1px solid #f0e2c0;
  border-radius:10px;padding:10px 12px;overflow-wrap:break-word}

.ring{display:grid;place-items:center;margin:6px auto 14px}
.big{font-size:40px;font-weight:700;font-family:Spectral,serif}
.mistake{border-left:3px solid var(--bad);padding:8px 0 8px 12px;margin:10px 0;font-size:14.3px;overflow-wrap:break-word}
.mistake .t{font-weight:600}
.mistake .m{color:var(--muted);margin-top:3px}
.legend{font-size:13px;color:var(--muted);margin-top:6px}

/* Режим распознавания микропрепаратов */
.micro-entry{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:18px 20px;margin:18px 0;border:1px solid var(--line);border-radius:18px;background:linear-gradient(120deg,#edf4ef,#fffdf8);color:var(--ink);cursor:pointer}
.micro-entry .micro-icon{font-size:28px}.micro-entry strong{display:block;font-size:16px;margin-bottom:4px}.micro-entry small{display:block;color:var(--muted);line-height:1.45}
.micro-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 18px}.micro-toggle{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 13px;font:inherit;font-size:13px;cursor:pointer}.micro-toggle.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.micro-image{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;margin:12px auto 16px;max-width:680px}.micro-image .slide-img{max-width:100%;margin:0 auto}.micro-image img{max-height:390px;object-fit:contain}.micro-source{font-size:12px;color:var(--muted);margin:8px 2px 0;line-height:1.4}
.micro-prompt{font:600 19px/1.4 'Inter',sans-serif;margin:12px 0}.micro-note{font-size:13px;color:var(--muted);line-height:1.5;background:#f3f1e9;border-radius:12px;padding:11px 13px;margin:12px 0}.micro-feedback{padding:14px;border-radius:14px;margin-top:14px;line-height:1.55}.micro-feedback.good{background:#e8f3ed;border:1px solid #b9d8c7}.micro-feedback.bad{background:#f8ece8;border:1px solid #e7c5bb}.micro-stat{font-size:13px;color:var(--muted)}
@media(max-width:560px){.micro-entry{padding:14px}.micro-prompt{font-size:17px}.micro-image{padding:6px}.micro-image img{max-height:280px}.micro-toolbar{gap:6px}}


/* v2.3 — комплексное описание микропрепарата */
.complex-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.complex-field{min-width:0}.complex-field label{display:block;font-weight:650;font-size:14px;margin:0 0 6px}
.complex-field select{width:100%;min-height:46px;border:1px solid var(--line,#d8ddd4);border-radius:12px;padding:10px;background:var(--card,#fff);color:inherit;font:inherit}
.complex-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.complex-feedback{margin-top:14px;padding:14px;border-radius:14px;background:var(--soft,#f2f4ee);line-height:1.55}
.complex-feedback .ok{color:#23734b}.complex-feedback .bad{color:#a34236}.complex-progress{font-size:13px;color:var(--muted,#777);margin:8px 0}
@media(max-width:560px){.complex-grid{grid-template-columns:1fr}.complex-actions>*{width:100%}.complex-field select{font-size:16px}}

</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>

const C={gp:'#6b4fa0', gn:'#b4443a', ink:'#1d2321', mut:'#6b7570', line:'#cdc8ba', ok:'#2f6f5e'};

function cocci(kind){
  const f=C.gp;
  const lab={staph:'Стафилококки — гроздья',strep:'Стрептококки — цепочка',diplo:'Диплококки — парами',tetrad:'Тетрады — по четыре',sarcina:'Сарцины — пакеты'}[kind];
  let cells='';
  const dot=(x,y,fill=f)=>`<circle cx="${x}" cy="${y}" r="11" fill="${fill}" opacity=".85"/>`;
  if(kind==='staph'){const p=[[60,40],[82,32],[80,56],[102,46],[58,64],[100,70],[122,60],[78,80]];cells=p.map(([x,y])=>dot(x,y)).join('');}
  if(kind==='strep'){cells=[0,1,2,3,4,5].map(i=>dot(45+i*22,56)).join('');}
  if(kind==='diplo'){cells=dot(60,56)+dot(82,56)+dot(120,56)+dot(142,56);}
  if(kind==='tetrad'){cells=dot(66,44)+dot(88,44)+dot(66,66)+dot(88,66);}
  if(kind==='sarcina'){cells=dot(60,40)+dot(82,40)+dot(60,62)+dot(82,62)+dot(72,51,'#8a6cc0')+dot(94,51,'#8a6cc0');}
  return `<svg viewBox="0 0 200 110" xmlns="http://www.w3.org/2000/svg"><rect width="200" height="110" rx="8" fill="#fbf9f4"/>${cells}<text x="100" y="101" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" fill="${C.mut}">${lab}</text></svg>`;
}

<text x="30" y="282" font-size="10.5" fill="${C.ink}">они докрашиваются фуксином в красный. Гр+ удерживают комплекс и остаются фиолетовыми.</text>
</svg>`;

<text x="176" y="138" font-size="9.5" fill="${C.gn}">плазмиды</text>

{
  id:'1.1', title:'Морфологические группы бактерий', qs:'Вопросы: 29, 37',
  theory:[
    {h:'Три основные формы бактерий', img:SVG_MORPH, body:`
      <p>Форма и расположение клеток — первое, что видно в мазке. От этого зависит дальнейший ход диагностики.</p>
      <div class="facts">
        <div class="fact"><strong>Кокки</strong>По расположению клеток различают микрококки (одиночные), диплококки (парами), стрептококки (цепочки), тетрады (по 4), сарцины (пакеты), стафилококки (гроздья).</div>
        <div class="fact"><strong>Палочки</strong>По спорам: бактерии (нет), бациллы и клостридии (есть). По форме: прямые, булавовидные (коринебактерии), ветвящиеся (микобактерии).</div>
        <div class="fact"><strong>Извитые</strong>По числу завитков: вибрион (1) → спирилла → боррелия (крупные) → трепонема / лептоспира (мелкие).</div>
      </div>
      <p><b>Примеры:</b> кокки — <i>S. aureus</i>, <i>S. pyogenes</i>, <i>N. meningitidis</i>; палочки — <i>E. coli</i>, <i>C. diphtheriae</i>, <i>B. anthracis</i>; извитые — <i>V. cholerae</i>, <i>T. pallidum</i>, <i>B. burgdorferi</i>.</p>`},
    {h:'Как выглядят в реальном мазке', img:'', body: PHOTO_STAPH + PHOTO_STREP + `
      <div class="facts">
        <div class="fact"><strong>Ключ к распознаванию</strong>Смотри не только форму, но и взаимное расположение клеток после деления — это определяет группу.</div>
        <div class="fact"><strong>Гр+ vs Гр− кокки</strong>Фиолетовые гроздья/цепочки — стафило- и стрептококки. Красные диплококки (бобовидные) — нейссерии.</div>
      </div>`}

{

  theory:[
    {h:'Обязательные и необязательные структуры', img:SVG_CELL, body:`
      <p>Каркас ответа на вопрос «органоиды бактериальной клетки».</p>
      <div class="fact-row">
        <div class="fact"><strong>Обязательные</strong>ЦПМ, цитоплазма, нуклеоид и рибосомы 70S; клеточная стенка имеется у большинства бактерий, но отсутствует, например, у микоплазм.</div>
        <div class="fact"><strong>Необязательные</strong>Капсула, жгутики, фимбрии, спора, плазмиды, включения.</div>
      </div>

{

  theory:[
    {h:'Строение стенки и окраска по Граму', img:SVG_WALL, body:`
      <p>Самая «рабочая» схема курса: от неё зависят окраска, действие антибиотиков и патогенез.</p>
      <div class="fact-row">
        <div class="fact"><strong>Гр+</strong>Толстый пептидогликан (~40 слоёв), тейхоевые кислоты, нет наружной мембраны.</div>
        <div class="fact"><strong>Гр−</strong>Тонкий пептидогликан (1–2 слоя), наружная мембрана с ЛПС (эндотоксин), периплазма с β-лактамазами.</div>
      </div>
      <div class="facts">
        <div class="fact"><strong>Диагностическое значение</strong>Гр− сепсис → эндотоксиновый шок. Гр− хуже проницаемы для многих антибиотиков. Пептидогликана нет у человека → избирательность β-лактамов.</div>

  quiz:[

     e:'У Гр− есть наружная мембрана с ЛПС (эндотоксин). Пептидогликан тонкий. Тейхоевые кислоты — у Гр+.', h:'Что даёт эндотоксиновый шок?'},
    {q:'Окраска по Граму обусловливается особенностями строения:', o:['цитоплазматической мембраны','нуклеоида','клеточной стенки','капсулы'], a:2,
     e:'Толстый пептидогликан Гр+ удерживает комплекс генцианвиолет–йод. У Гр− комплекс вымывается.', h:'Через что спирт вымывает краситель?'},
    {q:'Миколовые кислоты характерны для:', o:['стафилококков','микобактерий','клостридий','нейссерий'], a:1,
     e:'Миколовые кислоты → кислотоустойчивость. Выявляют по Цилю–Нильсену.', h:'Красные палочки на синем.'},
    {q:'Эндотоксин грамотрицательных бактерий — это:', o:['экзотоксин белковой природы','липополисахарид наружной мембраны','тейхоевая кислота','пептидогликан'], a:1,
     e:'ЛПС наружной мембраны = эндотоксин. Вызывает лихорадку, шок, активацию комплемента.', h:'Часть стенки Гр−.'},
    {q:'Почему β-лактамы избирательно действуют на бактерии?', o:['разрушают ЦПМ','ингибируют синтез пептидогликана, которого нет у человека','блокируют рибосомы 80S','нарушают синтез ДНК'], a:1,
     e:'Пептидогликан есть только у бактерий (и некоторых архей). Человек его не синтезирует.', h:'Мишень уникальна для прокариот.'},
    {q:'Периплазматическое пространство характерно для:', o:['грамположительных','грамотрицательных','микоплазм','всех бактерий'], a:1,
     e:'У Гр− между ЦПМ и наружной мембраной есть периплазма, где находятся β-лактамазы.', h:'Между двумя мембранами.'},
    {q:'Какой краситель используется для докрашивания при окраске по Граму?', o:['генцианвиолет','раствор Люголя','фуксин или сафранин','метиленовый синий'], a:2,
     e:'После обесцвечивания спиртом Гр− клетки бесцветны и докрашиваются фуксином/сафранином в красный.', h:'Контрастный краситель.'}

{
  id:'1.4', title:'Методы окраски', qs:'Вопросы: 53',
  theory:[
    {h:'Простые и сложные окраски', img:SVG_STAIN, body:`
      <p>Окраски делят на <b>простые</b> (один краситель — форма и расположение) и <b>сложные / дифференциальные</b> (конкретная структура или свойство).</p>
      <div class="facts">
        <div class="fact"><strong>Схема ответа на билет</strong>Цель окраски → выявляемая структура → результат → возбудитель-пример.</div>
        <div class="fact"><strong>Грам</strong>Различия клеточной стенки → типичные Гр+ фиолетовые / Гр− красные; возможны атипичные реакции.</div>
        <div class="fact"><strong>Циль–Нильсен</strong>Кислотоустойчивость (миколовые кислоты) → красные палочки на синем. Микобактерии, нокардии.</div>
        <div class="fact"><strong>Нейссер</strong>Зёрна волютина → синие включения на концах. C. diphtheriae.</div>
        <div class="fact"><strong>Бурри–Гинс</strong>Капсула → неокрашенный ободок. K. pneumoniae, пневмококк.</div>
        <div class="fact"><strong>Ожешко</strong>Спора → спора красная, вегетативное тело синее. Бациллы, клостридии.</div>
      </div>`}
  ],
  quiz:[
    {q:'Метод Циля–Нильсена применяют для выявления:', o:['спор','капсулы','кислотоустойчивых бактерий','зёрен волютина'], a:2,
     e:'Кислотоустойчивость (миколовые кислоты). Микобактерии и нокардии — красные на синем.', h:'Красные палочки на синем в мокроте.'},
    {q:'В мазке из зева ребёнка с налётами видны Гр+ палочки с утолщениями на концах. Какая окраска подтвердит диагноз?', o:['Циль–Нильсен','Нейссер','Бурри–Гинс','Ожешко'], a:1,
     e:'Коринебактерии дифтерии. По Нейссеру — зёрна волютина (тельца Бабеша–Эрнста).', h:'Буллавовидность концов.'},
    {q:'Окраска по Бурри–Гинсу выявляет:', o:['споры','капсулу','кислотоустойчивость','жгутики'], a:1,
     e:'Тушь + фуксин: капсула — неокрашенный ободок. K. pneumoniae, пневмококк.', h:'Неокрашенный ободок.'},
    {q:'Для выявления спор используют окраску:', o:['по Граму','по Цилю–Нильсену','по Ожешко','по Нейссеру'], a:2,
     e:'Ожешко: спора красная, вегетативная клетка синяя. Применяют для бацилл и клостридий.', h:'Красная спора, синее тело.'},
    {q:'Простая окраска позволяет определить:', o:['вид возбудителя','форму и расположение клеток','чувствительность к антибиотикам','наличие капсулы'], a:1,
     e:'Один краситель даёт только морфологию (форма, размер, расположение). Для структур — сложные окраски.', h:'Что видно без дифференциации?'},
    {q:'Окраска по Романовскому–Гимзе используется для:', o:['микобактерий','спирохет, риккетсий, хламидий','стафилококков','клостридий'], a:1,
     e:'Тонкие извитые формы (трепонемы, боррелии), риккетсии, хламидии хорошо видны при этой окраске.', h:'Тонкие извитые и внутриклеточные.'},
    {q:'Какая окраска является сложной (дифференциальной)?', o:['метиленовым синим','фуксином','по Граму','водным раствором сафранина'], a:2,
     e:'Грам — классическая сложная окраска: несколько реактивов, выявляет свойства стенки.', h:'Несколько реактивов и дифференциация.'}
  ]
},
{

  theory:[
    {h:'Выбор метода микроскопии', img:SVG_SCOPES, body:`

        <div class="fact"><strong>Нативные препараты</strong>Подвижность → темнопольная, фазово-контрастная.</div>
        <div class="fact"><strong>Окрашенный мазок</strong>Иммерсионная световая ×900–1000 (объектив ×90–100 + окуляр ×10).</div>
        <div class="fact"><strong>Антигены в материале</strong>Люминесцентная (РИФ).</div>
        <div class="fact"><strong>Вирусы, ультраструктура</strong>Электронная микроскопия.</div>
        <div class="fact"><strong>Ограничение бактериоскопии</strong>Даёт предварительный ответ (форма, расположение, отношение к окраске). Вид обычно — культурально или молекулярно.</div>
        <div class="fact"><strong>Исключения</strong>Гонорея, менингит, туберкулёз (скрининг), сифилис (темнопольная) — бактериоскопия часто решает.</div>

     e:'Окраска по Граму требует фиксации — клетки мертвы. Живые клетки смотрят без окраски.', h:'Какой вариант убивает клетку?'},
    {q:'Бактериоскопический метод позволяет:', o:['всегда установить вид','дать предварительный ответ о морфологии и тинкториальных свойствах','определить чувствительность к антибиотикам','выявить гены вирулентности'], a:1,
     e:'Быстрый предварительный ответ. Вид — культурально/молекулярно, чувствительность — отдельно.', h:'Главное ограничение.'},
    {q:'Темнопольную микроскопию применяют для выявления:', o:['микобактерий','подвижных спирохет (лептоспиры, трепонемы)','капсулы','спор'], a:1,
     e:'Живые подвижные тонкие бактерии светятся на тёмном фоне. Классика — лептоспиры, бледная трепонема.', h:'Живые и подвижные.'},
    {q:'Разрешение светового микроскопа примерно:', o:['0,2 нм','0,2 мкм','2 мкм','20 мкм'], a:1,
     e:'≈ 0,2 мкм. Поэтому вирусы (наноразмер) в световом микроскопе не видны — нужна электронная.', h:'Почему вирусы не видны?'},
    {q:'РИФ (реакция иммунофлуоресценции) относится к методам:', o:['электронной микроскопии','люминесцентной микроскопии','темнопольной','фазово-контрастной'], a:1,
     e:'Меченые антитела + флуорохром. Смотрят в люминесцентном микроскопе. Применяют для быстрой индикации антигенов.', h:'Светящиеся антитела.'},
    {q:'Иммерсионное масло необходимо для:', o:['окраски мазка','увеличения контраста','устранения преломления лучей на границе стекло–воздух','фиксации препарата'], a:2,
     e:'Показатель преломления масла близок к стеклу → лучи не рассеиваются, достигается максимальное разрешение объектива.', h:'Оптика, не окраска.'}

addTheory('1.1',[
{h:'Кокки: плоскости деления',img:SVG_MORPH,body:`<p>Кокки — сферические, овальные, бобовидные или ланцетовидные клетки. Их взаимное расположение зависит от плоскостей деления и сохранения связи между дочерними клетками.</p><div class="facts"><div class="fact"><strong>Одна плоскость</strong>Пары — диплококки; цепочки — стрептококки.</div><div class="fact"><strong>Две плоскости</strong>Тетрады из четырёх клеток.</div><div class="fact"><strong>Три плоскости</strong>Пакеты из 8, 16 или 32 клеток — сарцины.</div><div class="fact"><strong>Стафилококки</strong>Скопления напоминают виноградные гроздья.</div></div>`},
{h:'Палочковидные бактерии',img:SVG_MORPH,body:`<p>Палочки различаются длиной, диаметром, формой концов и взаимным расположением. В пособии указаны размеры: длина 1–8 мкм, диаметр 0,5–2 мкм.</p><div class="facts"><div class="fact"><strong>Монобактерии</strong>Располагаются поодиночке.</div><div class="fact"><strong>Диплобактерии</strong>Образуют пары.</div><div class="fact"><strong>Стрептобактерии</strong>Располагаются цепочками.</div><div class="fact"><strong>Форма</strong>Правильная — E. coli; неправильная/булавовидная — Corynebacterium diphtheriae.</div></div><p>Спорообразующие представители — роды Bacillus и Clostridium.</p>`},
{h:'Извитые и нитчатые формы',img:SVG_MORPH,body:`<div class="facts"><div class="fact"><strong>Вибрионы</strong>Изогнуты в форме запятой, один завиток.</div><div class="fact"><strong>Спириллы</strong>Имеют 2–5 крупных завитков; к изогнутым формам относят также Helicobacter и Campylobacter.</div><div class="fact"><strong>Спирохеты</strong>Имеют множество завитков; примеры — трепонемы, лептоспиры, боррелии.</div><div class="fact"><strong>Нитчатые</strong>Тонкие септированные ветвящиеся нити, способные образовывать мицелий; примеры — актиномицеты и нокардии.</div></div>`},
{h:'Полиморфные бактерии',img:'',body:`<p>У полиморфных бактерий форма и размеры клеток могут изменяться внутри одного вида.</p><div class="facts"><div class="fact"><strong>Хламидии</strong>Мелкие грамотрицательные бактерии шаровидной или овоидной формы; облигатные внутриклеточные паразиты.</div><div class="fact"><strong>Риккетсии</strong>Мелкие грамотрицательные облигатные внутриклеточные паразиты; форма может быть палочковидной, нитевидной или неправильной.</div><div class="fact"><strong>Микоплазмы</strong>Не имеют клеточной стенки, окружены ЦПМ; могут быть кокковидными, нитевидными или колбовидными.</div></div><p>Микоплазмы не окрашиваются обычными методами, основанными на свойствах клеточной стенки.</p>`},
{h:'Как описывать бактерии в мазке',img:'',body:`<p>При микроскопическом описании двигайся по единому алгоритму.</p><ol><li>Определи форму: кокки, палочки, извитые или нитчатые.</li><li>Опиши взаимное расположение: одиночно, пары, цепочки, скопления.</li><li>Укажи тинкториальные свойства, если препарат окрашен.</li><li>Отметь дополнительные структуры, если метод позволяет их выявить.</li></ol><p>Морфология формирует предварительное заключение, но не всегда позволяет определить вид.</p>`}
]);

addTheory('1.2',[
{h:'Цитоплазматическая мембрана',img:SVG_CELL,body:`<p>ЦПМ — белково-липидная структура, ограничивающая цитоплазму и обеспечивающая избирательный транспорт.</p><div class="facts"><div class="fact"><strong>Барьер</strong>Регулирует поступление воды и низкомолекулярных веществ.</div><div class="fact"><strong>Транспорт</strong>Перенос веществ обеспечивают специализированные мембранные системы и белки-переносчики.</div><div class="fact"><strong>Энергетика</strong>В ЦПМ расположены компоненты электрон-транспортной цепи и ферменты окислительного фосфорилирования.</div><div class="fact"><strong>Синтез</strong>Участвует в синтезе клеточной стенки и капсулы; к ней прикрепляются жгутики.</div></div>`},
{h:'Нуклеоид, рибосомы и плазмиды',img:SVG_PRO_EU,body:`<div class="facts"><div class="fact"><strong>Нуклеоид</strong>Эквивалент ядра бактерии: обычно кольцевая двунитевая ДНК, плотно упакованная в центральной зоне; ядерной оболочки нет.</div><div class="fact"><strong>Рибосомы 70S</strong>Состоят из субъединиц 30S и 50S; обеспечивают синтез белка.</div><div class="fact"><strong>Плазмиды</strong>Внехромосомные факторы наследственности, способные автономно реплицироваться или интегрироваться с хромосомой.</div><div class="fact"><strong>Варианты плазмид</strong>R — устойчивость к антибиотикам; F — конъюгация; Col — продукция бактериоцинов.</div></div>`},
{h:'Жгутики: строение и расположение',img:SVG_FLAGELLA,body:`<p>Жгутики — органеллы движения, состоящие из белка флагеллина. Жгутик включает нить, крюк и базальное тельце.</p><div class="facts"><div class="fact"><strong>Монотрих</strong>Один жгутик на полюсе; пример — Vibrio.</div><div class="fact"><strong>Лофотрих</strong>Пучок жгутиков на одном или обоих полюсах.</div><div class="fact"><strong>Амфитрих</strong>По жгутику на обоих полюсах.</div><div class="fact"><strong>Перитрих</strong>Жгутики по всей поверхности; примеры — E. coli и Salmonella.</div></div><p>Жгутики выявляют специальными методами окраски или электронной микроскопией.</p>`},
{h:'Пили и фимбрии',img:'',body:`<p>Пили (ворсинки, фимбрии) короче и тоньше жгутиков; состоят из белка пилина.</p><div class="facts"><div class="fact"><strong>Общие фимбрии</strong>Обеспечивают прикрепление к поверхности субстрата и клеткам хозяина — адгезию.</div><div class="fact"><strong>Половые F-пили</strong>Формируются у клеток-доноров, несущих F-плазмиду или родственные плазмиды.</div><div class="fact"><strong>Конъюгация</strong>F-пили участвуют в образовании пары и переносе генетического материала.</div></div><p>Не путай: жгутик — движение; фимбрии — прикрепление; половые пили — конъюгация.</p>`},
{h:'Капсула, слизь и эндоспора',img:SVG_CELL,body:`<p>Капсула и слизь располагаются снаружи клеточной стенки. Эндоспора — покоящаяся форма у отдельных родов бактерий.</p><div class="facts"><div class="fact"><strong>Капсула</strong>Часто полисахаридная; у Bacillus anthracis описана полипептидная капсула. Защищает от высыхания и фагоцитоза, участвует в адгезии.</div><div class="fact"><strong>Микро- и макрокапсула</strong>В пособии микро- менее 0,2 мкм, макрокапсула — более 0,2 мкм.</div><div class="fact"><strong>Слизь</strong>Не имеет чёткой организации капсулы; может обильно образовываться на сахарсодержащих средах.</div><div class="fact"><strong>Эндоспора</strong>Образуется при неблагоприятных условиях. Одна клетка формирует одну спору — это не размножение.</div></div>`}
]);

{h:'Пептидогликан — каркас клеточной стенки',img:SVG_WALL_DETAIL,body:`<p>Пептидогликан (муреин) придаёт клеточной стенке ригидность и помогает противостоять осмотическому давлению.</p><div class="facts"><div class="fact"><strong>Гликановые цепи</strong>Состоят из повторяющихся остатков N-ацетилглюкозамина и N-ацетилмурамовой кислоты.</div><div class="fact"><strong>Поперечные связи</strong>Гликановые цепи соединены пептидными мостиками.</div><div class="fact"><strong>Функции стенки</strong>Форма клетки, защита от осмотического лизиса, участие в делении, адгезии и взаимодействии с бактериофагами.</div></div>`},
{h:'Грамположительная клеточная стенка',img:SVG_WALL_DETAIL,body:`<p>У Гр+ бактерий стенка толстая; основную массу составляет многослойный пептидогликан.</p><div class="facts"><div class="fact"><strong>Пептидогликан</strong>В пособии указан диапазон 40–90% массы стенки.</div><div class="fact"><strong>Тейхоевые кислоты</strong>Связаны с пептидогликаном; представлены полимерами глицерол- и рибитолфосфата.</div><div class="fact"><strong>Липотейхоевые кислоты</strong>Гидрофобно связаны с цитоплазматической мембраной.</div><div class="fact"><strong>Наружная мембрана</strong>Отсутствует.</div></div>`},
{h:'Грамотрицательная стенка и ЛПС',img:SVG_WALL_DETAIL,body:`<p>У Гр− бактерий тонкий слой пептидогликана расположен между ЦПМ и наружной мембраной; между мембранами находится периплазма.</p><div class="facts"><div class="fact"><strong>Наружная мембрана</strong>Содержит липополисахарид и белки-порины.</div><div class="fact"><strong>Липид А</strong>Токсическая часть ЛПС, выполняющая роль эндотоксина.</div><div class="fact"><strong>Коровая часть</strong>Относительно консервативная олигосахаридная структура.</div><div class="fact"><strong>О-антиген</strong>Высоковариабельная полисахаридная часть, используемая в антигенной дифференцировке.</div></div><p>Пособие описывает гладкие S-формы и шероховатые R-формы колоний при изменениях ЛПС.</p>`},
{h:'Кислотоустойчивые бактерии и L-формы',img:PHOTO_ACIDFAST,body:`<p>К кислотоустойчивым бактериям относят микобактерии и нокардии. Их клеточная стенка богата липидами.</p><div class="facts"><div class="fact"><strong>Миколовые кислоты</strong>Входят в состав наружных слоёв стенки и связаны с кислотоустойчивостью.</div><div class="fact"><strong>Корд-фактор</strong>В пособии указан как фактор вирулентности микобактерий.</div><div class="fact"><strong>L-формы</strong>Варианты бактерий, лишённые пептидогликана; имеют изменчивую форму и осмотическую чувствительность.</div></div><p>Для дифференциации кислотоустойчивых бактерий применяют окраску по Цилю–Нильсену.</p>`}
]);

{h:'Подготовка мазка к окраске',img:SVG_SMEAR_FLOW,body:`<p>Для световой микроскопии материал наносят на чистое обезжиренное предметное стекло тонким слоем.</p><div class="facts"><div class="fact"><strong>Высушивание</strong>Мазок оставляют на воздухе до полного высыхания.</div><div class="fact"><strong>Фиксация</strong>Закрепляет клетки на стекле, обезвреживает материал и повышает восприимчивость к красителям.</div><div class="fact"><strong>Фиксация жаром</strong>В пособии описано проведение стекла мазком вверх через пламя 2–3 раза.</div><div class="fact"><strong>Жидкие фиксаторы</strong>Указаны смесь Никифорова, 5% формалин или метанол.</div></div><p>В правильно приготовленном препарате клетки должны располагаться преимущественно в один слой.</p>`},

addTheory('1.5',[
{h:'Устройство светового микроскопа',img:SVG_MICROSCOPE,body:`<p>Световой микроскоп включает механическую, осветительную и оптическую системы.</p><div class="facts"><div class="fact"><strong>Механическая</strong>Штатив, тубус, предметный столик, револьверная головка и механизмы фокусировки.</div><div class="fact"><strong>Осветительная</strong>Источник света, зеркало/осветитель и конденсор.</div><div class="fact"><strong>Оптическая</strong>Объективы и окуляр формируют увеличенное изображение.</div><div class="fact"><strong>Фокусировка</strong>Макрометрический винт — грубая наводка; микрометрический — точная настройка резкости.</div></div>`},
{h:'Увеличение и разрешающая способность',img:SVG_MICROSCOPE,body:`<p>Общее увеличение — произведение увеличения объектива на увеличение окуляра.</p><div class="facts"><div class="fact"><strong>Пример</strong>Объектив ×40 и окуляр ×10 дают ×400.</div><div class="fact"><strong>Иммерсия</strong>Объектив ×90–100 и окуляр ×10 дают ×900–1000.</div><div class="fact"><strong>Разрешающая способность</strong>Способность видеть раздельно две близко расположенные точки; она определяет детализацию, а не само увеличение.</div><div class="fact"><strong>Предел разрешения</strong>Для масляной иммерсии в пособии указан примерно 0,2 мкм.</div></div><p>Увеличение без улучшения разрешения не добавляет новых деталей.</p>`},
{h:'Иммерсионная система: зачем нужно масло',img:SVG_MICROSCOPE,body:`<p>Иммерсионная жидкость заполняет пространство между препаратом и фронтальной линзой объектива.</p><div class="facts"><div class="fact"><strong>Оптический принцип</strong>Показатель преломления масла близок к стеклу, поэтому уменьшаются потери света на границе стекло–воздух.</div><div class="fact"><strong>Объектив</strong>Обычно ×90 или ×100; числовая апертура иммерсионного объектива в пособии — 1,25.</div><div class="fact"><strong>Преимущество</strong>Повышается разрешающая способность, достигая примерно 0,2 мкм.</div></div><p>Масло не окрашивает и не фиксирует препарат — его задача оптическая.</p>`},
{h:'Работа с иммерсионным объективом',img:SVG_SMEAR_FLOW,body:`<ol><li>Настроить освещение при малом увеличении.</li><li>Нанести каплю иммерсионного масла на окрашенный мазок.</li><li>Установить объектив ×90–100.</li><li>Осторожно погрузить объектив в каплю, наблюдая сбоку.</li><li>Ориентировочно сфокусировать, затем довести резкость микрометрическим винтом.</li><li>После работы удалить масло с линзы и вернуть малый объектив.</li></ol><p><b>Важно:</b> не допускать контакта объектива с предметным стеклом; окончательную фокусировку проводить микрометрическим винтом.</p>`},
{h:'Виды микроскопии и их задачи',img:SVG_SCOPES,body:`<div class="facts"><div class="fact"><strong>Светлопольная</strong>Окрашенные фиксированные мазки; базовый метод бактериоскопии.</div><div class="fact"><strong>Темнопольная</strong>Нативные препараты; полезна для тонких подвижных микроорганизмов, например трепонем. ${PHOTO_TREPONEMA}</div><div class="fact"><strong>Фазово-контрастная</strong>Изучение живых неокрашенных клеток и подвижности. ${PHOTO_PHASE}</div><div class="fact"><strong>Люминесцентная</strong>Экспресс-диагностика некоторых инфекций и микозов, в том числе с мечеными антителами. ${PHOTO_FLUOR}</div><div class="fact"><strong>Электронная</strong>Изучение вирусов и ультраструктуры; разрешение выше, чем у светового микроскопа.</div></div>`},
{h:'Возможности и ограничения микроскопии',img:'',body:`<p>Микроскопический метод прост, доступен и позволяет быстро получить предварительную информацию.</p><div class="facts"><div class="fact"><strong>Что выявляет</strong>Морфологию, структуру и тинкториальные свойства микроорганизмов в клиническом материале или нативном препарате.</div><div class="fact"><strong>Преимущества</strong>Быстрота, доступность оборудования и методик.</div><div class="fact"><strong>Ограничения</strong>Сходство морфологии разных видов снижает специфичность; метод не определяет чувствительность к антибиотикам.</div><div class="fact"><strong>Не видны в обычной иммерсии</strong>Вирусы, микоплазмы и L-формы бактерий.</div></div><p>Для многих бактерий требуются культуральные, биохимические или молекулярно-биологические методы.</p>`}
]);

// v2.4: надёжное сохранение сессий и сводной статистики
const V24_KEY='micro_trainer_v24_state';
let V24_STATS={completed:0,answers:0,correct:0,sessions:{},lastActivity:null};
let V24_RESTORED=false;
function v24Snapshot(){
  return {
    version:1, savedAt:Date.now(),
    S:{...S,mod:S.mod?.id||null,first:S.first?[...S.first]:[]},
    MS:{...MS,tasks:MS.tasks.map(t=>t.caseId+'_'+t.taskNo),first:[...MS.first]},
    CX:{...CX,cases:CX.cases.map(c=>c.id)}
  };
}
function v24Save(){
  try{localStorage.setItem(V24_KEY,JSON.stringify(v24Snapshot()));}catch(e){}
}
function v24Record(type,score,total){
  V24_STATS.completed++;
  V24_STATS.sessions[type]=(V24_STATS.sessions[type]||0)+1;
  V24_STATS.answers+=Math.max(0,total||0);
  V24_STATS.correct+=Math.max(0,score||0);
  V24_STATS.lastActivity=Date.now();
  try{localStorage.setItem('micro_trainer_v24_stats',JSON.stringify(V24_STATS));}catch(e){}
}
function v24Restore(){
  if(V24_RESTORED)return; V24_RESTORED=true;
  try{
    const st=JSON.parse(localStorage.getItem('micro_trainer_v24_stats')||'null');
    if(st&&typeof st==='object')V24_STATS={...V24_STATS,...st};
    const raw=JSON.parse(localStorage.getItem(V24_KEY)||'null');
    if(!raw||raw.version!==1)return;
    if(raw.S){
      const x=raw.S; S={...S,...x};
      S.mod=typeof x.mod==='string'?MODULES.find(m=>m.id===x.mod)||null:null;
      S.first=new Set(Array.isArray(x.first)?x.first:[]);
      if(S.view==='theory'&&(!S.mod||!S.mod.theory[S.slide])){S.view='home';S.mod=null;S.slide=0;}
      if(S.view==='quiz'&&(!S.mod||!Array.isArray(S.order)||!S.order.length||S.qi>=S.order.length)){S.view='home';}
    }
    if(raw.MS){
      const x=raw.MS, map=new Map(allMicroTasks().map(t=>[t.caseId+'_'+t.taskNo,t]));
      MS={...MS,...x,tasks:(x.tasks||[]).map(k=>map.get(k)).filter(Boolean),first:new Set(x.first||[])};
      if(['microquiz'].includes(S.view)&&(!MS.tasks.length||MS.index>=MS.tasks.length))S.view='micro';
    }
    if(raw.CX){
      const x=raw.CX, map=new Map(COMPLEX_CASES.map(c=>[c.id,c]));
      CX={...CX,...x,cases:(x.cases||[]).map(k=>map.get(k)).filter(Boolean)};
      if(S.view==='complex'&&(!CX.cases.length||CX.index>=CX.cases.length))S.view='micro';
    }
  }catch(e){S.view='home';}
}
function v24Dashboard(){
 const pct=V24_STATS.answers?Math.round(V24_STATS.correct/V24_STATS.answers*100):0;
 return `<section class="card" style="margin:14px 0"><div class="row sp"><b>Мой прогресс</b><span class="tag">v2.4</span></div><div class="stats-grid" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px"><div><div class="big">${V24_STATS.completed}</div><small class="sub">завершено</small></div><div><div class="big">${V24_STATS.answers}</div><small class="sub">ответов</small></div><div><div class="big">${pct}%</div><small class="sub">точность</small></div></div><p class="sub" style="margin-bottom:0">Прогресс и незавершённые занятия сохраняются на этом устройстве.</p></section>`;
}
function render(){
  v24Restore(); v24Save();
  if(S.view==='home') return home();
  if(S.view==='theory') return theory();
  if(S.view==='quiz') return quiz();
  if(S.view==='done') return done();
  if(S.view==='micro') return microHome();
  if(S.view==='microquiz') return microQuiz();
  if(S.view==='microdone') return microDone();
  if(S.view==='complex') return complexQuiz();
  if(S.view==='complexdone') return complexDone();
}

function quiz(){
  const m = S.mod, idx = S.order[S.qi], q = m.quiz[idx];
  const letters = ['а','б','в','г','д'];
  const prog = Math.round((S.qi + (S.answered !== null ? 1 : 0)) / S.order.length * 100);
  const repeat = S.phase === 'repeat';
  app.innerHTML = `
  <div class="qmeta">

       </div>`}

window.showHint = () => { S.hint = true; render(); };
window.pick = i => {
  const idx = S.order[S.qi], q = S.mod.quiz[idx];
  S.answered = i;
  if(i === q.a){ if(S.phase === 'main') S.first.add(idx); S.wrong = S.wrong.filter(x => x !== idx); }
  else if(!S.wrong.includes(idx)) S.wrong.push(idx);
  render();
};
window.next = () => {
  S.answered = null; S.hint = false;
  if(S.qi < S.order.length - 1){ S.qi++; return render(); }
  if(S.wrong.length){ S.phase = 'repeat'; S.order = [...S.wrong]; S.qi = 0; return render(); }
  S.view = 'done';
  v24Record('quiz:'+S.mod.id,S.first.size,S.mod.quiz.length);
  const pct = Math.round(S.first.size / S.mod.quiz.length * 100);
  S.results[S.mod.id] = pct; save(); render();
};

function done(){
  const m = S.mod, pct = Math.round(S.first.size / m.quiz.length * 100);
  const missed = m.quiz.map((q,i) => ({q,i})).filter(({i}) => !S.first.has(i));
  const verdict = pct >= 90 ? 'Отличный результат — подмодуль можно считать закрытым.'
    : pct >= 70 ? 'Хорошо. Ниже — то, что стоит перечитать.'
    : 'Есть что подтянуть. Пролистай теорию ещё раз и пройди тест повторно.';
  const idx = SUB_IDS.indexOf(m.id);
  const nextId = idx >= 0 && idx < SUB_IDS.length - 1 ? SUB_IDS[idx + 1] : null;
  const nextMod = nextId ? MODULES.find(x => x.id === nextId) : null;

  app.innerHTML = `
  <div class="card" style="text-align:center">
    <div class="ring"><div class="big" style="color:${pct>=70?'var(--ok)':'var(--amber)'}">${pct}%</div></div>
    <h2>${S.first.size} из ${m.quiz.length} с первой попытки</h2>
    <p class="sub">${verdict}</p>
  </div>
  ${missed.length ? `<div class="card">
    <span class="tag">Вернуться к этому перед экзаменом</span>
    ${missed.map(({q}) => `<div class="mistake"><div class="t">${q.q.replace(/<[^>]+>/g,'')}</div>
      <div class="m">${q.o[q.a]} — ${q.e}</div></div>`).join('')}
  </div>` : ''}
  <div class="row" style="margin-top:16px;flex-wrap:wrap">
    <button class="btn" onclick="startQuiz()">Пройти тест заново</button>
    <button class="btn ghost" onclick="toTheory()">Перечитать теорию</button>
    ${nextMod ? `<button class="btn" onclick="openModById('${nextId}')">Следующий подмодуль → ${nextMod.title}</button>` : ''}
    <button class="btn ghost" onclick="goHome()">К модулям</button>
  </div>`;
  scrollTo(0,0);
}
window.toTheory = () => { S.view = 'theory'; S.slide = 0; render(); };
render();

</script>
</body>
